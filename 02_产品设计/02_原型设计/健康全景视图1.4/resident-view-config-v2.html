        function typeName(t) {
            return { metric: '指标卡', text: '文本块', title: '标题', bar: '横向柱状图', vbar: '纵向柱状图', line: '折线图', pie: '饼图',
                table: '横向表格', vtable: '纵向表格', custom: '自定义' } [t] || t;
        }

        // =====================================================
        // 组件渲染 — 优化后的医疗数据面板风格
        // =====================================================
        function renderWidgetBody(w) {
            const data = w.api && APIS[w.api] ? APIS[w.api].response : null;
            // 自定义代码优先
            if (w.customCode && w.customCode.js && String(w.customCode.js).trim()) {
                const r = runCustomCode(w, data);
                if (r && r.error) return `<div style="color:var(--danger);font-size:var(--font-size-caption);padding:12px;background:#FFF0F0;border:1px solid #ffccc7;border-radius:var(--r-sm);line-height:1.6">⚠ ${escapeHtml(r.error)}<br><span style="color:var(--text-tertiary);font-size:11px">请在右侧"自定义"中修正</span></div>`;
                if (r) return r.html || emptyData();
            }
            if (w.type === 'metric') {
                if (!data) return emptyData();
                const v = data[w.map.value];
                const d = data[w.map.delta] || '';
                const up = String(d).startsWith('+');
                const label = w.title || '指标';
                return `
                  <div class="metric-card">
                    <div class="metric-value">${v !== undefined && v !== null ? v : '—'}<span class="unit">${w.map.unit||''}</span></div>
                    <div class="metric-label">${escapeHtml(label)}</div>
                    ${d ? `<div class="metric-delta ${up?'up':'down'}"><span class="arrow">${up?'▲':'▼'}</span> ${String(d).replace(/^[+-]/,'')}</div>` : ''}
                    ${w.map.target && data[w.map.target] !== undefined ? `<div class="metric-sub">目标 ${data[w.map.target]}${w.map.unit||''} · 达成率 ${(v/data[w.map.target]*100).toFixed(0)}%</div>` : ''}
                  </div>`;
            }
            if (w.type === 'text') return `<div class="text-block" style="font-size:var(--font-size-body);color:var(--text-secondary);line-height:var(--line-height-relaxed);white-space:pre-wrap">${escapeHtml(w.map.text||'文本内容')}</div>`;
            if (w.type === 'title') return `<div style="font-size:var(--font-size-h3);font-weight:var(--font-weight-semibold);color:var(--text-primary);line-height:1.4">${escapeHtml(w.title)}</div>`;
            if (w.type === 'bar') return data ? renderBar(data, w.map) : emptyData();
            if (w.type === 'vbar') return data ? renderVBar(data, w.map) : emptyData();
            if (w.type === 'line') return data ? renderLine(data, w.map) : emptyData();
            if (w.type === 'pie') return data ? renderPie(data, w.map) : emptyData();
            if (w.type === 'table' || w.type === 'vtable') return data ? renderTable(data, w.table || {}) : emptyData();
            if (w.type === 'custom') return '<div class="text-block" style="color:var(--text-tertiary)">自定义组件 · 请在右侧"自定义"中编写 JS 渲染代码</div>';
            return '';
        }

        function emptyData() { return '<div class="text-block" style="color:var(--text-tertiary);font-size:var(--font-size-body)">未绑定数据</div>'; }

        // ===== 横向柱状图 =====
        function renderBar(data, map) {
            const items = data.map(d => ({ l: d[map.category], v: d[map.value] }));
            const max = Math.max(...items.map(i => i.v)) || 1;
            const bars = items.map((it) => {
                const pct = max ? (it.v / max * 100) : 0;
                return `<div class="bar-row">
                  <span class="bar-label" title="${escapeHtml(String(it.l))}">${escapeHtml(String(it.l))}</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,2)}%"></div></div>
                  <span class="bar-value">${it.v}</span>
                </div>`;
            }).join('');
            return `<div class="chart-wrap bar-chart" style="display:flex;flex-direction:column;gap:8px;justify-content:center;padding:4px 0">${bars}</div>`;
        }

        // ===== 纵向柱状图 =====
        function renderVBar(data, map) {
            const items = data.map(d => ({ l: d[map.category], v: d[map.value] }));
            const max = Math.max(...items.map(i => i.v)) || 1;
            const cols = items.map((it) => {
                const hPct = max ? (it.v / max * 100) : 0;
                return `<div class="vbar-col">
                  <span class="vbar-value">${it.v}</span>
                  <div class="vbar-track"><div class="vbar-fill" style="height:${Math.max(hPct,2)}%"></div></div>
                  <span class="vbar-label">${escapeHtml(String(it.l))}</span>
                </div>`;
            }).join('');
            return `<div class="chart-wrap vbar-chart">${cols}</div>`;
        }

        // ===== 折线图 =====
        function renderLine(data, map) {
            const items = data.map(d => ({ l: d[map.category], v: d[map.value] }));
            const max = Math.max(...items.map(i => i.v)) || 1;
            const min = Math.min(...items.map(i => i.v));
            const range = max - min || 1;
            const W = 400,
                H = 200,
                padL = 12,
                padR = 12,
                padT = 16,
                padB = 28;
            const n = items.length;
            const sx = i => padL + (W - padL - padR) / (n - 1) * i;
            const sy = v => H - padB - ((v - min) / range) * (H - padT - padB);
            const pts = items.map((it, i) => `${sx(i)},${sy(it.v)}`).join(' ');
            const dots = items.map((it, i) =>
                `<g class="pt-group" style="cursor:pointer">
                  <rect x="${sx(i)-12}" y="${padT}" width="24" height="${H-padT-padB}" fill="transparent"/>
                  <line x1="${sx(i)}" y1="${padT}" x2="${sx(i)}" y2="${H-padB}" stroke="#E8E8E8" stroke-width="1" stroke-dasharray="3,3" class="pt-line" opacity="0"/>
                  <circle cx="${sx(i)}" cy="${sy(it.v)}" r="4" fill="#fff" stroke="#2B7FFF" stroke-width="2" class="pt-dot"/>
                  <title>${escapeHtml(String(it.l))}: ${it.v}</title>
                </g>`
            ).join('');
            const xlabs = items.filter((_, i) => i % 2 === 0 || i === n - 1).map((it) => {
                const idx = items.indexOf(it);
                return `<text x="${sx(idx)}" y="${H-6}" text-anchor="middle" font-size="12" fill="#8C9CAC">${escapeHtml(String(it.l))}</text>`;
            }).join('');
            return `<div class="chart-wrap line-chart" style="height:100%">
                <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block;border-radius:var(--r-sm)">
                  <polyline points="${pts}" fill="none" stroke="#2B7FFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
                  ${dots}
                  ${xlabs}
                </svg>
              </div>`;
        }

        // ===== 饼图（环形） =====
        function renderPie(data, map) {
            const items = data.map(d => ({ l: d[map.category], v: d[map.value] }));
            const total = items.reduce((s, i) => s + i.v, 0);
            const colors = ['#2B7FFF', '#4EB5FF', '#7AC7FF', '#A8D8FF', '#FFC644', '#34C759', '#FF7A9B', '#A86CFE'];
            const cx = 80,
                cy = 80,
                r = 68;
            let acc = 0;
            const slices = items.map((it, i) => {
                const start = acc / total * 2 * Math.PI,
                    end = (acc + it.v) / total * 2 * Math.PI;
                acc += it.v;
                const x1 = cx + r * Math.cos(start - Math.PI / 2),
                    y1 = cy + r * Math.sin(start - Math.PI / 2);
                const x2 = cx + r * Math.cos(end - Math.PI / 2),
                    y2 = cy + r * Math.sin(end - Math.PI / 2);
                const large = end - start > Math.PI ? 1 : 0;
                return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}"/>`;
            }).join('');
            const legend = items.map((it, i) => {
                const pct = total ? (it.v / total * 100).toFixed(1) : 0;
                return `<div class="li"><span class="dot" style="background:${colors[i%colors.length]}"></span>${escapeHtml(String(it.l))} <span class="pct">${it.v} (${pct}%)</span></div>`;
            }).join('');
            return `<div class="pie-chart">
                <div class="pie-ring">
                  <svg viewBox="0 0 160 160">${slices}<circle cx="${cx}" cy="${cy}" r="30" fill="#fff"/></svg>
                  <div class="pie-center"><span class="label">合计</span><span class="total">${total}</span></div>
                </div>
                <div class="pie-legend">${legend}</div>
              </div>`;
        }

        // =====================================================
        // 表格渲染
        // =====================================================
        function renderTable(data, table) {
            table = table || {};
            const cols = (table.columns || []).filter(c => c.visible !== false);
            if (!cols.length) return '<div class="text-block" style="color:var(--text-tertiary)">未配置可见列</div>';
            const cls = ['tbl'];
            if (table.striped) cls.push('striped');
            if (table.bordered) cls.push('bordered');
            if (table.showHeader === false) cls.push('no-header');
            const rows = Array.isArray(data) ? data : (data && typeof data === 'object' ? [data] : []);

            if (table.headerDirection === 'vertical') {
                return renderVerticalTable(rows, cols, table, cls);
            }
            const head = cols.map(c => `<th>${escapeHtml(c.title||c.field)}</th>`).join('');
            const body = rows.map(r => `<tr>${cols.map(c => `<td>${renderCell(r[c.field], c, r)}</td>`).join('')}</tr>`)
            .join('');
            return `<table class="${cls.join(' ')}"><thead><tr>${head}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}" style="text-align:center;color:var(--text-tertiary);padding:20px">${escapeHtml(table.emptyText||'暂无数据')}</td></tr>`}</tbody></table>`;
        }

        function renderVerticalTable(rows, cols, table, cls) {
            const keyField = table.verticalKeyField || '';
            const dataCols = cols.filter(c => c.field !== keyField);
            let head = '';
            if (table.showHeader !== false) {
                const corner = escapeHtml(table.verticalCornerText || (keyField ? '字段' : '序号'));
                const headers = rows.map((r, i) => {
                    const v = keyField ? r[keyField] : ('记录' + (i + 1));
                    return v === undefined || v === null || v === '' ? ('记录' + (i + 1)) : v;
                }).map(v => `<th>${escapeHtml(v)}</th>`).join('');
                head = `<tr><th>${corner}</th>${headers}</tr>`;
            }
            let body = '';
            if (!rows.length) {
                const span = dataCols.length + 1;
                body =
                    `<tr><td colspan="${span}" style="text-align:center;color:var(--text-tertiary);padding:20px">${escapeHtml(table.emptyText||'暂无数据')}</td></tr>`;
            } else {
                body = dataCols.map(c => {
                    const tds = rows.map(r => `<td>${renderCell(r[c.field], c, r)}</td>`).join('');
                    return `<tr><th>${escapeHtml(c.title||c.field)}</th>${tds}</tr>`;
                }).join('');
            }
            return `<table class="${cls.join(' ')}"><thead>${head}</thead><tbody>${body}</tbody></table>`;
        }

        function renderCell(val, col, row) {
            if (val === undefined || val === null || val === '') return '<span style="color:var(--text-placeholder)">—</span>';
            const o = col.styleOpts || {};
            switch (col.style) {
                case 'number': {
                    const n = Number(val);
                    if (isNaN(n)) return escapeHtml(val);
                    const s = o.thousands !== false ? n.toLocaleString('zh-CN', { minimumFractionDigits: o.decimals || 0,
                        maximumFractionDigits: o.decimals || 0 }) : n.toFixed(o.decimals || 0);
                    return `<span class="cell-num">${s}${o.unit?`<span class="unit">${escapeHtml(o.unit)}</span>`:''}</span>`;
                }
                case 'percent': {
                    const n = Number(val);
                    if (isNaN(n)) return escapeHtml(val);
                    const p = o.raw ? n : n * 100;
                    return `<span class="cell-percent">${p.toFixed(o.decimals||1)}%</span>`;
                }
                case 'progress': {
                    let n = Number(val);
                    if (isNaN(n)) return escapeHtml(val);
                    if (n > 100) n = 100;
                    if (n < 0) n = 0;
                    return `<div class="cell-progress"><div class="bar" style="width:${n}%"></div><div class="txt">${n.toFixed(0)}%</div></div>`;
                }
                case 'tag': {
                    const color = matchColorRule(val, o.colorRules);
                    if (color && color.startsWith('#')) {
                        return `<span class="tag" style="color:${color};background:${color}18">${escapeHtml(val)}</span>`;
                    }
                    return `<span class="tag ${color}">${escapeHtml(val)}</span>`;
                }
                case 'badge': {
                    const color = matchColorRule(val, o.colorRules);
                    if (color && color.startsWith('#')) {
                        return `<span class="badge" style="color:${color}"><span class="dot" style="background:${color}"></span>${escapeHtml(val)}</span>`;
                    }
                    return `<span class="badge ${color}"><span class="dot"></span>${escapeHtml(val)}</span>`;
                }
                case 'link': {
                    const href = (o.urlTemplate || '#').replace(/\{(\w+)\}/g, (_, k) => encodeURIComponent(row[k] ?? ''));
                    return `<a class="cell-link" href="${href}" onclick="event.preventDefault();toast('打开详情：${escapeHtml(String(val))}','info')">${escapeHtml(val)}</a>`;
                }
                case 'date': {
                    const fmt = o.format || 'YYYY-MM-DD';
                    const d = new Date(val);
                    if (isNaN(d.getTime())) return escapeHtml(val);
                    const pad2 = x => String(x).padStart(2, '0');
                    return escapeHtml(fmt.replace('YYYY', d.getFullYear()).replace('MM', pad2(d.getMonth() + 1)).replace('DD',
                        pad2(d.getDate())).replace('HH', pad2(d.getHours())).replace('mm', pad2(d.getMinutes())));
                }
                case 'text':
                default:
                    return escapeHtml(val);
            }
        }

        function matchColorRule(val, rules) {
            if (!rules || !rules.length) return 'gray';
            const s = String(val);
            for (const r of rules) {
                if (r.match === undefined || r.match === null || r.match === '') continue;
                if (s.indexOf(String(r.match)) >= 0) return r.color || 'gray';
            }
            return 'gray';
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' } [c]));
        }

        // =====================================================
        // 自定义代码
        // =====================================================
        function runCustomCode(w, rawData) {
            const cc = w.customCode;
            if (!cc || !cc.js || !String(cc.js).trim()) return null;
            try {
                const ctx = { escapeHtml, APIS, widget: w, Number, Math, Date, JSON };
                const fn = new Function('data', 'ctx', cc.js);
                const out = fn(rawData, ctx);
                if (out === undefined || out === null) return { html: '' };
                let html = String(out);
                if (cc.css && String(cc.css).trim()) {
                    html = '<style scoped>' + cc.css + '</style>' + html;
                }
                return { html: html };
            } catch (e) {
                return { error: '代码错误：' + e.message };
            }
        }

        function generateCustomCode(w) {
            const map = w.map || {};
            const t = w.table || {};
            const cols = (t.columns || []).filter(c => c.visible !== false);
            const je = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
            let render = '';
            switch (w.type) {
                // ============================================================
                //  指标卡 — 大数字 + 标签 + 同比 + 目标达成率
                // ============================================================
                case 'metric': {
                    const vf = map.value || 'value',
                        u = map.unit || '',
                        df = map.delta || '',
                        tf = map.target || '';
                    render = [
                        '/**',
                        ' * 指标卡渲染',
                        ' * @param {Object|Array} data - API 返回的原始响应数据',
                        ' * @param {Object} ctx     - 上下文工具集 (escapeHtml, APIS, widget, Number, Math 等)',
                        ' * @return {string} HTML 字符串',
                        ' */',
                        '',
                        '// ── 1. 提取数据 ──────────────────────────────────────────',
                        `var value  = data && data['${je(vf)}'] != null ? data['${je(vf)}'] : '—';`,
                        `var delta  = data && data['${je(df)}'] || '';`,
                        `var target = data && data['${je(tf)}'];`,
                        'var isUp   = String(delta).startsWith(\'+\');',
                        '',
                        '// ── 2. 构建 HTML ──────────────────────────────────────────',
                        'var html = \'\';',
                        'html += \'<div class="metric-card">\';',
                        '',
                        '// 数值行',
                        'html += \'<div class="metric-value">\';',
                        `html += value + '<span class="unit">${je(u)}</span>';`,
                        'html += \'</div>\';',
                        '',
                        '// 标题行',
                        'html += \'<div class="metric-label">\' + ctx.escapeHtml(ctx.widget.title) + \'</div>\';',
                        '',
                        '// 同比/环比 — 自动判断涨跌方向',
                        'if (delta) {',
                        '  var cls = isUp ? \'up\' : \'down\';',
                        '  var arrow = isUp ? \'▲\' : \'▼\';',
                        '  var clean = String(delta).replace(/^[+-]/, \'\');',
                        '  html += \'<div class="metric-delta \' + cls + \'"><span class="arrow">\' + arrow + \'</span> \' + clean + \'</div>\';',
                        '}',
                        '',
                        '// 目标达成率',
                        'if (target != null) {',
                        `  var rate = value !== '—' ? (value / target * 100).toFixed(0) : 0;`,
                        `  html += '<div class="metric-sub">目标 ' + target + '${je(u)} · 达成率 ' + rate + '%</div>';`,
                        '}',
                        '',
                        'html += \'</div>\';',
                        'return html;',
                    ].join('\n');
                    break;
                }
                // ============================================================
                //  文本块
                // ============================================================
                case 'text': {
                    const txt = je(map.text || '文本内容');
                    render = [
                        '/**',
                        ' * 文本块渲染',
                        ' */',
                        'var text = \'' + txt + '\';',
                        'return \'<div style="font-size:var(--font-size-body);color:var(--text-secondary);line-height:var(--line-height-relaxed);white-space:pre-wrap">\' + ctx.escapeHtml(text) + \'</div>\';',
                    ].join('\n');
                    break;
                }
                // ============================================================
                //  标题
                // ============================================================
                case 'title':
                    render = [
                        '/**',
                        ' * 标题渲染',
                        ' */',
                        'return \'<div style="font-size:var(--font-size-h3);font-weight:var(--font-weight-semibold);color:var(--text-primary);line-height:1.4">\' + ctx.escapeHtml(ctx.widget.title) + \'</div>\';',
                    ].join('\n');
                    break;
                // ============================================================
                //  横向柱状图
                // ============================================================
                case 'bar': {
                    const cf = map.category || 'label',
                        vf2 = map.value || 'value';
                    render = [
                        '/**',
                        ' * 横向柱状图渲染',
                        ' * 左对齐标签 → 填充条 → 数值（自动缩放至最大值）',
                        ' */',
                        '',
                        '// ── 1. 规范化数据 & 计算最大值 ──────────────────────────',
                        'var items = Array.isArray(data) ? data : [data];',
                        'var maxVal = 0;',
                        'items.forEach(function(row) {',
                        `  var v = Number(row['${je(vf2)}']) || 0;`,
                        '  if (v > maxVal) maxVal = v;',
                        '});',
                        '',
                        '// ── 2. 渲染每一行 ────────────────────────────────────────',
                        'var html = \'<div class="chart-wrap bar-chart" style="display:flex;flex-direction:column;gap:8px;justify-content:center;padding:4px 0">\';',
                        'items.forEach(function(row, i) {',
                        `  var v   = Number(row['${je(vf2)}']) || 0;`,
                        '  var pct = maxVal ? (v / maxVal * 100) : 0;',
                        `  var lbl = ctx.escapeHtml(row['${je(cf)}'] || '');`,
                        '  html += \'<div class="bar-row">\';',
                        '  html += \'<span class="bar-label" title="\' + lbl + \'">\' + lbl + \'</span>\';',
                        '  html += \'<div class="bar-track"><div class="bar-fill" style="width:\' + Math.max(pct, 2) + \'%"></div></div>\';',
                        '  html += \'<span class="bar-value">\' + v + \'</span>\';',
                        '  html += \'</div>\';',
                        '});',
                        'html += \'</div>\';',
                        'return html;',
                    ].join('\n');
                    break;
                }
                // ============================================================
                //  纵向柱状图
                // ============================================================
                case 'vbar': {
                    const cf5 = map.category || 'label',
                        vf5 = map.value || 'value';
                    render = [
                        '/**',
                        ' * 纵向柱状图渲染',
                        ' * 底部对齐的柱子 + 顶部数值 + 底部标签',
                        ' */',
                        '',
                        '// ── 1. 规范化数据 & 计算最大值 ──────────────────────────',
                        'var items = Array.isArray(data) ? data : [data];',
                        'var maxVal = 0;',
                        'items.forEach(function(row) {',
                        `  var v = Number(row['${je(vf5)}']) || 0;`,
                        '  if (v > maxVal) maxVal = v;',
                        '});',
                        '',
                        '// ── 2. 渲染每一列 ────────────────────────────────────────',
                        'var html = \'<div class="chart-wrap vbar-chart">\';',
                        'items.forEach(function(row, i) {',
                        `  var v    = Number(row['${je(vf5)}']) || 0;`,
                        '  var hPct = maxVal ? (v / maxVal * 100) : 0;',
                        `  var lbl  = ctx.escapeHtml(row['${je(cf5)}'] || '');`,
                        '  html += \'<div class="vbar-col">\';',
                        '  html += \'<span class="vbar-value">\' + v + \'</span>\';',
                        '  html += \'<div class="vbar-track"><div class="vbar-fill" style="height:\' + Math.max(hPct, 2) + \'%"></div></div>\';',
                        '  html += \'<span class="vbar-label">\' + lbl + \'</span>\';',
                        '  html += \'</div>\';',
                        '});',
                        'html += \'</div>\';',
                        'return html;',
                    ].join('\n');
                    break;
                }
                // ============================================================
                //  折线图 — SVG 渲染
                // ============================================================
                case 'line': {
                    const cf3 = map.category || 'label',
                        vf3 = map.value || 'value';
                    render = [
                        '/**',
                        ' * 折线图渲染 (SVG)',
                        ' * 使用内联 SVG 绘制折线 + 数据点 + X 轴标签',
                        ' */',
                        '',
                        '// ── 1. 数据准备 ───────────────────────────────────────────',
                        'var items = Array.isArray(data) ? data : [data];',
                        '',
                        `var vals = items.map(function(x) { return Number(x['${je(vf3)}']) || 0; });`,
                        'var maxVal = Math.max.apply(null, vals) || 1;',
                        'var minVal = Math.min.apply(null, vals);',
                        'var range  = maxVal - minVal || 1;',
                        '',
                        '// ── 2. 坐标系 ──────────────────────────────────────────────',
                        'var W  = 400, H  = 200;      // 画布尺寸',
                        'var pl = 12,  pr = 12;       // 左右内边距',
                        'var pt = 16,  pb = 28;       // 上下内边距',
                        'var n  = items.length;       // 数据点数量',
                        '',
                        '// X / Y 轴映射函数',
                        'function scaleX(i) { return pl + (W - pl - pr) / (n - 1) * i; }',
                        'function scaleY(v) { return H - pb - ((v - minVal) / range) * (H - pt - pb); }',
                        '',
                        '// ── 3. 折线路径 ──────────────────────────────────────────',
                        'var points = items.map(function(row, i) {',
                        `  return scaleX(i) + ',' + scaleY(Number(row['${je(vf3)}']) || 0);`,
                        '}).join(\' \');',
                        '',
                        '// ── 4. 数据点 + 悬停提示 ──────────────────────────────────',
                        'var dots = items.map(function(row, i) {',
                        `  var label = ctx.escapeHtml(row['${je(cf3)}'] || '');`,
                        `  var value = row['${je(vf3)}'] != null ? row['${je(vf3)}'] : '—';`,
                        '  var cx = scaleX(i);',
                        `  var cy = scaleY(Number(row['${je(vf3)}']) || 0);`,
                        '  return \'<g class="pt-group" style="cursor:pointer">\'',
                        '    + \'<rect x="\' + (cx - 12) + \'" y="\' + pt + \'" width="24" height="\' + (H - pt - pb) + \'" fill="transparent"/>\'',
                        '    + \'<line x1="\' + cx + \'" y1="\' + pt + \'" x2="\' + cx + \'" y2="\' + (H - pb) + \'" stroke="#E8E8E8" stroke-width="1" stroke-dasharray="3,3" class="pt-line" opacity="0"/>\'',
                        '    + \'<circle cx="\' + cx + \'" cy="\' + cy + \'" r="4" fill="#fff" stroke="#2B7FFF" stroke-width="2" class="pt-dot"/>\'',
                        '    + \'<title>\' + label + \': \' + value + \'</title>\'',
                        '    + \'</g>\';',
                        '}).join(\'\');',
                        '',
                        '// ── 5. X 轴标签（隔一个显示，首尾必显示）───────────────',
                        'var xLabels = items.filter(function(_, i) {',
                        '  return i % 2 === 0 || i === n - 1;',
                        '}).map(function(row) {',
                        '  var i = items.indexOf(row);',
                        `  return '<text x="' + scaleX(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="12" fill="#8C9CAC">' + ctx.escapeHtml(row['${je(cf3)}'] || '') + '</text>';`,
                        '}).join(\'\');',
                        '',
                        '// ── 6. 组装 SVG ──────────────────────────────────────────',
                        'var html = \'<div class="chart-wrap line-chart" style="height:100%">\';',
                        'html += \'<svg viewBox="0 0 \' + W + \' \' + H + \'" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block;border-radius:var(--r-sm)">\';',
                        'html += \'<polyline points="\' + points + \'" fill="none" stroke="#2B7FFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>\';',
                        'html += dots;',
                        'html += xLabels;',
                        'html += \'</svg></div>\';',
                        'return html;',
                    ].join('\n');
                    break;
                }
                // ============================================================
                //  饼图（环形图）— SVG 扇形 + 中心文字 + 图例
                // ============================================================
                case 'pie': {
                    const cf4 = map.category || 'label',
                        vf4 = map.value || 'value';
                    render = [
                        '/**',
                        ' * 饼图 / 环形图渲染 (SVG)',
                        ' * 环形饼图 + 中心合计 + 右侧图例',
                        ' */',
                        '',
                        '// ── 1. 数据准备 ───────────────────────────────────────────',
                        'var items = Array.isArray(data) ? data : [data];',
                        'var total = items.reduce(function(sum, row) {',
                        `  return sum + (Number(row['${je(vf4)}']) || 0);`,
                        '}, 0);',
                        '',
                        '// ── 2. 配色方案 ──────────────────────────────────────────',
                        'var COLORS = [',
                        '  \'#2B7FFF\', \'#4EB5FF\', \'#7AC7FF\', \'#A8D8FF\',',
                        '  \'#FFC644\', \'#34C759\', \'#FF7A9B\', \'#A86CFE\'',
                        '];',
                        '',
                        '// ── 3. 绘制扇形 ──────────────────────────────────────────',
                        'var cx = 80, cy = 80, radius = 68;',
                        'var accumulated = 0;',
                        'var html = \'<div class="pie-chart"><div class="pie-ring"><svg viewBox="0 0 160 160">\';',
                        '',
                        'items.forEach(function(row, i) {',
                        `  var value = Number(row['${je(vf4)}']) || 0;`,
                        '  var startAngle = accumulated / total * 2 * Math.PI;',
                        '  var endAngle   = (accumulated + value) / total * 2 * Math.PI;',
                        '  accumulated += value;',
                        '',
                        '  // 扇形起点 & 终点坐标',
                        '  var x1 = cx + radius * Math.cos(startAngle - Math.PI / 2);',
                        '  var y1 = cy + radius * Math.sin(startAngle - Math.PI / 2);',
                        '  var x2 = cx + radius * Math.cos(endAngle - Math.PI / 2);',
                        '  var y2 = cy + radius * Math.sin(endAngle - Math.PI / 2);',
                        '',
                        '  // large-arc-flag: 大于 180° 时置 1',
                        '  var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;',
                        '',
                        '  html += \'<path d="M \' + cx + \' \' + cy + \' L \' + x1 + \' \' + y1 + \' A \' + radius + \' \' + radius + \' 0 \' + largeArc + \' 1 \' + x2 + \' \' + y2 + \' Z" fill="\' + COLORS[i % COLORS.length] + \'"/>\';',
                        '});',
                        '',
                        '// 中心挖空（环形效果）',
                        'html += \'<circle cx="\' + cx + \'" cy="\' + cy + \'" r="30" fill="#fff"/>\';',
                        'html += \'</svg>\';',
                        '',
                        '// 中心文字',
                        'html += \'<div class="pie-center"><span class="label">合计</span><span class="total">\' + total + \'</span></div>\';',
                        'html += \'</div>\';',
                        '',
                        '// ── 4. 图例 ────────────────────────────────────────────────',
                        'html += \'<div class="pie-legend">\';',
                        'items.forEach(function(row, i) {',
                        `  var value = Number(row['${je(vf4)}']) || 0;`,
                        '  var pct   = total ? (value / total * 100).toFixed(1) : 0;',
                        `  var label = ctx.escapeHtml(row['${je(cf4)}'] || '');`,
                        '  html += \'<div class="li">\';',
                        '  html += \'<span class="dot" style="background:\' + COLORS[i % COLORS.length] + \'"></span>\';',
                        '  html += label + \' <span class="pct">\' + value + \' (\' + pct + \'%)</span>\';',
                        '  html += \'</div>\';',
                        '});',
                        'html += \'</div>\';',
                        '',
                        'html += \'</div>\';',
                        'return html;',
                    ].join('\n');
                    break;
                }
                // ============================================================
                //  表格（横向 / 纵向）
                // ============================================================
                case 'table':
                case 'vtable': {
                    const isV = t.headerDirection === 'vertical';
                    const cellStyle = 'style="padding:10px 14px;height:40px;border-bottom:1px solid var(--color-neutral-100);color:var(--text-secondary);font-size:var(--font-size-body)"';
                    const thStyle = 'style="text-align:left;padding:10px 14px;height:40px;background:var(--primary-header);color:var(--text-secondary);font-weight:600;font-size:var(--font-size-body);border-bottom:1px solid var(--color-neutral-200)"';
                    if (isV) {
                        // ── 纵向表格 ──
                        const keyF = t.verticalKeyField || '';
                        const dataCols = cols.filter(c => c.field !== keyF);
                        const colDefs = dataCols.map(c =>
                            `  { field: '${je(c.field)}', title: '${je(c.title || c.field)}' }`
                        ).join(',\n');
                        render = [
                            '/**',
                            ' * 纵向表格渲染',
                            ' * 字段名为行头、数据记录为列',
                            ' */',
                            '',
                            '// ── 1. 数据准备 ────────────────────────────────────────',
                            'var rows = Array.isArray(data) ? data : (data && typeof data === \'object\' ? [data] : []);',
                            '',
                            'var dataCols = [',
                            colDefs,
                            '];',
                            '',
                            '// ── 2. 单元格值渲染 ────────────────────────────────────',
                            'function renderCellVal(row, field) {',
                            '  var val = row[field];',
                            '  if (val == null || val === \'\') {',
                            '    return \'<span style="color:var(--text-placeholder)">—</span>\';',
                            '  }',
                            '  return ctx.escapeHtml(val);',
                            '}',
                            '',
                            '// ── 3. 构建表格 ────────────────────────────────────────',
                            'var h = \'<table class="tbl striped"><tbody>\';',
                            '',
                            'dataCols.forEach(function(col) {',
                            `  h += '<tr><th ${thStyle}>' + ctx.escapeHtml(col.title) + '</th>';`,
                            '  rows.forEach(function(row) {',
                            `    h += '<td ${cellStyle}>' + renderCellVal(row, col.field) + '</td>';`,
                            '  });',
                            '  h += \'</tr>\';',
                            '});',
                            '',
                            '// 空数据提示',
                            'if (!rows.length) {',
                            `  h += '<tr><td colspan="' + (dataCols.length + 1) + '" style="text-align:center;color:var(--text-tertiary);padding:20px">${je(t.emptyText || '暂无数据')}</td></tr>';`,
                            '}',
                            '',
                            'h += \'</tbody></table>\';',
                            'return h;',
                        ].join('\n');
                    } else {
                        // ── 横向表格 ──
                        const colDefs = cols.map(c =>
                            `  { field: '${je(c.field)}', title: '${je(c.title || c.field)}' }`
                        ).join(',\n');
                        const headerCells = cols.map(c =>
                            `  '<th ${thStyle}>' + ctx.escapeHtml('${je(c.title || c.field)}') + '</th>'`
                        ).join(' +\n');
                        const dataCellLines = cols.map(c =>
                            `    '<td ${cellStyle}>' + renderCellVal(row, '${je(c.field)}') + '</td>'`
                        ).join(' +\n');
                        render = [
                            '/**',
                            ' * 横向表格渲染',
                            ' * 标准表头 + 数据行',
                            ' */',
                            '',
                            '// ── 1. 列定义 ──────────────────────────────────────────',
                            'var cols = [',
                            colDefs,
                            '];',
                            '',
                            '// ── 2. 数据规范化 ──────────────────────────────────────',
                            'var rows = Array.isArray(data) ? data : (data && typeof data === \'object\' ? [data] : []);',
                            '',
                            '// ── 3. 单元格值渲染 ────────────────────────────────────',
                            'function renderCellVal(row, field) {',
                            '  var val = row[field];',
                            '  if (val == null || val === \'\') {',
                            '    return \'<span style="color:var(--text-placeholder)">—</span>\';',
                            '  }',
                            '  return ctx.escapeHtml(val);',
                            '}',
                            '',
                            '// ── 4. 构建表格 ────────────────────────────────────────',
                            'var h = \'<table class="tbl striped">\';',
                            '',
                            '// 表头',
                            'h += \'<thead><tr>\';',
                            'h +=',
                            headerCells,
                            ';',
                            'h += \'</tr></thead>\';',
                            '',
                            '// 数据行',
                            'h += \'<tbody>\';',
                            'rows.forEach(function(row) {',
                            '  h += \'<tr>\';',
                            '  h +=',
                            dataCellLines,
                            ';',
                            '  h += \'</tr>\';',
                            '});',
                            '',
                            '// 空数据提示',
                            'if (!rows.length) {',
                            `  h += '<tr><td colspan="' + cols.length + '" style="text-align:center;color:var(--text-tertiary);padding:20px">${je(t.emptyText || '暂无数据')}</td></tr>';`,
                            '}',
                            '',
                            'h += \'</tbody></table>\';',
                            'return h;',
                        ].join('\n');
                    }
                    break;
                }
                // ============================================================
                //  自定义 / 兜底
                // ============================================================
                default:
                    render = [
                        '/**',
                        ' * 自定义组件渲染',
                        ' * 在此编写您自己的渲染逻辑',
                        ' */',
                        'return \'<div style="font-size:var(--font-size-body);color:var(--text-secondary)">自定义内容</div>\';',
                    ].join('\n');
            }
            return { js: render, css: '' };
        }

        function switchCodeTab(tab) {
            if (tab === currentCodeTab) return;
            currentCodeTab = tab;
            renderConfig();
        }

        function initCustomCode(w) {
            if (!w) return;
            w.customCode = w.customCode || { css: '', js: '' };
            if (!w.customCode.js) {
                const generated = generateCustomCode(w);
                w.customCode.js = generated.js;
            }
            // 保留用户已编写的 CSS，仅在完全为空时填充模板注释
            if (!w.customCode.css || !w.customCode.css.trim()) {
                w.customCode.css = [
                    '/**',
                    ' * 自定义 CSS 样式',
                    ' * 选择器作用于当前组件内部，不影响其他组件',
                    ' * 可使用 CSS 变量（如 var(--primary)）保持风格统一',
                    ' */',
                    '',
                ].join('\n');
            }
        }

        function updateCustomCode(field, val) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            w.customCode = w.customCode || { css: '', js: '' };
            w.customCode[field] = val;
            renderCanvas();
        }

        function testCustomCode() {
            const w = widgets.find(x => x.id === selectedId);
            const out = document.getElementById('codeOutput');
            if (!w || !out) return;
            const data = w.api && APIS[w.api] ? APIS[w.api].response : null;
            const r = runCustomCode(w, data);
            out.style.display = 'block';
            if (!r) {
                out.className = 'code-output err';
                out.textContent = '✗ JS 代码为空，请先编写渲染代码';
            } else if (r.error) {
                out.className = 'code-output err';
                out.textContent = '✗ ' + r.error;
            } else {
                out.className = 'code-output ok';
                out.textContent = '✓ 运行成功，输出 ' + (r.html || '').length + ' 字符 HTML';
            }
        }

        function resetCustomCode() {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            w.customCode = { css: '', js: '' };
            renderConfig();
            renderCanvas();
            toast('已重置自定义代码', 'info');
        }

        function saveCustomCode() {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            w.customCode = w.customCode || { css: '', js: '' };
            renderCanvas();
            toast('自定义代码已保存', 'success');
        }

        function codeAreaKeydown(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const ta = e.target;
                const s = ta.selectionStart,
                    en = ta.selectionEnd;
                ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
                ta.selectionStart = ta.selectionEnd = s + 2;
            }
        }

        // =====================================================
        // 拖拽
        // =====================================================
        function onLibDragStart(e, type) {
            dragState = { kind: 'lib', type, widgetId: null };
            e.dataTransfer.effectAllowed = 'copy';
            e.dataTransfer.setData('text/plain', 'lib:' + type);
            e.currentTarget.classList.add('dragging');
        }

        function onWidgetDragStart(e, id) {
            e.stopPropagation();
            dragState = { kind: 'reorder', type: null, widgetId: id };
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', 'reorder:' + id);
            const widgetEl = e.target.closest('.widget');
            if (widgetEl) widgetEl.classList.add('dragging');
        }

        function onCanvasDragOver(e) {
            e.preventDefault();
            if (dragState.kind === 'lib') e.dataTransfer.dropEffect = 'copy';
            else if (dragState.kind === 'reorder') e.dataTransfer.dropEffect = 'move';
            document.getElementById('canvas').classList.add('drag-over');
        }

        function onCanvasDragLeave(e) {
            if (e.target === document.getElementById('canvas') || e.target === document.getElementById('grid')) {
                document.getElementById('canvas').classList.remove('drag-over');
            }
        }

        function onCanvasDrop(e) {
            e.preventDefault();
            document.getElementById('canvas').classList.remove('drag-over');
            const targetWidget = e.target.closest('.widget');
            let insertIndex = widgets.length;
            if (targetWidget) {
                const tid = +targetWidget.dataset.id;
                const rect = targetWidget.getBoundingClientRect();
                const midX = rect.left + rect.width / 2;
                const ti = widgets.findIndex(w => w.id === tid);
                if (e.clientX < midX) insertIndex = ti;
                else insertIndex = ti + 1;
            }
            if (dragState.kind === 'lib') {
                addComponent(dragState.type, insertIndex);
            } else if (dragState.kind === 'reorder') {
                const fromId = dragState.widgetId;
                const fromIdx = widgets.findIndex(w => w.id === fromId);
                if (fromIdx < 0) return;
                const moved = widgets.splice(fromIdx, 1)[0];
                let adj = insertIndex;
                if (fromIdx < insertIndex) adj = insertIndex - 1;
                widgets.splice(adj, 0, moved);
                renderCanvas();
                toast('已调整顺序', 'success');
            }
            dragState = { kind: null, type: null, widgetId: null };
        }

        // =====================================================
        // 调整大小
        // =====================================================
        function startResize(e, id) {
            e.stopPropagation();
            e.preventDefault();
            const w = widgets.find(x => x.id === id);
            if (!w) return;
            const grid = document.getElementById('grid');
            const gridRect = grid.getBoundingClientRect();
            const gap = 12;
            const colW = (gridRect.width - gap * 11) / 12;
            const startX = e.clientX,
                startY = e.clientY;
            const startSpan = w.span;
            const widgetEl = document.querySelector(`.widget[data-id="${id}"]`);
            const startH = w.height || (widgetEl ? widgetEl.offsetHeight : 120);
            document.body.classList.add('resizing');

            function onMove(ev) {
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;
                const colsDelta = Math.round(dx / (colW + gap));
                let newSpan = Math.max(1, Math.min(12, startSpan + colsDelta));
                let newH = Math.max(120, Math.round(startH + dy));
                let changed = false;
                if (newSpan !== w.span) { w.span = newSpan;
                    changed = true; }
                if (newH !== w.height) { w.height = newH;
                    changed = true; }
                if (changed) renderCanvas();
            }

            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.body.classList.remove('resizing');
                renderCanvas();
                renderConfig();
                toast(`尺寸已更新：${w.span}/12 栅格 · ${w.height||'auto'}px 高`, 'success');
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        // =====================================================
        // 组件操作
        // =====================================================
        function addComponent(type, insertAt) {
            const apiByType = {
                metric: '/api/residents/count',
                bar: '/api/residents/age',
                vbar: '/api/residents/age',
                line: '/api/followup/trend',
                pie: '/api/chronic/dist',
                table: '/api/keygroups/list',
                vtable: '/api/resident/profile'
            };
            const defaults = {
                metric: { title: '新建指标卡', api: apiByType.metric, span: 3, map: { value: 'total', unit: '人',
                        delta: 'delta' } },
                text: { title: '文本块', api: '-', span: 3, map: { text: '双击编辑文本内容…' } },
                title: { title: '区块标题', api: '-', span: 12, map: {} },
                bar: { title: '新建横向柱状图', api: apiByType.bar, span: 6, map: { category: 'label', value: 'value' } },
                vbar: { title: '新建纵向柱状图', api: apiByType.vbar, span: 6, map: { category: 'label', value: 'value' } },
                line: { title: '新建折线图', api: apiByType.line, span: 6, map: { category: 'label', value: 'value' } },
                pie: { title: '新建饼图', api: apiByType.pie, span: 6, map: { category: 'label', value: 'value' } },
                table: { title: '新建横向表格', api: apiByType.table, span: 12,
                    table: { showHeader: true, striped: true, bordered: false, emptyText: '暂无数据',
                        headerDirection: 'horizontal', columns: autoColumns(apiByType.table) } },
                vtable: { title: '新建纵向表格', api: apiByType.vtable, span: 6,
                    table: { showHeader: false, striped: true, bordered: false, emptyText: '暂无数据',
                        headerDirection: 'vertical', verticalKeyField: 'name', verticalCornerText: '项目',
                        columns: autoColumns(apiByType.vtable) } },
            };
            const w = Object.assign({ id: nextId++, type, method: 'GET', refresh: 'realtime', showTitle: true },
                defaults[type] || {});
            if (insertAt === undefined || insertAt === null || insertAt < 0 || insertAt > widgets.length) widgets.push(w);
            else widgets.splice(insertAt, 0, w);
            selectWidget(w.id);
            toast(`已添加${typeName(type)}`, 'success');
        }

        function autoColumns(apiUrl) {
            const fields = getApiFields(apiUrl);
            if (!fields.length) return [];
            return fields.map(f => {
                const col = { field: f, title: f, visible: true, style: 'text', styleOpts: {} };
                if (/age|count|total|num/.test(f)) Object.assign(col, { style: 'number', styleOpts: { decimals: 0 } });
                if (/rate|percent|ratio/.test(f)) Object.assign(col, { style: 'percent', styleOpts: { decimals: 1 } });
                if (/progress/.test(f)) Object.assign(col, { style: 'progress', styleOpts: {} });
                if (/status|state/.test(f)) Object.assign(col, { style: 'badge', styleOpts: { colorRules: [] } });
                if (/date|time|last/.test(f)) Object.assign(col, { style: 'date', styleOpts: { format: 'YYYY-MM-DD' } });
                return col;
            });
        }

        function selectWidget(id) {
            selectedId = id;
            currentTab = 'basic';
            renderCanvas();
            renderConfig();
        }

        function delWidget(id) {
            widgets = widgets.filter(w => w.id !== id);
            if (selectedId === id) selectedId = null;
            renderCanvas();
            renderConfig();
            toast('已删除组件', 'info');
        }

        function dupWidget(id) {
            const w = widgets.find(x => x.id === id);
            if (!w) return;
            const copy = JSON.parse(JSON.stringify(w));
            copy.id = nextId++;
            copy.title = w.title + ' 副本';
            const idx = widgets.findIndex(x => x.id === id);
            widgets.splice(idx + 1, 0, copy);
            selectWidget(copy.id);
            toast('已复制组件', 'success');
        }

        function adjustSpan(id, delta) {
            const w = widgets.find(x => x.id === id);
            if (!w) return;
            const allowed = [3, 4, 6, 8, 12];
            let ci = allowed.indexOf(w.span);
            if (ci < 0) ci = 0;
            ci = Math.max(0, Math.min(allowed.length - 1, ci + delta));
            w.span = allowed[ci];
            renderCanvas();
            renderConfig();
        }

        function updateWidget(key, val) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            if (key.startsWith('map.')) w.map[key.slice(4)] = val;
            else if (key.startsWith('table.')) w.table[key.slice(6)] = val;
            else w[key] = val;
            renderCanvas();
        }

        // 表格列操作
        function addColumn() {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || (w.type !== 'table' && w.type !== 'vtable')) return;
            w.table = w.table || { showHeader: true, columns: [] };
            w.table.columns = w.table.columns || [];
            const fields = getApiFields(w.api);
            const used = new Set(w.table.columns.map(c => c.field));
            const newField = fields.find(f => !used.has(f)) || ('field_' + (w.table.columns.length + 1));
            w.table.columns.push({ field: newField, title: newField, visible: true, style: 'text', styleOpts: {} });
            renderConfig();
            renderCanvas();
        }

        function updateColumn(idx, key, val) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table) return;
            const c = w.table.columns[idx];
            if (!c) return;
            if (key === 'styleOpts') Object.assign(c.styleOpts, val);
            else c[key] = val;
            if (key === 'style') {
                const keepRules = c.styleOpts && c.styleOpts.colorRules ? c.styleOpts.colorRules : null;
                c.styleOpts = {};
                if (['tag', 'badge'].includes(val) && keepRules) c.styleOpts.colorRules = keepRules;
                if (['tag', 'badge'].includes(val) && !c.styleOpts.colorRules) c.styleOpts.colorRules = [{ match: '',
                        color: 'blue' }];
                if (val === 'number') c.styleOpts = { decimals: 0, unit: '', thousands: true };
                if (val === 'percent') c.styleOpts = { decimals: 1, raw: false };
                renderConfig();
            }
            renderCanvas();
        }

        function delColumn(idx) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table) return;
            w.table.columns.splice(idx, 1);
            renderConfig();
            renderCanvas();
        }

        function toggleColumnVisible(idx) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table) return;
            const c = w.table.columns[idx];
            c.visible = c.visible === false ? true : false;
            renderConfig();
            renderCanvas();
        }

        let colDragIdx = null;

        function onColDragStart(e, idx) {
            colDragIdx = idx;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', 'col:' + idx);
            e.currentTarget.classList.add('dragging');
        }

        function onColDragOver(e) { e.preventDefault();
            e.dataTransfer.dropEffect = 'move'; }

        function onColDrop(e, idx) {
            e.preventDefault();
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table || colDragIdx === null || colDragIdx === idx) return;
            const cols = w.table.columns;
            const moved = cols.splice(colDragIdx, 1)[0];
            cols.splice(idx, 0, moved);
            colDragIdx = null;
            renderConfig();
            renderCanvas();
        }

        function addColorRule(colIdx) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table) return;
            const c = w.table.columns[colIdx];
            c.styleOpts = c.styleOpts || {};
            c.styleOpts.colorRules = c.styleOpts.colorRules || [];
            c.styleOpts.colorRules.push({ match: '', color: 'blue' });
            renderConfig();
        }

        function updateColorRule(colIdx, rIdx, key, val) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table) return;
            const r = w.table.columns[colIdx].styleOpts.colorRules[rIdx];
            r[key] = val;
            renderCanvas();
        }

        function delColorRule(colIdx, rIdx) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || !w.table) return;
            w.table.columns[colIdx].styleOpts.colorRules.splice(rIdx, 1);
            renderConfig();
            renderCanvas();
        }

        function setHeaderDirection(val) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || (w.type !== 'table' && w.type !== 'vtable')) return;
            w.table = w.table || { columns: [] };
            w.table.headerDirection = val;
            if (val === 'vertical' && !w.table.verticalKeyField) {
                const firstVisible = (w.table.columns || []).find(c => c.visible !== false);
                if (firstVisible) w.table.verticalKeyField = firstVisible.field;
            }
            renderConfig();
            renderCanvas();
        }

        function setVerticalKeyField(val) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w || (w.type !== 'table' && w.type !== 'vtable')) return;
            w.table = w.table || { columns: [] };
            w.table.verticalKeyField = val;
            renderCanvas();
        }

        // =====================================================

        // =====================================================
        function switchTab(tab) {
            if (tab === currentTab) return;
            currentTab = tab;
            if (tab === 'custom') {
                const w = widgets.find(x => x.id === selectedId);
                initCustomCode(w);

                return;

            const spanOpts = [3, 4, 6, 8, 12].map(s =>

            let isVertical = false,
                t = null,
                tableFields = [];
            if (w.type === 'table' || w.type === 'vtable') {
                w.table = w.table || { showHeader: true, columns: [] };
                t = w.table;
                isVertical = t.headerDirection === 'vertical';
                tableFields = getApiFields(w.api);
            }

            let mapHtml = '';

            else if (w.type === 'text') mapHtml =

            else if (['bar', 'vbar', 'line', 'pie'].includes(w.type)) mapHtml = renderChartMap(w);
            else if (w.type === 'table' || w.type === 'vtable') mapHtml = renderTableConfig(w, t, tableFields);

            const tableStyleHtml = (w.type === 'table' || w.type === 'vtable') ? `
                <div class="cfg-sec">

                  <div class="field"><div class="switch-row"><span class="switch-label">斑马纹</span><div class="mini-switch${t.striped?' on':''}" onclick="this.classList.toggle('on');updateWidget('table.striped',this.classList.contains('on'))"></div></div></div>
                  <div class="field"><div class="switch-row"><span class="switch-label">边框线</span><div class="mini-switch${t.bordered?' on':''}" onclick="this.classList.toggle('on');updateWidget('table.bordered',this.classList.contains('on'))"></div></div></div>
                  <div class="field"><label>空数据提示</label><input class="input" value="${escapeHtml(t.emptyText||'')}" oninput="updateWidget('table.emptyText',this.value)" placeholder="暂无数据"></div>`:`
                  <div class="field"><div class="switch-row"><span class="switch-label">显示表头</span><div class="mini-switch${t.showHeader!==false?' on':''}" onclick="this.classList.toggle('on');updateWidget('table.showHeader',this.classList.contains('on'))"></div></div></div>
                  <div class="field"><div class="switch-row"><span class="switch-label">斑马纹</span><div class="mini-switch${t.striped?' on':''}" onclick="this.classList.toggle('on');updateWidget('table.striped',this.classList.contains('on'))"></div></div></div>
                  <div class="field"><div class="switch-row"><span class="switch-label">边框线</span><div class="mini-switch${t.bordered?' on':''}" onclick="this.classList.toggle('on');updateWidget('table.bordered',this.classList.contains('on'))"></div></div></div>
                  <div class="field"><label>空数据提示</label><input class="input" value="${escapeHtml(t.emptyText||'')}" oninput="updateWidget('table.emptyText',this.value)" placeholder="暂无数据"></div>`}
                </div>` : '';

            const basicHtml = `

                  <div class="h"><span class="bar"></span>基础配置</div>

                  <div class="field"><div class="switch-row"><span class="switch-label">${w.showTitle!==false?'显示标题':'隐藏标题'}</span><div class="mini-switch${w.showTitle!==false?' on':''}" onclick="this.classList.toggle('on');updateWidget('showTitle',this.classList.contains('on'))"></div></div></div>

                  <div class="field"><label>组件高度 <span class="opt">留空=自适应</span></label><div style="display:flex;gap:6px"><input class="input" type="number" min="120" placeholder="自适应" value="${w.height||''}" oninput="updateWidget('height',this.value?+this.value:undefined)"><button class="btn btn-default" onclick="updateWidget('height',undefined);renderConfig()" title="清除高度">↺</button></div><div class="hint">也可直接拖拽组件右下角手柄调整大小</div></div>
                </div>
                ${tableStyleHtml}`;

            const dataHtml = `
                <div class="cfg-sec">

                      <div class="picked-main">

                          ? `<div class="picked-name">${escapeHtml(APIS[w.api]?.name || w.api)}</div>
                             <div class="picked-path">${escapeHtml(w.api)}</div>`

            if (currentTab === 'data' && w.api && w.api !== '-') {

        function renderCustomCodeSection(w) {
            const cc = w.customCode || { css: '', js: '' };
            const isCss = currentCodeTab === 'css';
            const cssDefault = [
                '/**',
                ' * 自定义 CSS 样式',
                ' * 选择器作用于当前组件内部，不影响其他组件',
                ' * 可使用 CSS 变量（如 var(--primary)）保持风格统一',
                ' */',
                '',
                '/* 示例：自定义文本颜色 */',
                '/* .my-highlight { color: var(--danger); font-weight: 600; } */',
                '',
                '/* 示例：自定义间距 */',
                '/* .my-section { padding: 12px 0; border-top: 1px solid var(--border); } */',
                '',
            ].join('\n');
            const placeholderCss = cssDefault;
            const placeholderJs = [
                '/**',
                ' * 自定义渲染代码（JavaScript）',
                ' * @param {Object|Array} data - API 返回的原始响应数据',
                ' * @param {Object} ctx     - 上下文工具集',
                ' *   ctx.escapeHtml(str)  - HTML 转义',
                ' *   ctx.APIS             - 所有 API 预设',
                ' *   ctx.widget           - 当前组件配置',
                ' *   ctx.Number / Math / Date / JSON',
                ' * @return {string} 返回 HTML 字符串作为组件内容',
                ' */',
                '',
                '// 在此编写你的渲染逻辑...',
                'return \'<div>Hello World</div>\';',
            ].join('\n');
            const editorHtml = isCss ?
                `<textarea class="code-area" style="border:none;border-radius:0;resize:none" placeholder="${escapeHtml(placeholderCss)}" onkeydown="codeAreaKeydown(event)" oninput="updateCustomCode('css',this.value)">${escapeHtml(cc.css||'')}</textarea><div class="hint" style="margin-top:6px;flex-shrink:0">CSS 样式在 JS 渲染的 HTML 之前注入，作用于当前组件范围。支持所有 CSS 变量。</div>` :
                `<textarea class="code-area" style="border:none;border-radius:0;resize:none" placeholder="${escapeHtml(placeholderJs)}" onkeydown="codeAreaKeydown(event)" oninput="updateCustomCode('js',this.value)">${escapeHtml(cc.js||'')}</textarea><div class="hint" style="margin-top:6px;flex-shrink:0">data 为接口原始响应；ctx 提供 escapeHtml、APIS、widget、Number、Math 等工具 · 返回 HTML 字符串</div><div class="code-output" id="codeOutput" style="display:none;margin-top:6px;flex-shrink:0"></div>`;
            return `
                <div class="cfg-sec custom-code-section">
                  <div class="field custom-code-field" style="margin-bottom:0">
                    <div class="code-tabs">
                      <div class="code-tab ${isCss?'active':''}" onclick="switchCodeTab('css')">CSS样式</div>
                      <div class="code-tab ${!isCss?'active':''}" onclick="switchCodeTab('js')">JS代码</div>
                      <div class="spacer"></div>
                      <button class="act-btn" onclick="testCustomCode()">测试</button>
                      <button class="act-btn" onclick="resetCustomCode()">重置</button>
                      <button class="act-btn primary" onclick="saveCustomCode()">保存</button>
                    </div>
                    <div class="code-body">${editorHtml}</div>
                  </div>
                </div>`;
        }

        function onApiChange(newApi) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            w.api = newApi;
            if ((w.type === 'table' || w.type === 'vtable') && newApi !== '-' && APIS[newApi]) {
                const fields = getApiFields(newApi);
                w.table = w.table || { columns: [] };
                const existing = new Map((w.table.columns || []).map(c => [c.field, c]));
                const newCols = fields.map(f => existing.get(f) || { field: f, title: f, visible: true, style: 'text',
                        styleOpts: {} });
                w.table.columns = newCols;
            }
            renderConfig();
            renderCanvas();
        }

        function renderMetricMap(w) {
            const fields = getApiFields(w.api);
            const opt = (sel) => `<option value="">(不映射)</option>` + fields.map(f =>
                `<option value="${f}" ${sel===f?'selected':''}>${f}</option>`).join('');
            return `
                <div class="map-row"><div class="map-label"><span class="mf">数值字段</span><span class="arrow">→</span></div><select class="select" onchange="updateWidget('map.value',this.value)">${opt(w.map.value)}</select></div>
                <div class="map-row"><div class="map-label"><span class="mf">单位</span><span class="arrow">→</span></div><input class="input" value="${escapeHtml(w.map.unit||'')}" oninput="updateWidget('map.unit',this.value)" placeholder="如 人 / %"></div>
                <div class="map-row"><div class="map-label"><span class="mf">同比字段</span><span class="arrow">→</span></div><select class="select" onchange="updateWidget('map.delta',this.value)">${opt(w.map.delta)}</select></div>
                <div class="map-row"><div class="map-label"><span class="mf">目标字段</span><span class="arrow">→</span></div><select class="select" onchange="updateWidget('map.target',this.value)">${opt(w.map.target)}</select></div>
              `;
        }

        function renderChartMap(w) {
            const fields = getApiFields(w.api);
            const opt = (sel) => `<option value="">(请选择)</option>` + fields.map(f =>
                `<option value="${f}" ${sel===f?'selected':''}>${f}</option>`).join('');
            return `
                <div class="map-row"><div class="map-label"><span class="mf">分类字段</span><span class="arrow">→</span></div><select class="select" onchange="updateWidget('map.category',this.value)">${opt(w.map.category)}</select></div>
                <div class="map-row"><div class="map-label"><span class="mf">数值字段</span><span class="arrow">→</span></div><select class="select" onchange="updateWidget('map.value',this.value)">${opt(w.map.value)}</select></div>
              `;
        }

        function renderTableConfig(w, t, fields) {
            const colCount = (t.columns || []).length;
            const visibleCount = (t.columns || []).filter(c => c.visible !== false).length;
            const isVertical = t.headerDirection === 'vertical';
            let html =
                `<div class="field"><label>列管理 <span class="opt">${visibleCount}/${colCount} 可见 · 拖动 ⠿ 排序${isVertical?' · 纵向模式下每列对应一行字段':''}</span></label><div id="colList">`;
            (t.columns || []).forEach((c, idx) => { html += renderColCard(c, idx, fields); });
            html +=
                `</div><button class="add-col" onclick="addColumn()">+ 添加列</button></div>`;
            return html;
        }

        function renderColCard(c, idx, fields) {
            const fieldOpts = `<option value="">(不映射)</option>` + fields.map(f =>
                `<option value="${f}" ${c.field===f?'selected':''}>${f}</option>`).join('');
            const styleOpts = [
                ['text', '文本（默认）'],
                ['number', '数字'],
                ['percent', '百分比'],
                ['progress', '进度条'],
                ['tag', '标签'],
                ['badge', '徽章'],
                ['link', '链接'],
                ['date', '日期']
            ].map(([v, l]) => `<option value="${v}" ${c.style===v?'selected':''}>${l}</option>`).join('');

            let styleExtra = '';
            if (c.style === 'number') {
                const o = c.styleOpts || {};
                styleExtra =
                    `<div class="col-row"><span class="lbl">小数位</span><input class="inp" type="number" min="0" max="6" value="${o.decimals||0}" oninput="updateColumn(${idx},'styleOpts',{decimals:+this.value})"><span class="lbl" style="flex:0 0 40px">单位</span><input class="inp" value="${escapeHtml(o.unit||'')}" oninput="updateColumn(${idx},'styleOpts',{unit:this.value})" placeholder="如 岁"></div><div class="col-row"><div class="switch-row"><span class="switch-label">千分位分隔</span><div class="mini-switch${o.thousands!==false?' on':''}" onclick="this.classList.toggle('on');updateColumn(${idx},'styleOpts',{thousands:this.classList.contains('on')})"></div></div></div>`;
            } else if (c.style === 'percent') {
                const o = c.styleOpts || {};
                styleExtra =
                    `<div class="col-row"><span class="lbl">小数位</span><input class="inp" type="number" min="0" max="6" value="${o.decimals||1}" oninput="updateColumn(${idx},'styleOpts',{decimals:+this.value})"><div class="switch-row"><span class="switch-label">原始已是%</span><div class="mini-switch${o.raw?' on':''}" onclick="this.classList.toggle('on');updateColumn(${idx},'styleOpts',{raw:this.classList.contains('on')})"></div></div></div>`;
            } else if (c.style === 'link') {
                const o = c.styleOpts || {};
                styleExtra =
                    `<div class="col-row"><span class="lbl">链接模板</span><input class="inp" value="${escapeHtml(o.urlTemplate||'')}" oninput="updateColumn(${idx},'styleOpts',{urlTemplate:this.value})" placeholder="/detail/{id}（{字段} 占位）"></div>`;
            } else if (c.style === 'date') {
                const o = c.styleOpts || {};
                styleExtra =
                    `<div class="col-row"><span class="lbl">格式</span><select class="sel" onchange="updateColumn(${idx},'styleOpts',{format:this.value})">${['YYYY-MM-DD','YYYY/MM/DD','YYYY-MM-DD HH:mm','YYYY年MM月DD日'].map(f=>`<option value="${f}" ${o.format===f?'selected':''}>${f}</option>`).join('')}</select></div>`;
            } else if (c.style === 'tag' || c.style === 'badge') {
                const o = c.styleOpts || {};
                const rules = o.colorRules || [];
                styleExtra =
                    `<div class="col-row" style="flex-direction:column;align-items:stretch;gap:4px"><span class="lbl" style="margin-bottom:2px">颜色规则 <span style="color:var(--text-tertiary);font-weight:400">（值包含关键词 → 颜色）</span></span>${rules.map((r,ri)=>renderColorRule(idx,ri,r)).join('')}<span class="add-rule" onclick="addColorRule(${idx})">+ 添加规则</span></div>`;
            }

            return `
                <div class="col-card ${c.visible===false?'hidden-col':''}" draggable="true" ondragstart="onColDragStart(event,${idx})" ondragover="onColDragOver(event)" ondrop="onColDrop(event,${idx})">
                  <div class="col-head"><span class="col-grip" title="拖动排序">⠿</span><input class="col-title-inp" value="${escapeHtml(c.title)}" oninput="updateColumn(${idx},'title',this.value)" placeholder="列标题"><span class="col-toggle" title="${c.visible===false?'显示':'隐藏'}" onclick="toggleColumnVisible(${idx})">${c.visible===false?'👁‍🗨':'👁'}</span><span class="col-del" title="删除列" onclick="delColumn(${idx})">×</span></div>
                  <div class="col-row"><span class="lbl">映射字段</span><select class="sel" onchange="updateColumn(${idx},'field',this.value)">${fieldOpts}</select></div>
                  <div class="col-row"><span class="lbl">展示风格</span><select class="sel" onchange="updateColumn(${idx},'style',this.value)">${styleOpts}</select></div>
                  ${styleExtra}
                </div>
              `;
        }

        function renderColorRule(colIdx, rIdx, r) {
            const colors = [
                ['blue', '蓝'],
                ['green', '绿'],
                ['orange', '橙'],
                ['red', '红'],
                ['purple', '紫'],
                ['cyan', '青'],
                ['pink', '粉'],
                ['gray', '灰']
            ];
            const swatchBg = (id) => id === 'blue' ? '#2B7FFF' : id === 'green' ? '#34C759' : id === 'orange' ? '#F5A623' :
                id === 'red' ? '#E5454C' : id === 'purple' ? '#6B4CBF' : id === 'cyan' ? '#0E8A8A' : id === 'pink' ?
                '#C0306E' : '#bbb';
            const isCustom = r.color && !colors.some(([id]) => id === r.color);
            const pickerVal = isCustom ? r.color : swatchBg(r.color || 'blue');
            return `
                <div class="rule-row">
                  <input class="rule-match" value="${escapeHtml(r.match||'')}" oninput="updateColorRule(${colIdx},${rIdx},'match',this.value)" placeholder="关键词，如 稳定">
                  <span class="rule-arrow">→</span>
                  <div class="color-pick">${colors.map(([id,nm])=>`<span class="sw ${r.color===id?'sel':''}" style="background:${swatchBg(id)}" title="${nm}" onclick="updateColorRule(${colIdx},${rIdx},'color','${id}');renderConfig()"></span>`).join('')}<input type="color" value="${escapeHtml(pickerVal)}" onchange="updateColorRule(${colIdx},${rIdx},'color',this.value);renderConfig()" title="自定义颜色" style="width:20px;height:20px;border:none;border-radius:3px;cursor:pointer;padding:0;background:transparent;flex-shrink:0"></div>
                  <span class="rule-del" title="删除规则" onclick="delColorRule(${colIdx},${rIdx})">×</span>
                </div>
              `;
        }

        // =====================================================
        // 辅助功能
        // =====================================================
        function goBack() {
            window.location.href = 'resident-view-list.html';
        }

        function togglePreview(force) {
            const isPreview = force !== undefined ? force : !document.body.classList.contains('preview');
            document.body.classList.toggle('preview', isPreview);
            document.getElementById('btnConfig').classList.toggle('active', !isPreview);
            document.getElementById('btnPreview').classList.toggle('active', isPreview);
            if (isPreview) {
                document.getElementById('panelRight').classList.add('hidden');
                toast('已进入预览模式，数据来自 API 实时响应', 'info');
            } else {
                document.getElementById('panelRight').classList.remove('hidden');
            }
        }

        function exportConfig() {
            const cfg = { title: document.getElementById('viewTitle').value, widgets };
            document.getElementById('exportPre').textContent = JSON.stringify(cfg, null, 2);
            document.getElementById('exportModal').classList.add('show');
        }

        function closeExport() { document.getElementById('exportModal').classList.remove('show'); }

        function copyConfig() {
            const txt = document.getElementById('exportPre').textContent;
            navigator.clipboard.writeText(txt).then(() => toast('配置已复制到剪贴板', 'success')).catch(() => toast(
                '复制失败，请手动选择', 'warning'));
        }

        let tT;

        function toast(msg, type) {
            const el = document.getElementById('toast');
            el.className = 'toast' + (type ? ' ' + type : '');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(tT);
            tT = setTimeout(() => el.classList.remove('show'), 2000);
        }

        document.addEventListener('dragend', () => {
            document.querySelectorAll('.plib-item.dragging,.widget.dragging,.col-card.dragging').forEach(el => el
                .classList.remove('dragging'));
            document.getElementById('canvas').classList.remove('drag-over');
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeExport();
                // 添加服务弹窗打开时优先关闭
                const m = document.getElementById('apiPickerModal');
                if (m && m.classList.contains('show')) { closeApiPicker(); return; }
            }
        });

        renderCanvas();
    </script>
</body>
</html>
