        <!-- 右：配置面板 -->
        <aside class="panel-right" id="panelRight">
            <div id="cfgPanel">
                <div class="cfg-empty">
                    <div class="ico">⚙️</div>
                    点击画布中的组件<br>配置数据 API 与字段映射
                </div>
            </div>
        </aside>

    </div>

    <!-- 底部状态栏 -->
    <div class="sysbar">
        <span class="sys-status-item"><span class="ico">🕐</span>版本 <span class="v">V2.0.1</span></span>
        <span class="sys-status-divider"></span>
        <span class="sys-status-item"><span class="ico">🏥</span>机构 <span class="v">西城社区卫生服务中心</span></span>
        <span class="sys-status-divider"></span>
        <span class="sys-status-item"><span class="ico">🖥</span>部署模式 <span class="sys-tag-blue">内网私有化</span></span>
        <span class="sys-status-divider"></span>
        <span class="sys-status-item"><span class="ico">⏱</span>运行时长 <span class="v">15天 3小时</span></span>
        <span class="sys-status-ok"><span class="dot"></span>系统运行正常</span>
    </div>

    <!-- 添加服务 — 数据服务 API 选择弹窗 -->
    <div class="modal-mask" id="apiPickerModal" onclick="if(event.target===this)closeApiPicker()">
        <div class="modal api-picker">
            <div class="m-head"><span class="t">添加服务</span><span class="x" onclick="closeApiPicker()">×</span></div>
            <div class="m-body" style="padding:16px 24px">
                <div class="api-filter">
                    <span class="lbl">服务分组</span>
                    <select class="select" id="apiPickerGroup" style="width:160px" onchange="renderApiTable()">
                        <option value="">全部</option>
                    </select>
                    <span class="lbl">模糊检索</span>
                    <div class="api-fuzzy">
                        <input type="text" id="apiPickerKeyword" placeholder="资源、名称、路径" oninput="renderApiTable()">
                    </div>
                    <button class="btn btn-default" onclick="resetApiPickerFilter()">重置</button>
                    <button class="btn btn-primary" onclick="renderApiTable()">查询</button>
                </div>
                <div class="api-table-wrap">
                    <div class="api-table-scroll">
                        <table class="api-tbl striped">
                            <thead>
                                <tr>
                                    <th class="col-resource">资源</th>
                                    <th class="col-name">服务名称</th>
                                    <th class="col-path">服务路径</th>
                                </tr>
                            </thead>
                            <tbody id="apiPickerTbody"></tbody>
                        </table>
                    </div>
                    <div class="api-foot-stat">共 <b id="apiPickerCount">0</b> 个服务 · 单击行即可选中</div>
                </div>
            </div>
            <div class="m-foot">
                <button class="btn btn-default" onclick="closeApiPicker()">取消</button>
                <button class="btn btn-primary" id="apiPickerConfirm" disabled onclick="confirmApiPicker()">确定</button>
            </div>
        </div>
    </div>

    <!-- 导出配置 modal -->
    <div class="modal-mask" id="exportModal" onclick="if(event.target===this)closeExport()">
        <div class="modal">
            <div class="m-head"><span class="t">视图配置 JSON</span><span class="x" onclick="closeExport()">×</span></div>
            <div class="m-body"><pre id="exportPre"></pre></div>
            <div class="m-foot">
                <button class="btn btn-default" onclick="closeExport()">关闭</button>
                <button class="btn btn-primary" onclick="copyConfig()">复制</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // 数据服务 API 预设（模拟响应）
        // =====================================================
        const APIS = {
            '/api/residents/count': {
                name: '居民总数',
                method: 'GET',
                response: { total: 12856, male: 6420, female: 6436, delta: '+2.3%' }
            },
            '/api/chronic/rate': {
                name: '慢病规范管理率',
                method: 'GET',
                response: { rate: 78.5, target: 80, delta: '+1.8%' }
            },
            '/api/sign/rate': {
                name: '家庭医生签约率',
                method: 'GET',
                response: { rate: 86.2, target: 85, delta: '+3.1%' }
            },
            '/api/residents/age': {
                name: '居民年龄结构',
                method: 'GET',
                response: [
                    { label: '0-14岁', value: 1820 },
                    { label: '15-44岁', value: 4520 },
                    { label: '45-59岁', value: 3560 },
                    { label: '60岁以上', value: 2956 }
                ]
            },
            '/api/chronic/dist': {
                name: '慢病病种分布',
                method: 'GET',
                response: [
                    { label: '高血压', value: 3250 },
                    { label: '糖尿病', value: 1820 },
                    { label: '冠心病', value: 980 },
                    { label: '脑卒中', value: 560 },
                    { label: '其他', value: 410 }
                ]
            },
            '/api/followup/trend': {
                name: '随访趋势(近12月)',
                method: 'GET',
                response: [120, 135, 128, 142, 156, 168, 175, 162, 180, 195, 210, 225].map((v, i) => ({ label: (i + 1) +
                        '月', value: v }))
            },
            '/api/keygroups/list': {
                name: '重点人群清单',
                method: 'GET',
                response: [
                    { name: '张自强', age: 62, group: '高血压', status: '稳定', last: '2026-07-20', progress: 88 },
                    { name: '李淑芬', age: 58, group: '糖尿病', status: '需随访', last: '2026-06-15', progress: 45 },
                    { name: '王建国', age: 71, group: '冠心病', status: '稳定', last: '2026-07-18', progress: 92 },
                    { name: '赵丽华', age: 35, group: '孕产妇', status: '管理中', last: '2026-07-25', progress: 60 },
                    { name: '陈思宇', age: 6, group: '0-6儿童', status: '体检到期', last: '2026-05-10', progress: 30 }
                ]
            },
            '/api/resident/profile': {
                name: '居民档案详情(单条)',
                method: 'GET',
                response: {
                    name: '张自强',
                    gender: '男',
                    age: 62,
                    phone: '138****2056',
                    address: '西城社区3栋2单元401',
                    group: '高血压',
                    status: '稳定',
                    signDoctor: '李建国医生',
                    lastVisit: '2026-07-20',
                    bloodPressure: '138/86',
                    bloodSugar: '5.8 mmol/L',
                    progress: 88
                }
            }
        };

        function getApiFields(apiUrl) {
            if (!apiUrl || !APIS[apiUrl]) return [];
            const r = APIS[apiUrl].response;
            if (Array.isArray(r)) return Object.keys(r[0] || {});
            return Object.keys(r);
        }

        // =====================================================
        // 数据服务 — 服务目录（用于"添加服务"弹窗）
        // 资源 = 业务分组；服务名称 = 业务接口中文名；服务路径 = 接口 URL
        // =====================================================
        const API_SERVICES = [
            { resource: '住院病程记录',                   name: '住院病程记录2-V1',          path: '/91110000000000000x/cdr/getInhospitalCourseRecord2',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'admissionNo', type: 'api响应参数', value: '' }, { name: 'timestamp', type: 'URL参数', value: '' }] },
            { resource: '住院病程记录',                   name: '住院病程记录1-V1',          path: '/91110000000000000x/cdr/getInhospitalCourseRecord1',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'visitId', type: 'api响应参数', value: '' }] },
            { resource: '就诊事件索引',                   name: '就诊事件索引2-查询-V1',     path: '/91110000000000000x/closelo/getVisitEvent2',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'startDate', type: 'URL参数', value: '' }, { name: 'endDate', type: 'URL参数', value: '' }] },
            { resource: '就诊事件索引',                   name: '就诊事件索引1-查询-V1',     path: '/91110000000000000x/closelo/getVisitEvent1',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'eventType', type: 'api响应参数', value: '' }] },
            { resource: '居民档案索引',                   name: '居民档案索引-查询2-V1',     path: '/91110000000000000x/ehr/getResidentArchive2',
              params: [{ name: 'idCard', type: 'api响应参数', value: '' }, { name: 'name', type: 'api响应参数', value: '' }] },
            { resource: '居民档案索引-居民信息编码(CG...)', name: '居民档案索引-查询1-V1',   path: '/91110000000000000x/ehr/getResidentArchive1',
              params: [{ name: 'residentCode', type: 'api响应参数', value: '' }, { name: 'orgId', type: '当前用户', value: 'orgId' }] },
            { resource: '检查申请单',                     name: '检查申请单-查询2-V1',       path: '/91110000000000000x/cdr/getExamRequest2',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'examType', type: 'api响应参数', value: '' }] },
            { resource: '检查申请单',                     name: '检查申请单-查询1-V1',       path: '/91110000000000000x/cdr/getExamRequest1',
              params: [{ name: 'applyNo', type: 'api响应参数', value: '' }] },
            { resource: '个人健康档案基本信息',           name: '个人健康档案基本信息3-查询-V1', path: '/91110000000000000x/ehr/getBasicHealthRecord3',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'pageSize', type: '常量', value: '10' }, { name: 'pageIndex', type: '常量', value: '1' }] },
            { resource: '个人健康档案基本信息',           name: '个人健康档案基本信息2-查询-V1', path: '/91110000000000000x/ehr/getBasicHealthRecord2',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'pageSize', type: '常量', value: '10' }] },
            { resource: '个人健康档案基本信息',           name: '个人健康档案基本信息1-查询-V1', path: '/91110000000000000x/ehr/getBasicHealthRecord1',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }] },
            { resource: '电子病历文档',                   name: '电子病历文档-查询-V1',     path: '/91110000000000000x/emr/getEmrDocument',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'documentId', type: 'api响应参数', value: '' }] },
            { resource: '检验报告',                       name: '检验报告-查询-V1',         path: '/91110000000000000x/lis/getLabReport',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'reportNo', type: 'api响应参数', value: '' }] },
            { resource: '检查报告',                       name: '检查报告-查询-V1',         path: '/91110000000000000x/ris/getExamReport',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'examId', type: 'api响应参数', value: '' }] },
            { resource: '用药记录',                       name: '用药记录-查询-V1',         path: '/91110000000000000x/phr/getMedicationRecord',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'startDate', type: 'URL参数', value: '' }, { name: 'endDate', type: 'URL参数', value: '' }] },
            { resource: '体征监测',                       name: '体征监测-实时-V1',         path: '/91110000000000000x/dev/getVitalSignsRealtime',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'deviceId', type: '常量', value: '' }] },
            { resource: '随访记录',                       name: '随访记录-查询-V1',         path: '/91110000000000000x/fu/getFollowupRecord',
              params: [{ name: 'patientId', type: 'api响应参数', value: '' }, { name: 'doctorId', type: '当前用户', value: 'userId' }] }
        ];
        // 同时把服务目录里出现的路径补到 APIS（如果还未存在），保证 getApiFields 能找到响应结构
        API_SERVICES.forEach(s => {
            if (!APIS[s.path]) {
                APIS[s.path] = {
                    name: s.name,
                    method: 'GET',
                    params: s.params ? s.params.map(p => ({ ...p })) : [],
                    response: [
                        { id: '001', name: '示例-姓名', value: 128, status: '正常', date: '2026-07-30' },
                        { id: '002', name: '示例-指标', value: 256, status: '异常', date: '2026-07-29' }
                    ]
                };
            }
        });

        // =====================================================
        // 添加服务 — 弹窗交互
        // =====================================================
        let apiPickerSelected = null;   // 当前选中的服务（对象）
        let apiPickerSelectedPath = null;// 当前选中的服务 path（用于高亮）

        function uniqueGroups() {
            return Array.from(new Set(API_SERVICES.map(s => s.resource)));
        }

        function fillApiPickerGroup() {
            const sel = document.getElementById('apiPickerGroup');
            const current = sel.value;
            sel.innerHTML = '<option value="">全部</option>' + uniqueGroups().map(g =>
                `<option value="${g}">${g}</option>`
            ).join('');
            sel.value = current;
        }

        function getFilteredApiServices() {
            const group = document.getElementById('apiPickerGroup').value;
            const kw = (document.getElementById('apiPickerKeyword').value || '').trim().toLowerCase();
            return API_SERVICES.filter(s => {
                if (group && s.resource !== group) return false;
                if (!kw) return true;
                return (s.resource + ' ' + s.name + ' ' + s.path).toLowerCase().includes(kw);
            });
        }

        function renderApiTable() {
            const list = getFilteredApiServices();
            const tbody = document.getElementById('apiPickerTbody');
            document.getElementById('apiPickerCount').textContent = list.length;
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-cell"><div class="ico">📭</div>没有匹配的服务<br><span style="font-size:11px">调整筛选条件后重试</span></td></tr>`;
                return;
            }
            tbody.innerHTML = list.map(s => {
                const isSel = apiPickerSelectedPath === s.path ? ' class="selected"' : '';
                return `<tr${isSel} onclick="selectApiService('${s.path.replace(/'/g, "\\'")}')">
                    <td title="${escapeAttr(s.resource)}">${escapeHtml(s.resource)}</td>
                    <td title="${escapeAttr(s.name)}">${escapeHtml(s.name)}</td>
                    <td title="${escapeAttr(s.path)}" class="cell-path">${escapeHtml(s.path)}</td>
                </tr>`;
            }).join('');
        }

        function openApiPicker() {
            // 初始化筛选条件
            document.getElementById('apiPickerKeyword').value = '';
            fillApiPickerGroup();
            // 默认选中当前 widget.api 对应的服务（如果存在）
            const w = widgets.find(x => x.id === selectedId);
            apiPickerSelected = null;
            apiPickerSelectedPath = (w && w.api && w.api !== '-') ? w.api : null;
            document.getElementById('apiPickerConfirm').disabled = !apiPickerSelectedPath;
            renderApiTable();
            document.getElementById('apiPickerModal').classList.add('show');
            setTimeout(() => document.getElementById('apiPickerKeyword').focus(), 50);
        }

        function closeApiPicker() {
            document.getElementById('apiPickerModal').classList.remove('show');
            apiPickerSelected = null;
        }

        function selectApiService(path) {
            const svc = API_SERVICES.find(s => s.path === path);
            if (!svc) return;
            apiPickerSelected = svc;
            apiPickerSelectedPath = path;
            document.getElementById('apiPickerConfirm').disabled = false;
            renderApiTable();
        }

        function confirmApiPicker() {
            if (!apiPickerSelected) {
                toast('请先选择一个服务', 'warning');
                return;
            }
            applyApiSelection(apiPickerSelected);
            closeApiPicker();
        }

        function applyApiSelection(svc) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            w.api = svc.path;
            if (!w.method || w.method === '-') w.method = 'GET';
            // 自动带出接口预定义入参（深拷贝）
            if (svc.params && svc.params.length) {
                w.params = svc.params.map(p => ({ name: p.name, type: p.type, value: p.value }));
            } else {
                w.params = [];
            }
            // 表格类组件：API 变化时同步重置列
            if ((w.type === 'table' || w.type === 'vtable') && svc.path !== '-' && APIS[svc.path]) {
                const fields = getApiFields(svc.path);
                w.table = w.table || { columns: [] };
                const existing = new Map((w.table.columns || []).map(c => [c.field, c]));
                w.table.columns = fields.map(f => existing.get(f) || {
                    field: f, title: f, visible: true, style: 'text', styleOpts: {}
                });
            }
            renderConfig();
            renderCanvas();
            toast(`已选择服务：${svc.name}`, 'success');
        }

        function clearApiSelection() {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            w.api = '-';
            apiPickerSelectedPath = null;
            renderConfig();
        }

        function resetApiPickerFilter() {
            document.getElementById('apiPickerGroup').value = '';
            document.getElementById('apiPickerKeyword').value = '';
            renderApiTable();
        }

        // 兼容旧调用：select 方式被替换为弹窗后仍保留 onApiChange 但内部走弹窗回填
        function onApiChange(newApi) {
            const w = widgets.find(x => x.id === selectedId);
            if (!w) return;
            // 如果是旧 select 触发的，直接同步即可（保留向下兼容）
            w.api = newApi;
            if (newApi !== '-' && (w.type === 'table' || w.type === 'vtable') && APIS[newApi]) {
                const fields = getApiFields(newApi);
                w.table = w.table || { columns: [] };
                const existing = new Map((w.table.columns || []).map(c => [c.field, c]));
                w.table.columns = fields.map(f => existing.get(f) || {
                    field: f, title: f, visible: true, style: 'text', styleOpts: {}
                });
            }
            renderConfig();
            renderCanvas();
        }

        // 通用 HTML 转义
        function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }

        // =====================================================
        // 入参配置 — 卡牌列管理模式（参照表格列配置风格）
        // 数据结构：w.params = [{ name, type, value }]
        // =====================================================
        const PARAM_TYPE_OPTIONS = ['api响应参数', '常量', 'URL参数', '当前用户'];

        function ensureParams(w) {
            if (!w) return [];
            if (!Array.isArray(w.params)) w.params = [];
            return w.params;
        }

        function getCurrentWidget() {
            return widgets.find(x => x.id === selectedId);
        }

        function paramValueInput(p, idx) {
            const w = getCurrentWidget();
            if (p.type === 'api响应参数') {
                if (w && w.api && APIS[w.api]) {
                    const fields = getApiFields(w.api);
                    const opts = `<option value="">请选择响应字段</option>` +
                        fields.map(f => `<option value="${escapeAttr(f)}" ${p.value===f?'selected':''}>${escapeHtml(f)}</option>`).join('');
                    return `<select class="sel" onchange="updateParamField(${idx},'value',this.value)">${opts}</select>`;
                }
                return `<input class="inp" value="${escapeAttr(p.value||'')}" oninput="updateParamField(${idx},'value',this.value)" placeholder="先选择数据服务后可下拉选字段">`;
            }
            if (p.type === '当前用户') {
                const opts = ['userId','userName','orgId','role']
                    .map(k => `<option value="${k}" ${p.value===k?'selected':''}>${k}</option>`).join('');
                return `<select class="sel" onchange="updateParamField(${idx},'value',this.value)">${opts}</select>`;
            }
            const ph = p.type === '常量' ? '请输入常量值，如 100、true、abc' :
                       p.type === 'URL参数' ? '如 {id} 或具体参数名' : '请输入参数值';
            return `<input class="inp" value="${escapeAttr(p.value||'')}" oninput="updateParamField(${idx},'value',this.value)" placeholder="${ph}">`;
        }

        function paramTypeSelect(p, idx) {
            const opts = PARAM_TYPE_OPTIONS.map(t =>
                `<option value="${t}" ${p.type===t?'selected':''}>${t}</option>`).join('');
            return `<select class="sel" onchange="updateParamField(${idx},'type',this.value);renderParamsBody()">${opts}</select>`;
        }

        function renderParamsBody() {
            const w = getCurrentWidget();
            if (!w) return;
            ensureParams(w);
            const container = document.getElementById('paramCards');
            if (!container) return;
            if (!w.params.length) {
                container.innerHTML = `<div class="cfg-empty" style="padding:18px 0;font-size:12px"><div class="ico">📝</div>暂无入参，点击下方"添加参数"开始配置</div>`;
                return;
            }
            container.innerHTML = w.params.map((p, idx) => `
                <div class="col-card">
                    <div class="col-head">
                        <span class="col-grip" title="拖动排序">⠿</span>
                        <input class="col-title-inp" value="${escapeAttr(p.name||'')}" oninput="updateParamField(${idx},'name',this.value)" placeholder="参数名，如 cgrdabsf">

        // =====================================================

        function renderCanvas() {
