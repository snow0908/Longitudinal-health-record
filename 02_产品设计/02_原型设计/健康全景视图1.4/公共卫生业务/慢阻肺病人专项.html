<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>慢阻肺病人专项</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", "SimSun", "宋体", Arial, sans-serif;
            background: #ffffff;
            color: #333;
            font-size: 14px;
            padding: 20px;
        }
        .container {
            width: 920px;
            margin: 0 auto;
            background: #fff;
        }
        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: 4px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            padding: 0 4px 10px 4px;
            font-size: 14px;
            color: #333;
        }
        .header-row .left {
            text-align: left;
        }
        .header-row .right {
            text-align: right;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #b8d4ea;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #b8d4ea;
            padding: 10px 14px;
            text-align: left;
            vertical-align: middle;
            line-height: 1.6;
            word-break: break-all;
        }
        .lbl {
            background: #e6f1f9;
            text-align: center;
            color: #333;
            font-weight: normal;
        }
        .val {
            background: #fff;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">慢阻肺病人专项</h1>
        <div class="header-row">
            <div class="left">姓名：自壹</div>
            <div class="right">编号：11200056</div>
        </div>

        <table>
            <colgroup>
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
                <col style="width:8.333%">
            </colgroup>

            <!-- 基本诊断信息：左侧标签 colspan=4 值 colspan=3，右侧标签 colspan=2 值 colspan=3 -->
            <tr>
                <th class="lbl" colspan="4">血压(mmHg)</th>
                <td class="val" colspan="3">155 / 87</td>
                <th class="lbl" colspan="2">确诊前体重(kg)</th>
                <td class="val" colspan="3">56</td>
            </tr>
            <tr>
                <th class="lbl" colspan="4">临床体征</th>
                <td class="val" colspan="8">慢性并发症、急性并发症</td>
            </tr>
            <tr>
                <th class="lbl" colspan="4">发病原因</th>
                <td class="val" colspan="8">无发病</td>
            </tr>
            <tr>
                <th class="lbl" colspan="4">确诊依据</th>
                <td class="val" colspan="8">县人民医院诊断</td>
            </tr>
            <tr>
                <th class="lbl" colspan="4">确诊日期</th>
                <td class="val" colspan="8">2026-07-01</td>
            </tr>
            <tr>
                <th class="lbl" colspan="4">备注</th>
                <td class="val" colspan="8">无</td>
            </tr>

            <!-- 建档信息 -->
            <tr>
                <th class="lbl" colspan="4">建档机构</th>
                <td class="val" colspan="3">青羊人民医院</td>
                <th class="lbl" colspan="2">建档医师</th>
                <td class="val" colspan="3">夏磊</td>
            </tr>
            <tr>
                <th class="lbl" colspan="4">建档日期</th>
                <td class="val" colspan="8">2026-07-29</td>
            </tr>
        </table>
    </div>
</body>
</html>
