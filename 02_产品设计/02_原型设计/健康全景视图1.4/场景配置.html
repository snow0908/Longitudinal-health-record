<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景配置 - 全景配置</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 场景配置页面特有样式（设计变量与公共样式见 框架.css） ===== */

  /* 主内容区 / 标签栏 / 页面标题 / 搜索框 / 表格 / 空状态 / Toast 等公共样式已提取至 框架.css
     底部状态栏已按需求移除 */

  /* ===== 场景配置特有样式 ===== */

  /* 场景配置页面标题 + 筛选栏 + 主体 */
  .scene-wrapper{display:flex;flex-direction:column;flex:1;min-height:0}

  /* 下方主体：左侧角色 + 右侧表格 */
  .scene-body{display:flex;flex:1;min-height:0;background:var(--bg-page)}

  /* 左侧角色面板 */
  .scene-role-panel{width:260px;border-right:1px solid var(--primary-border);display:flex;flex-direction:column;background:var(--bg-white);flex-shrink:0}
  /* 左侧顶部：角色 / 自定义 下划线 Tab */
  .role-tabbar{display:flex;align-items:center;height:42px;padding:0 12px;gap:4px;border-bottom:1px solid var(--primary-border);flex-shrink:0}
  .role-tabbar .role-tab{height:32px;padding:0 10px;font-size:14px;color:var(--text-secondary);cursor:pointer;transition:all var(--transition-fast);display:flex;align-items:center;position:relative;background:transparent}
  .role-tabbar .role-tab:hover{color:var(--primary)}
  .role-tabbar .role-tab.active{color:var(--primary);font-weight:var(--font-weight-medium)}
  .role-tabbar .role-tab.active::after{content:"";position:absolute;bottom:2px;left:10px;right:10px;height:2px;background:var(--primary);border-radius:1px}
  .role-panel-head{padding:12px 12px 8px;font-size:16px;font-weight:var(--font-weight-medium);color:var(--text-primary)}
  .role-select-all{display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px;font-size:13px;color:var(--text-secondary);flex-shrink:0}
  .role-select-all label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .role-select-all label input{width:14px;height:14px;accent-color:var(--primary);cursor:pointer}
  .role-select-all .select-all-count{font-size:12px;color:var(--text-tertiary)}
  .role-search{padding:0 12px 10px}
  .role-search .search-input{position:relative}
  .role-search .search-input::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;pointer-events:none;z-index:1}
  .role-search .search-input input{width:100%;height:30px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px 0 30px;font-size:var(--font-size-body);color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .role-search .search-input input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .role-search .search-input input::placeholder{color:var(--text-placeholder)}

  /* 多角色配置工具栏 */
  .role-list{flex:1;overflow-y:auto;padding:0 8px 12px}
  .role-item{display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer;font-size:14px;color:var(--text-secondary);transition:all var(--transition-fast);margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;gap:8px}
  .role-item:hover{background:var(--primary-bg);color:var(--primary)}
  .role-item.active{background:var(--primary-header);color:var(--primary)}
  .role-item .role-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .role-item .role-cb{display:none;width:14px;height:14px;flex-shrink:0;accent-color:var(--primary);cursor:pointer}
  .role-item.show-cb .role-cb{display:block}

  /* 右侧配置区 */
  .scene-config-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;background:var(--bg-white)}

  /* 右侧标题栏 + 操作按钮 */
  .config-head{display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 4px 12px;flex-shrink:0}
  .config-head h2{font-size:16px;font-weight:var(--font-weight-semibold);color:var(--text-primary)}
  .config-head .btn{height:28px;padding:0 16px;font-size:13px}
  .toolbar-btn{height:28px;padding:0 14px;font-size:13px;color:var(--primary);cursor:pointer;border:1px solid var(--primary);border-radius:var(--r-sm);background:var(--bg-white);transition:all var(--transition-fast);display:inline-flex;align-items:center;white-space:nowrap}
  .toolbar-btn:hover{background:var(--primary-light)}
  .toolbar-btn.active{background:var(--primary);color:#fff}

  /* 线框风格 Tab：电子病历 / 健康档案 */
  .scene-tabbar{display:flex;align-items:center;gap:0;flex-shrink:0;margin-bottom:12px}
  .scene-tabbar .scene-tab{height:32px;padding:0 16px;font-size:14px;color:var(--text-secondary);cursor:pointer;transition:all var(--transition-fast);display:flex;align-items:center;border:1px solid var(--color-neutral-300);background:var(--bg-white)}
  .scene-tabbar .scene-tab:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
  .scene-tabbar .scene-tab:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;margin-left:-1px}
  .scene-tabbar .scene-tab:hover{color:var(--primary);border-color:var(--primary);z-index:1}
  .scene-tabbar .scene-tab.active{color:var(--primary);border-color:var(--primary);background:var(--primary-light);z-index:1}

  /* 模块表格 */
  .scene-config-panel .tbl{border:1px solid var(--primary-border);border-radius:var(--r-sm);overflow:hidden}
  .scene-config-panel .tbl th{background:#F0F7FF;border-bottom:1px solid var(--primary-border);color:var(--text-primary);font-weight:var(--font-weight-medium)}
  .scene-config-panel .tbl td{border-bottom:1px solid var(--primary-border);color:var(--text-secondary)}
  .scene-config-panel .tbl tbody tr:last-child td{border-bottom:none}
  .scene-config-panel .tbl tbody tr:hover td{background:#F5F5F5}
  .scene-config-panel .tbl th:last-child,
  .scene-config-panel .tbl td:last-child{text-align:center}
  .scene-config-panel .tbl .col-switch{width:80px}

  /* 开关（基础样式见 框架.css，本页仅保留覆盖） */
  .switch.disabled{pointer-events:none;opacity:.6}
  #masterSwitch .track{width:40px;height:22px}
  #masterSwitch .track::after{width:18px;height:18px}
  #masterSwitch input:checked + .track::after{transform:translateX(18px)}
</style>
</head>
<body>

<!-- ===== 主内容区（顶部导航栏与左侧菜单栏由 框架.js 注入） ===== -->
  <div class="main-area">

    <!-- 标签栏 -->
    <div class="tabbar">
      <div class="tab-item">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><polyline points="4 17 10 11 14 15 20 9"/><polyline points="14 9 20 9 20 15"/></svg>
        临床数据统计
        <span class="tab-close" onclick="event.stopPropagation();toast('关闭标签','info')">×</span>
      </div>
      <div class="tab-item">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        模块配置
        <span class="tab-close" onclick="event.stopPropagation();toast('关闭标签','info')">×</span>
      </div>
      <div class="tab-item active dashboard">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/></svg>
        场景配置
        <span class="tab-close" onclick="event.stopPropagation();toast('关闭标签','info')">×</span>
      </div>
    </div>

    <!-- 内容 -->
    <div class="content">
      <div class="content-card">
        <!-- 页面标题 -->
        <div class="page-head">
          <h1>场景配置</h1>
          <div class="right">
            <button class="toolbar-btn" onclick="toggleMultiMode()" id="multiBtn">批量配置</button>
          </div>
        </div>

        <!-- 场景配置主区域 -->
        <div class="scene-wrapper">

          <!-- 下方主体：左侧角色 + 右侧表格 -->
          <div class="scene-body">
            <!-- 左侧角色/自定义列表 -->
            <div class="scene-role-panel">
              <div class="role-tabbar">
                <div class="role-tab active" data-type="role" onclick="switchMainTab('role')">角色</div>
                <div class="role-tab" data-type="custom" onclick="switchMainTab('custom')">自定义</div>
              </div>
              <div class="role-panel-head">角色列表</div>
              <div class="role-select-all" id="roleSelectAll" style="display:none">
                <label><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllRoles(this.checked)"> 全选</label>
                <span class="select-all-count" id="selectAllCount"></span>
              </div>
              <div class="role-search" id="roleSearchBox">
                <div class="search-input">
                  <input type="text" id="roleSearch" placeholder="请输入关键词" oninput="renderRoleList()">
                </div>
              </div>
              <div class="role-list" id="roleList"></div>
            </div>

            <!-- 右侧配置区 -->
            <div class="scene-config-panel">
              <div class="config-head">
                <h2 id="configTitle">普通电子病历</h2>
                <div id="configActions">
                  <button class="btn btn-primary" onclick="enterEdit()">编辑</button>
                </div>
              </div>
              <div class="scene-tabbar">
                <div class="scene-tab active" data-scene="emr" onclick="switchSubTab('emr')">电子病历</div>
                <div class="scene-tab" data-scene="health" onclick="switchSubTab('health')">健康档案</div>
              </div>
              <table class="tbl">
                <thead>
                  <tr>
                    <th class="center" style="width:60px">序号</th>
                    <th style="width:120px">模块编码</th>
                    <th>模块名称</th>
                    <th class="center col-switch" id="switchTh" style="display:none">
                      <label class="switch" id="masterSwitch" title="一键开启/关闭全部模块">
                        <input type="checkbox" onchange="toggleAllModules(this.checked)">
                        <span class="track"></span>
                      </label>
                    </th>
                  </tr>
                </thead>
                <tbody id="moduleTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<!-- ===== 统一框架：顶部导航栏 + 左侧菜单栏（菜单配置见 框架.js） ===== -->
<script src="框架.js" data-page="scene"></script>

<script>
/* ===== 数据 ===== */
const roles = [
  { id: 'ptdzbl', name: '普通电子病历' },
  { id: 'jkyl', name: '健康医疗应用中心-居民权限' },
  { id: 'lcljq', name: '临床路径全菜单' },
  { id: 'super', name: '超级管理员' },
  { id: 'cwsj', name: '村医-上级机构' },
  { id: 'dzbl', name: '电子病历' },
  { id: 'qygl', name: '区域中心管理员' },
  { id: 'ysgl', name: '药事管理中心-中心角色' },
  { id: 'sxgl', name: '输血管理员' },
  { id: 'zzgl', name: '转院管理员' },
  { id: 'cdcs', name: '菜单测试' },
  { id: 'lxx', name: '李兴知' },
  { id: 'yljgjx', name: '医共体机构绩效' },
  { id: 'zxgly', name: '中心管理员(最高级)' },
  { id: 'www', name: 'www' },
  { id: 'ggws', name: '公卫中心管理员' },
  { id: 'jcyz', name: '基础运维字典' }
];

// 模块数据：电子病历、健康档案
const modulesData = {
  emr: [
    { code: 'jzxx', name: '就诊时序' },
    { code: 'scd', name: '三测单' },
    { code: 'basy', name: '病案首页' },
    { code: 'zybasy', name: '中医病案首页' },
    { code: 'lczd', name: '临床诊断' },
    { code: 'yyjl', name: '用药记录' },
    { code: 'mjzyyz', name: '门急诊医嘱' },
    { code: 'zyyz', name: '住院医嘱' },
    { code: 'jcbg', name: '检查信息' },
    { code: 'jybg', name: '检验信息' },
    { code: 'blbg', name: '病理信息' },
    { code: 'hzjl', name: '会诊信息' },
    { code: 'sxxx', name: '输血信息' },
    { code: 'ssjl', name: '手术信息' },
    { code: 'jcbgv2', name: '检查报告' },
    { code: 'jybgv2', name: '检验报告' }
  ],
  health: [
    { code: 'jbxx', name: '基本信息' },
    { code: 'jtbs', name: '家庭病史' },
    { code: 'grbs', name: '个人病史' },
    { code: 'shfs', name: '生活方式' },
    { code: 'tjxx', name: '体检信息' },
    { code: 'ynr', name: '老年人健康' },
    { code: 'ynf', name: '孕产妇健康' },
    { code: 'etbj', name: '儿童保健' },
    { code: 'gxy', name: '高血压随访' },
    { code: 'tnb', name: '糖尿病随访' },
    { code: 'gxb', name: '冠心病随访' },
    { code: 'jhb', name: '结核病随访' }
  ]
};

// 每个角色在每个场景下每个模块的启用状态
let roleModuleState = {};
function initState() {
  roles.forEach(r => {
    roleModuleState[r.id] = { emr: {}, health: {} };
    ['emr','health'].forEach(scene => {
      modulesData[scene].forEach((m, idx) => {
        // 所有模块默认未开启
        roleModuleState[r.id][scene][m.code] = false;
      });
    });
  });
}
initState();

let currentRoleId = 'ptdzbl';
let currentMainTab = 'role';   // 'role' | 'custom'
let currentScene = 'emr';
let isEditing = false;
let editBuffer = {};
let isMultiMode = false;
let selectedRoleIds = new Set();

/* ===== 渲染 ===== */
function renderRoleList() {
  const el = document.getElementById('roleList');
  const searchBox = document.getElementById('roleSearchBox');
  const selectAllBar = document.getElementById('roleSelectAll');

  if (currentMainTab === 'custom') {
    searchBox.style.display = 'none';
    selectAllBar.style.display = 'none';
    el.innerHTML = `<div class="empty-row" style="padding:40px 20px;text-align:center"><div class="ico">🛠</div>暂无自定义配置</div>`;
    return;
  }

  searchBox.style.display = 'block';

  const kw = document.getElementById('roleSearch').value.trim().toLowerCase();
  const list = roles.filter(r => r.name.toLowerCase().includes(kw));

  // 全选栏显示/隐藏
  if (isMultiMode) {
    selectAllBar.style.display = 'flex';
    const selInList = list.filter(r => selectedRoleIds.has(r.id)).length;
    document.getElementById('selectAllCount').textContent = '已选 ' + selectedRoleIds.size + ' 个';
    const cb = document.getElementById('selectAllCheckbox');
    if (list.length > 0 && selInList === list.length) {
      cb.checked = true;
      cb.indeterminate = false;
    } else if (selInList > 0) {
      cb.checked = false;
      cb.indeterminate = true;
    } else {
      cb.checked = false;
      cb.indeterminate = false;
    }
  } else {
    selectAllBar.style.display = 'none';
  }

  if (!list.length) {
    el.innerHTML = `<div class="empty-row" style="padding:40px 20px;text-align:center"><div class="ico">🔍</div>无匹配角色</div>`;
    return;
  }

  const cbClass = isMultiMode ? ' show-cb' : '';
  el.innerHTML = list.map(r => {
    const isSel = isMultiMode ? selectedRoleIds.has(r.id) : (r.id === currentRoleId);
    const activeCls = isSel ? ' active' : '';
    const checkedAttr = isMultiMode && selectedRoleIds.has(r.id) ? ' checked' : '';
    const clickHandler = isMultiMode
      ? `onclick="event.stopPropagation();toggleRoleSelect('${r.id}')"`
      : `onclick="selectRole('${r.id}')"`;
    const cbHtml = isMultiMode
      ? `<input type="checkbox" class="role-cb" ${checkedAttr} onclick="event.stopPropagation();toggleRoleSelect('${r.id}')">`
      : '';
    return `
      <div class="role-item${activeCls}${cbClass}" ${clickHandler} title="${escapeHtml(r.name)}">
        ${cbHtml}
        <span class="role-name">${escapeHtml(r.name)}</span>
      </div>
    `;
  }).join('');
}

function renderModuleTable() {
  let title;
  if (currentMainTab === 'custom') {
    title = '自定义配置';
  } else if (isMultiMode && selectedRoleIds.size > 0) {
    title = '多角色配置（已选 ' + selectedRoleIds.size + ' 个角色）';
  } else {
    const role = roles.find(r => r.id === currentRoleId);
    title = role ? role.name : '';
  }
  document.getElementById('configTitle').textContent = title;

  const switchTh = document.getElementById('switchTh');
  switchTh.style.display = isEditing ? '' : 'none';

  const tbody = document.getElementById('moduleTbody');

  if (currentMainTab === 'custom') {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${isEditing ? 4 : 3}"><div class="ico">📝</div>请先选择业务场景与模块</td></tr>`;
    return;
  }

  // 多角色模式未选角色
  if (isMultiMode && selectedRoleIds.size === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${isEditing ? 4 : 3}"><div class="ico">👆</div>请先在左侧勾选需要配置的角色</td></tr>`;
    return;
  }

  const modules = modulesData[currentScene] || [];

  if (!modules.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${isEditing ? 4 : 3}"><div class="ico">📭</div>暂无数据</td></tr>`;
    return;
  }

  // 多角色模式：合并选中角色状态（编辑中则使用 editBuffer）
  let moduleState;
  if (isMultiMode && isEditing) {
    moduleState = editBuffer;
  } else if (isMultiMode) {
    moduleState = {};
    modules.forEach(m => {
      const ids = [...selectedRoleIds];
      const allOn = ids.every(id => roleModuleState[id] && roleModuleState[id][currentScene] && roleModuleState[id][currentScene][m.code]);
      moduleState[m.code] = allOn;
    });
  } else {
    moduleState = isEditing ? editBuffer : roleModuleState[currentRoleId][currentScene];
  }

  tbody.innerHTML = modules.map((m, i) => {
    const checked = moduleState[m.code] ? 'checked' : '';
    const switchCell = isEditing
      ? `<td class="center"><label class="switch"><input type="checkbox" data-code="${m.code}" ${checked} onchange="toggleModule('${m.code}', this.checked)"><span class="track"></span></label></td>`
      : '';
    return `
      <tr>
        <td class="center">${i + 1}</td>
        <td>${escapeHtml(m.code)}</td>
        <td>${escapeHtml(m.name)}</td>
        ${switchCell}
      </tr>
    `;
  }).join('');

  // 同步总开关状态
  if (isEditing) {
    setTimeout(syncMasterSwitch, 0);
  }
}

function renderActions() {
  const el = document.getElementById('configActions');
  if (currentMainTab === 'custom') {
    el.innerHTML = '';
    return;
  }
  if (isMultiMode && selectedRoleIds.size === 0) {
    el.innerHTML = '';
    return;
  }
  if (isEditing) {
    el.innerHTML = `
      <button class="btn btn-default" onclick="cancelEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    `;
  } else {
    el.innerHTML = `<button class="btn btn-primary" onclick="enterEdit()">编辑</button>`;
  }
}

function renderTabs() {
  document.querySelectorAll('.role-tabbar .role-tab[data-type]').forEach(t => {
    t.classList.toggle('active', t.dataset.type === currentMainTab);
  });
  document.querySelectorAll('.scene-tabbar .scene-tab[data-scene]').forEach(t => {
    t.classList.toggle('active', t.dataset.scene === currentScene);
  });
}

/* ===== 交互 ===== */
function selectRole(id) {
  currentRoleId = id;
  isEditing = false;
  renderRoleList();
  renderModuleTable();
  renderActions();
}

/* ===== 初始化配置 ===== */
function initModuleState() {
  const state = {};
  modulesData[currentScene].forEach(m => { state[m.code] = true; });
  return state;
}

function initConfig() {
  if (!confirm('确定要初始化当前业务场景的模块配置吗？所有模块将被重置为启用状态。')) return;

  isEditing = false;
  editBuffer = {};

  if (isMultiMode) {
    // 批量初始化所有选中角色
    selectedRoleIds.forEach(id => {
      roleModuleState[id][currentScene] = initModuleState();
    });
    toast(`已初始化 ${selectedRoleIds.size} 个角色`, 'success');
  } else {
    // 初始化当前角色
    roleModuleState[currentRoleId][currentScene] = initModuleState();
    toast('初始化成功', 'success');
  }

  renderModuleTable();
  renderActions();
}

/* ===== 多角色配置 ===== */
function toggleMultiMode() {
  isMultiMode = !isMultiMode;
  isEditing = false;
  editBuffer = {};

  if (isMultiMode) {
    selectedRoleIds = new Set();
    if (currentRoleId) selectedRoleIds.add(currentRoleId);
    document.getElementById('multiBtn').classList.add('active');
    document.getElementById('multiBtn').textContent = '退出批量配置';
    // 自动切换到编辑模式
    renderRoleList();
    renderModuleTable();
    renderActions();
    enterEdit();
    return;
  } else {
    selectedRoleIds.clear();
    document.getElementById('multiBtn').classList.remove('active');
    document.getElementById('multiBtn').textContent = '批量配置';
  }
  renderRoleList();
  renderModuleTable();
  renderActions();
}

function toggleRoleSelect(id) {
  if (!isMultiMode) return;
  if (selectedRoleIds.has(id)) {
    selectedRoleIds.delete(id);
  } else {
    selectedRoleIds.add(id);
  }
  renderRoleList();
  renderModuleTable();
  renderActions();
}

function toggleSelectAllRoles(checked) {
  if (!isMultiMode) return;
  const kw = document.getElementById('roleSearch').value.trim().toLowerCase();
  const list = roles.filter(r => r.name.toLowerCase().includes(kw));
  if (checked) {
    list.forEach(r => selectedRoleIds.add(r.id));
  } else {
    list.forEach(r => selectedRoleIds.delete(r.id));
  }
  renderRoleList();
  renderModuleTable();
  renderActions();
}

function switchMainTab(type) {
  currentMainTab = type;
  isEditing = false;
  renderTabs();
  renderRoleList();
  if (type === 'role') {
    document.getElementById('roleSearch').value = '';
  }
  // 切换到自定义时右侧也刷新
  if (type === 'custom') {
    renderModuleTable();
    renderActions();
  }
}

function switchSubTab(scene) {
  currentScene = scene;
  isEditing = false;
  renderTabs();
  renderModuleTable();
  renderActions();
}

function enterEdit() {
  isEditing = true;
  if (isMultiMode) {
    // 批量编辑：初始状态取所有选中角色都开启的模块
    editBuffer = {};
    const ids = [...selectedRoleIds];
    modulesData[currentScene].forEach(m => {
      editBuffer[m.code] = ids.every(id =>
        roleModuleState[id] && roleModuleState[id][currentScene] && roleModuleState[id][currentScene][m.code]
      );
    });
  } else {
    editBuffer = JSON.parse(JSON.stringify(roleModuleState[currentRoleId][currentScene]));
  }
  renderModuleTable();
  renderActions();
}

function cancelEdit() {
  isEditing = false;
  editBuffer = {};
  renderModuleTable();
  renderActions();
}

function saveEdit() {
  if (isMultiMode) {
    // 批量保存到所有选中角色
    [...selectedRoleIds].forEach(id => {
      roleModuleState[id][currentScene] = JSON.parse(JSON.stringify(editBuffer));
    });
    toast('已批量保存到 ' + selectedRoleIds.size + ' 个角色', 'success');
    // 保存后自动退出批量模式
    isEditing = false;
    editBuffer = {};
    isMultiMode = false;
    selectedRoleIds.clear();
    document.getElementById('multiBtn').classList.remove('active');
    document.getElementById('multiBtn').textContent = '批量配置';
    renderRoleList();
    renderModuleTable();
    renderActions();
    return;
  }
  roleModuleState[currentRoleId][currentScene] = JSON.parse(JSON.stringify(editBuffer));
  toast('保存成功', 'success');
  isEditing = false;
  editBuffer = {};
  renderModuleTable();
  renderActions();
}

function toggleModule(code, checked) {
  if (!isEditing) return;
  editBuffer[code] = checked;
  syncMasterSwitch();
}

function toggleAllModules(checked) {
  if (!isEditing) return;
  modulesData[currentScene].forEach(m => { editBuffer[m.code] = checked; });
  renderModuleTable();
}

function syncMasterSwitch() {
  const master = document.querySelector('#masterSwitch input');
  if (!master) return;
  const modules = modulesData[currentScene] || [];
  const allOn = modules.every(m => editBuffer[m.code]);
  const allOff = modules.every(m => !editBuffer[m.code]);
  master.checked = allOn;
  master.indeterminate = !allOn && !allOff;
}

/* 公共函数（toggleMenu / navigate / toast / escapeHtml 已提取至 框架.js） */

/* ===== 初始化 ===== */
renderRoleList();
renderTabs();
renderModuleTable();
renderActions();
</script>
</body>
</html>
