<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>健康教育管理</title>
  <style>
    /* ============================================================
       参照 lanhu_gaoxueyaguanli1 列表页设计
       基准宽度：375px
       健康教育管理列表
       ============================================================ */

    /* ---------- Reset & Base ---------- */
    * { box-sizing: border-box; flex-shrink: 0; margin: 0; padding: 0; }
    body {
      font-family: PingFangSC-Regular, Roboto, Helvetica Neue, Helvetica, Tahoma, Arial, PingFang SC-Light, Microsoft YaHei;
      background-color: #F3F5F7;
      -webkit-font-smoothing: antialiased;
    }
    .flex-col { display: flex; flex-direction: column; }
    .flex-row { display: flex; flex-direction: row; }
    .justify-between { display: flex; justify-content: space-between; }
    .align-center { display: flex; align-items: center; }
    .align-start { display: flex; align-items: flex-start; }

    /* ---------- Page ---------- */
    .page {
      background-color: #F3F5F7;
      position: relative;
      width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 16px;
    }

    /* ============================================================
       导航栏（参照 高血压专项 .group_1 / .box_1 / .box_2）
       ============================================================ */
    .group_1 {
      background-color: rgba(255, 255, 255, 1);
      padding: 14px 16px 7px 16px;
    }
    .box_1 {
      margin: 0 10px 0 24px;
    }
    .text_1 {
      overflow-wrap: break-word;
      color: rgba(0, 0, 0, 1);
      font-size: 16px;
      letter-spacing: 1.100000023841858px;
      font-family: PingFangSC-Semibold;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      line-height: 22px;
    }
    .thumbnail_1 {
      width: 19px;
      height: 12px;
      margin: 5px 0 5px 191px;
    }
    .text_2 {
      overflow-wrap: break-word;
      color: rgba(0, 0, 0, 1);
      font-size: 12px;
      letter-spacing: 0.925000011920929px;
      font-family: PingFangSC-Semibold;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      line-height: 17px;
      margin: 3px 0 0 6px;
    }
    .image_1 {
      width: 25px;
      height: 13px;
      margin: 5px 0 4px 6px;
    }
    .box_2 {
      margin-top: 15px;
      display: flex;
      align-items: center;
    }
    .label_1 {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .text_3 {
      flex: 1;
      overflow-wrap: break-word;
      color: rgba(51, 51, 51, 1);
      font-size: 16px;
      font-family: PingFangSC-Medium;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      line-height: 22px;
      margin: 4px 0 0 34px;
    }
    .image_2 {
      width: 78px;
      height: 30px;
      flex-shrink: 0;
    }

    /* ============================================================
       时间筛选栏
       ============================================================ */
    .filter-bar {
      background-color: #FFFFFF;
      padding: 11px 80px;
      display: flex;
      justify-content: center;
    }
    .filter-date {
      color: #333333; font-size: 16px; font-family: PingFangSC-Regular;
      font-weight: 400; text-align: left; white-space: nowrap; line-height: 22px;
    }
    .filter-arrow {
      width: 10px; height: 6px;
      margin: 8px 0 8px 0;
      cursor: pointer;
    }

    /* ============================================================
       列表容器
       ============================================================ */
    .list-container {
      width: 343px;
      align-self: center;
      margin-top: 16px;
    }

    /* ============================================================
       列表卡片
       ============================================================ */
    .list-card {
      background-color: #FFFFFF;
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 12px 16px 16px 16px;
      cursor: pointer;
    }
    .list-card:active { opacity: 0.7; }

    /* ---------- 第一行：日期 + 干预地点标签 ---------- */
    .card-top-row {
      width: 100%;
    }
    .card-date {
      color: #666666; font-size: 14px; font-family: PingFangSC-Regular;
      font-weight: 400; text-align: left; white-space: nowrap; line-height: 20px;
    }
    .card-location-tag {
      font-size: 12px; font-family: PingFangSC-Regular;
      font-weight: 400; text-align: left; white-space: nowrap;
      padding: 2px 12px; border-radius: 12px; line-height: 20px;
      border: 1px solid;
    }
    .card-location-tag--home {
      color: #15CF6E; border-color: #15CF6E;
    }
    .card-location-tag--hospital {
      color: #096AFF; border-color: #096AFF;
    }
    .card-location-tag--phone {
      color: #FF9500; border-color: #FF9500;
    }

    /* ---------- 第二行：机构 + 箭头 + 医生 ---------- */
    .card-mid-row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .card-mid-row .icon-svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: #096AFF;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .card-mid-row .icon-hospital {
      margin-right: 4px;
    }
    .card-mid-row .icon-arrow {
      margin-left: 12px;
      margin-right: 4px;
      stroke: #999999;
      stroke-width: 2.5;
    }
    .card-mid-row .icon-doctor {
      margin-right: 2px;
      stroke: #096AFF;
    }
    .card-hospital {
      color: #666666;
      font-size: 14px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      line-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 0 1 auto;
      min-width: 0;
    }
    .card-doctor {
      color: #666666;
      font-size: 14px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      flex-shrink: 0;
      margin-left: 0;
    }

    /* ---------- 第三行：干预方式（左对齐，无图标无标题） ---------- */
    .method-block {
      background-color: #F4F6FB;
      border-radius: 4px;
      margin-top: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .method-text {
      color: #333333;
      font-size: 14px;
      font-family: PingFangSC-Medium;
      font-weight: 500;
      text-align: left;
      line-height: 22px;
    }

    /* ============================================================
       底部脚注
       ============================================================ */
    .footer-note {
      padding: 16px 16px 0 16px;
      text-align: center;
      font-size: 12px; color: #999999;
      font-family: PingFangSC-Regular; font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="page flex-col">

    <!-- ==================== 导航栏（参照 高血压专项） ==================== -->
    <div class="group_1 flex-col">
      <div class="box_1 flex-row">
        <span class="text_1">10:19</span>
        <img class="thumbnail_1" referrerpolicy="no-referrer" src="./img/信号.png" />
        <span class="text_2">5G</span>
        <img class="image_1" referrerpolicy="no-referrer" src="./img/电量.png" />
      </div>
      <div class="box_2 flex-row">
        <img class="label_1" referrerpolicy="no-referrer" src="./img/返回.png" />
        <span class="text_3">健康教育管理</span>
        <img class="image_2" referrerpolicy="no-referrer" src="./img/设置.png" />
      </div>
    </div>

    <!-- ==================== 时间筛选栏 ==================== -->
    <div class="filter-bar">
      <span class="filter-date">2025-01-01～2025-06-30</span>
      <svg class="filter-arrow" viewBox="0 0 10 6" fill="none">
        <path d="M1 1L5 5L9 1" stroke="#333333" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- ==================== 健康教育记录列表 ==================== -->
    <div class="list-container flex-col">

      <!-- ========== 记录 1 ========== -->
      <div class="list-card flex-col">
        <div class="card-top-row flex-row justify-between">

          <span class="card-location-tag card-location-tag--home">家庭</span>
        </div>
        <div class="card-mid-row">
          <svg class="icon-svg icon-hospital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="12" y1="9" x2="12" y2="15"/>
          </svg>
          <span class="card-hospital">北京市第一医院发热门诊</span>
          <svg class="icon-svg icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
          <svg class="icon-svg icon-doctor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="card-doctor">刘玉玉</span>
        </div>
        <!-- 干预方式：左对齐，无图标无标题 -->
        <div class="method-block">
          <span class="method-text">发放宣传折页</span>
        </div>
      </div>

      <!-- ========== 记录 2 ========== -->
      <div class="list-card flex-col">
        <div class="card-top-row flex-row justify-between">
          <span class="card-date">1985-06-20 14:30</span>
          <span class="card-location-tag card-location-tag--hospital">医院</span>
        </div>
        <div class="card-mid-row">
          <svg class="icon-svg icon-hospital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            <line x1="9" y1="12" x2="15" y2="12"/>

          </svg>
          <span class="card-hospital">北京市第一医院发热门诊</span>
          <svg class="icon-svg icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
          <svg class="icon-svg icon-doctor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="card-doctor">刘玉玉</span>
        </div>
        <!-- 干预方式：左对齐，无图标无标题 -->
        <div class="method-block">
          <span class="method-text">面对面咨询</span>
        </div>
      </div>

      <!-- ========== 记录 3 ========== -->
      <div class="list-card flex-col">
        <div class="card-top-row flex-row justify-between">
          <span class="card-date">1985-07-10 10:00</span>
          <span class="card-location-tag card-location-tag--phone">电话</span>
        </div>
        <div class="card-mid-row">
          <svg class="icon-svg icon-hospital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="12" y1="9" x2="12" y2="15"/>
          </svg>
          <span class="card-hospital">北京市第一医院发热门诊</span>
          <svg class="icon-svg icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
          <svg class="icon-svg icon-doctor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="card-doctor">刘玉玉</span>
        </div>
        <!-- 干预方式：左对齐，无图标无标题 -->
        <div class="method-block">
          <span class="method-text">电话随访</span>
        </div>
      </div>

      <!-- ========== 记录 4 ========== -->
      <div class="list-card flex-col">
        <div class="card-top-row flex-row justify-between">
          <span class="card-date">1985-08-05 16:00</span>
          <span class="card-location-tag card-location-tag--home">家庭</span>
        </div>
        <div class="card-mid-row">
          <svg class="icon-svg icon-hospital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="12" y1="9" x2="12" y2="15"/>
          </svg>
          <span class="card-hospital">北京市第一医院发热门诊</span>
          <svg class="icon-svg icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
          <svg class="icon-svg icon-doctor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="card-doctor">张永健</span>
        </div>
        <!-- 干预方式：左对齐，无图标无标题 -->
        <div class="method-block">
          <span class="method-text">发放宣传折页</span>
        </div>
      </div>

    </div>

    <!-- ==================== 底部脚注 ==================== -->
    <div class="footer-note">
      共 4 条健康教育记录
    </div>

  </div>

<script>
  document.querySelector('.label_1').addEventListener('click', function() {
    window.location.href = './index.html';
  });

  /* 列表卡片点击跳转详情页 */
  var cards = document.querySelectorAll('.list-card');
  cards.forEach(function(card, idx) {
    card.addEventListener('click', function() {
      window.location.href = '健康教育.html';
    });
  });
</script>

</body>
</html>
