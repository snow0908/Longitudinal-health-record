<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>门诊记录</title>
  <style>
    /* ============================================================
       门诊记录列表页 — 参照肿瘤管理列表 & C端UED v1.2
       基准宽度：375px
       ============================================================ */

    /* ---------- Reset & Base ---------- */
    * { box-sizing: border-box; flex-shrink: 0; margin: 0; padding: 0; }
    body {
      font-family: PingFangSC-Regular, Roboto, Helvetica Neue, Helvetica, Tahoma, Arial, PingFang SC-Light, Microsoft YaHei;
      background-color: #F3F5F7;
      -webkit-font-smoothing: antialiased;
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
    }
    input { background-color: transparent; border: 0; }
    button {
      margin: 0; padding: 0; border: 1px solid transparent;
      outline: none; background-color: transparent;
    }
    button:active { opacity: 0.6; }

    /* ---------- Flex 工具类 ---------- */
    .flex-col { display: flex; flex-direction: column; }
    .flex-row { display: flex; flex-direction: row; }
    .justify-start { display: flex; justify-content: flex-start; }
    .justify-center { display: flex; justify-content: center; }
    .justify-end { display: flex; justify-content: flex-end; }
    .justify-evenly { display: flex; justify-content: space-evenly; }
    .justify-around { display: flex; justify-content: space-around; }
    .justify-between { display: flex; justify-content: space-between; }
    .align-start { display: flex; align-items: flex-start; }
    .align-center { display: flex; align-items: center; }
    .align-end { display: flex; align-items: flex-end; }

    /* ---------- Page ---------- */
    .page {
      background-color: #F3F5F7;
      position: relative;
      width: 100%;
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 16px;
    }

    /* ============================================================
       导航栏（参照肿瘤管理列表）
       ============================================================ */
    .group_1 {
      background-color: rgba(255, 255, 255, 1);
      padding: 14px 16px 7px 16px;
    }
    .box_1 {
      display: flex; flex-direction: row; align-items: center;
      margin: 0 10px 0 24px;
    }
    .status-spacer { flex: 1; }
    .text_1 {
      overflow-wrap: break-word;
      color: rgba(0, 0, 0, 1);
      font-size: 16px;
      letter-spacing: 1.100000023841858px;
      font-family: PingFangSC-Semibold;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      line-height: 22px;
    }
    .thumbnail_1 {
      width: 19px; height: 12px;
      margin: 5px 0;
    }
    .text_2 {
      overflow-wrap: break-word;
      color: rgba(0, 0, 0, 1);
      font-size: 12px;
      letter-spacing: 0.925000011920929px;
      font-family: PingFangSC-Semibold;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      line-height: 17px;
      margin: 3px 0 0 6px;
    }
    .image_1 {
      width: 25px; height: 13px;
      margin: 5px 0 4px 6px;
    }

    .box_2 {
      margin-top: 15px;
      display: flex; flex-direction: row;
      align-items: center; flex-wrap: nowrap;
    }
    .label_1 {
      width: 24px; height: 24px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .text_3 {
      flex: 1; min-width: 0;
      overflow-wrap: break-word;
      color: rgba(51, 51, 51, 1);
      font-size: 16px;
      font-family: PingFangSC-Medium;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      line-height: 22px;
      margin: 4px 0 0 34px;
    }
    .image_2 {
      width: 78px; height: 30px;
      flex-shrink: 0;
    }

    /* ============================================================
       筛选栏
       ============================================================ */
    .group_2 {
      padding-bottom: 126px;
    }
    .box_3 {
      background-color: rgba(255, 255, 255, 1);
      padding: 11px 16px 11px 16px;
    }
    .section_1 {
      width: 343px;
    }
    .image-text_1 {
      width: 88px;
    }
    .thumbnail_2 {
      width: 16px; height: 16px;
      margin: 3px 0 3px 0;
    }
    .text-group_1 {
      overflow-wrap: break-word;
      color: rgba(51, 51, 51, 1);
      font-size: 16px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
      line-height: 22px;
    }
    .text_4 {
      overflow-wrap: break-word;
      color: rgba(102, 102, 102, 1);
      font-size: 16px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
      line-height: 22px;
    }
    .image_3 {
      width: 343px; height: 1px;
      margin-top: 11px;
    }
    .section_2 {
      width: 343px;
      margin-top: 10px;
    }
    .image-text_2 {
      width: 88px;
    }
    .thumbnail_3 {
      width: 16px; height: 16px;
      margin: 3px 0 3px 0;
    }
    .text-group_2 {
      overflow-wrap: break-word;
      color: rgba(51, 51, 51, 1);
      font-size: 16px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
      line-height: 22px;
    }
    .text_5 {
      overflow-wrap: break-word;
      color: rgba(102, 102, 102, 1);
      font-size: 16px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
      line-height: 22px;
    }

    /* ============================================================
       列表容器
       ============================================================ */
    .list_1 {
      width: 343px; height: 350px;
      align-self: center;
      margin-top: 16px;
    }

    /* ============================================================
       列表卡片 - 通用
       ============================================================ */
    .list-items_1-0,
    .list-items_1-1,
    .list-items_1-2 {
      background-color: rgba(255, 255, 255, 1);
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 16px 16px 16px 16px;
    }

    .text-wrapper_1-0,
    .text-wrapper_1-1,
    .text-wrapper_1-2 {
      width: 311px;
    }

    /* 诊断名称 */
    .text_6-0, .text_6-1, .text_6-2 {
      width: 80px;
      overflow-wrap: break-word;
      color: rgba(51, 51, 51, 1);
      font-size: 16px;
      font-family: PingFangSC-Medium;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      line-height: 22px;
    }

    /* 状态标签 */
    .text_7-0, .text_7-1, .text_7-2 {
      overflow-wrap: break-word;
      font-size: 14px;
      font-family: PingFangSC-Regular;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
      line-height: 20px;
      margin-top: 1px;
    }
    .text_7-0 { color: rgba(254, 168, 0, 1); }
    .text_7-1 { color: rgba(102, 102, 102, 1); }
    .text_7-2 { color: rgba(21, 207, 110, 1); }

    /* 日期行 */

    .text-wrapper_2-1,

      font-weight: 400;
      text-align: left;
      white-space: nowrap;
      line-height: 20px;
    }

    /* ============================================================
       响应式适配
       ============================================================ */
    @media (max-width: 375px) {
      .list_1 { width: 100%; }
      .section_1, .section_2 { width: 100%; }
      .image_3 { width: 100%; }
    }
  </style>
</head>
