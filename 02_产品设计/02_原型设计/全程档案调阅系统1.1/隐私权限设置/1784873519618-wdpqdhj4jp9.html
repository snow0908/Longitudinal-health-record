<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="common.css">
  <style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>
</head>

<body class="bg-[#F5F7FA] min-h-screen w-[390px] mx-auto overflow-x-hidden font-sans">

<!-- 状态栏 -->
<div class="status-bar">
    <span>9:41</span>
    <div class="status-bar-icons">
        <div class="signal-bars">
            <span></span><span></span><span></span><span></span>
        </div>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="color:#000000">
            <path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2L13.5 6.2C12.1 4.9 10.1 4 8 4C5.9 4 3.9 4.9 2.5 6.2L1.5 5.2C3.2 3.5 5.5 2.5 8 2.5Z" fill="currentColor"/>
            <path d="M8 6C9.4 6 10.7 6.5 11.7 7.5L10.7 8.5C10 7.8 9 7.5 8 7.5C7 7.5 6 7.8 5.3 8.5L4.3 7.5C5.3 6.5 6.6 6 8 6Z" fill="currentColor"/>
            <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
        </svg>
        <div class="battery">
            <div class="battery-fill"></div>
        </div>
    </div>
</div>

<!-- 导航栏 -->
<div class="nav-bar">
    <div class="nav-back" onclick="goBack()">
        <img src="../img/返回.png" alt="返回" style="width:24px;height:24px">
    </div>
    <span class="nav-title">隐私权限管理</span>
    <div class="nav-action" onclick="openSettings()">
        <img src="../img/设置.png" alt="设置" style="width: 62px;height:24px">
    </div>
</div>

<style type="text/tailwindcss">
  @theme {
    --color-primary: #1B6FCB;
    --color-primary-light: #2D7DD2;
    --color-primary-lighter: #2D94E8;
    --color-bg-blue-light: #E8F4FE;
    --color-bg-blue-medium: #D0E8FB;
    --color-bg-page: #F5F7FA;
    --color-text-main: #1A2F4B;
    --color-text-secondary: #5A6E85;
    --color-text-tertiary: #8DA1B4;
    --color-divider: #E5EDF5;
    --color-success: #00A86B;
    --color-warning: #FF8C42;
    --color-success-bg: #E6F7EE;
    --color-warning-bg: #FFF3E8;
  }

  @keyframes shimmer {
    0% { opacity: 0.3; }
    50% { opacity: 0.6; }
    100% { opacity: 0.3; }
  }

  @keyframes glow {
    0% { box-shadow: 0 0 8px rgba(27,111,203,0.2); }
    50% { box-shadow: 0 0 16px rgba(27,111,203,0.4); }
    100% { box-shadow: 0 0 8px rgba(27,111,203,0.2); }
  }
</style>


<!-- Main Content -->
<div class="px-[16px] pt-[16px] pb-[32px]">

  <!-- Banner -->
  <div class="relative overflow-hidden rounded-[16px] p-[20px] pb-[22px]" style="background: linear-gradient(135deg, #1B6FCB 0%, #2D94E8 100%);">
    <!-- Grid pattern decoration -->
    <div class="absolute inset-0 opacity-[0.06]">
      <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="white" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
      </svg>
    </div>
    <!-- Arc decorations -->
    <div class="absolute -right-[20px] -top-[20px] w-[100px] h-[100px] rounded-full border-[1.5px] border-white/10"></div>
    <div class="absolute -right-[5px] -top-[5px] w-[70px] h-[70px] rounded-full border-[1px] border-white/[0.07]"></div>
    <div class="absolute left-[30px] -bottom-[30px] w-[80px] h-[80px] rounded-full border-[1px] border-white/[0.05]"></div>

    <div class="relative flex items-start justify-between">
      <div class="flex-1 pr-[12px]">
        <h2 class="text-[19px] font-bold text-white leading-tight mb-[6px]">健康档案隐私保护</h2>
        <p class="text-[13px] text-white/80 leading-[1.5] mb-[10px]">管理您的健康档案调阅权限，全方位保护个人隐私</p>
        <p class="text-[10px] text-white/40 leading-[1.4]">数据加密传输 · 访问可追溯 · 符合国家卫健委数据安全规范</p>
      </div>
      <!-- Shield Icon with glow -->
      <div class="relative flex-shrink-0 mt-[2px]">
        <div class="absolute inset-0 rounded-full" style="animation: glow 3s ease-in-out infinite;"></div>
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
          <defs>
            <linearGradient id="shieldGrad" x1="10" y1="6" x2="42" y2="46">
              <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="white" stop-opacity="0.7"/>
            </linearGradient>
            <linearGradient id="shieldInner" x1="18" y1="14" x2="34" y2="40">
              <stop offset="0%" stop-color="#1B6FCB"/>
              <stop offset="100%" stop-color="#2D94E8"/>
            </linearGradient>
          </defs>
          <path d="M26 4L10 11V23C10 34.05 16.84 44.22 26 47C35.16 44.22 42 34.05 42 23V11L26 4Z" fill="url(#shieldGrad)" opacity="0.2"/>
          <path d="M26 7L12 13V24C12 33.5 17.84 42.2 26 44.8C34.16 42.2 40 33.5 40 24V13L26 7Z" fill="url(#shieldGrad)" opacity="0.9"/>
          <path d="M22 26L25 29L31 22" stroke="url(#shieldInner)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Statistics Cards -->
  <div class="grid grid-cols-3 gap-[10px] mt-[14px]">
    <!-- Blocked Institutions -->
    <div class="bg-white rounded-[12px] py-[16px] px-[10px] text-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.08);">
      <p class="text-[26px] font-bold text-text-tertiary leading-none mb-[6px]">0</p>
      <p class="text-[11px] text-text-tertiary">已屏蔽机构</p>
    </div>
    <!-- Blocked Modules -->
    <div class="bg-white rounded-[12px] py-[16px] px-[10px] text-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.08);">
      <p class="text-[26px] font-bold text-primary leading-none mb-[6px]">3</p>
      <p class="text-[11px] text-text-secondary">已屏蔽模块</p>
    </div>
    <!-- Security Lock -->
    <div class="bg-white rounded-[12px] py-[16px] px-[10px] text-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.08);">
      <div class="flex items-center justify-center mb-[6px]">
        <span class="inline-block px-[8px] py-[3px] rounded-full bg-warning-bg text-warning text-[11px] font-medium leading-none">未开启</span>
      </div>
      <p class="text-[11px] text-text-tertiary">安全锁</p>
    </div>
  </div>

  <!-- Privacy Status Hint -->
  <div class="flex items-center mt-[12px] mb-[18px] pl-[2px]">
    <span class="w-[6px] h-[6px] rounded-full bg-success mr-[6px] inline-block"></span>
    <span class="text-[11px] text-text-tertiary">隐私保护状态：良好</span>
  </div>

  <!-- Section Title -->
  <div class="flex items-center mb-[12px]">
    <span class="w-[3px] h-[16px] bg-primary rounded-full mr-[8px] inline-block"></span>
    <span class="text-[15px] font-bold text-text-main">隐私设置</span>
  </div>

  <!-- Settings List -->
  <div class="space-y-[10px]">

    <!-- Item 1: 医域边界 -->
    <div class="bg-white rounded-[12px] px-[14px] py-[16px] flex items-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.06);">
      <div class="w-[44px] h-[44px] rounded-[10px] bg-bg-blue-light flex items-center justify-center flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M3 8H19V17C19 18.1 18.1 19 17 19H5C3.9 19 3 18.1 3 17V8Z" fill="#1B6FCB" opacity="0.15"/>
          <path d="M5 3H17C18.1 3 19 3.9 19 5V8H3V5C3 3.9 3.9 3 5 3Z" fill="#1B6FCB" opacity="0.3"/>
          <rect x="3" y="3" width="16" height="16" rx="2" stroke="#1B6FCB" stroke-width="1.5" fill="none"/>
          <path d="M7 8V3" stroke="#1B6FCB" stroke-width="1.2"/>
          <path d="M11 8V3" stroke="#1B6FCB" stroke-width="1.2"/>
          <path d="M15 8V3" stroke="#1B6FCB" stroke-width="1.2"/>
          <rect x="6" y="10" width="4" height="3" rx="0.5" fill="#1B6FCB" opacity="0.5"/>
          <rect x="12" y="10" width="4" height="3" rx="0.5" fill="#1B6FCB" opacity="0.5"/>
          <rect x="6" y="15" width="4" height="2" rx="0.5" fill="#1B6FCB" opacity="0.3"/>
          <rect x="12" y="15" width="4" height="2" rx="0.5" fill="#1B6FCB" opacity="0.3"/>
        </svg>
      </div>
      <div class="flex-1 ml-[12px]">
        <div class="flex items-center gap-[8px] mb-[4px]">
          <span class="text-[15px] font-semibold text-text-main">医域边界</span>
          <span class="inline-block px-[6px] py-[2px] rounded-[4px] bg-[#F0F3F7] text-[11px] text-text-tertiary leading-[1.4]">未设置</span>
        </div>
        <p class="text-[12px] text-text-secondary leading-[1.4]">设置不可查看您健康档案的机构</p>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" class="flex-shrink-0 ml-[8px]">
        <path d="M1 1L7 7L1 13" stroke="#C5D1DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Item 2: 隐私保险箱 -->
    <div class="bg-white rounded-[12px] px-[14px] py-[16px] flex items-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.06);">
      <div class="w-[44px] h-[44px] rounded-[10px] bg-success-bg flex items-center justify-center flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="3" y="9" width="16" height="11" rx="2" stroke="#00A86B" stroke-width="1.5" fill="none"/>
          <rect x="3" y="9" width="16" height="11" rx="2" fill="#00A86B" opacity="0.1"/>
          <path d="M7 9V6C7 3.79 8.79 2 11 2C13.21 2 15 3.79 15 6V9" stroke="#00A86B" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="11" cy="14" r="2" fill="#00A86B" opacity="0.6"/>
          <path d="M11 14V17" stroke="#00A86B" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="flex-1 ml-[12px]">
        <div class="flex items-center gap-[8px] mb-[4px]">
          <span class="text-[15px] font-semibold text-text-main">隐私保险箱</span>
          <span class="inline-block px-[6px] py-[2px] rounded-[4px] bg-success-bg text-[11px] text-success font-medium leading-[1.4]">已屏蔽3项</span>
        </div>
        <p class="text-[12px] text-text-secondary leading-[1.4]">已设置3个模块数据屏蔽</p>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" class="flex-shrink-0 ml-[8px]">
        <path d="M1 1L7 7L1 13" stroke="#C5D1DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Item 3: 调阅安全锁 -->
    <div class="bg-white rounded-[12px] px-[14px] py-[16px] flex items-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.06);">
      <div class="w-[44px] h-[44px] rounded-[10px] bg-[#EEF2F7] flex items-center justify-center flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="4" y="10" width="14" height="10" rx="2" stroke="#5A6E85" stroke-width="1.5" fill="none"/>
          <rect x="4" y="10" width="14" height="10" rx="2" fill="#5A6E85" opacity="0.08"/>
          <path d="M7 10V7C7 4.79 8.79 3 11 3C13.21 3 15 4.79 15 7V10" stroke="#5A6E85" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="11" cy="15" r="1.5" fill="#5A6E85" opacity="0.5"/>
          <path d="M11 15.5V17.5" stroke="#5A6E85" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="flex-1 ml-[12px]">
        <div class="flex items-center gap-[8px] mb-[4px]">
          <span class="text-[15px] font-semibold text-text-main">调阅安全锁</span>
          <span class="inline-block px-[6px] py-[2px] rounded-[4px] bg-warning-bg text-[11px] text-warning font-medium leading-[1.4]">关闭</span>
        </div>
        <p class="text-[12px] text-text-secondary leading-[1.4]">开启后，调阅档案需要输入密码</p>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" class="flex-shrink-0 ml-[8px]">
        <path d="M1 1L7 7L1 13" stroke="#C5D1DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Item 4: 访问即时通 -->
    <div class="bg-white rounded-[12px] px-[14px] py-[16px] flex items-center" style="box-shadow: 0 2px 12px rgba(27,111,203,0.06);">
      <div class="w-[44px] h-[44px] rounded-[10px] bg-bg-blue-light flex items-center justify-center flex-shrink-0">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M4 5H18C19.1 5 20 5.9 20 7V15C20 16.1 19.1 17 18 17H6L2 20V7C2 5.9 2.9 5 4 5Z" stroke="#1B6FCB" stroke-width="1.5" fill="none"/>
          <path d="M4 5H18C19.1 5 20 5.9 20 7V15C20 16.1 19.1 17 18 17H6L2 20V7C2 5.9 2.9 5 4 5Z" fill="#1B6FCB" opacity="0.1"/>
          <circle cx="7.5" cy="11" r="1" fill="#1B6FCB" opacity="0.6"/>
          <circle cx="11" cy="11" r="1" fill="#1B6FCB" opacity="0.6"/>
          <circle cx="14.5" cy="11" r="1" fill="#1B6FCB" opacity="0.6"/>
        </svg>
      </div>
      <div class="flex-1 ml-[12px]">
        <div class="flex items-center gap-[8px] mb-[4px]">
          <span class="text-[15px] font-semibold text-text-main">访问即时通</span>
          <span class="inline-block px-[6px] py-[2px] rounded-[4px] bg-warning-bg text-[11px] text-warning font-medium leading-[1.4]">关闭</span>
        </div>
        <p class="text-[12px] text-text-secondary leading-[1.4]">他人调阅档案时给您发送短信通知</p>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" class="flex-shrink-0 ml-[8px]">
        <path d="M1 1L7 7L1 13" stroke="#C5D1DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

  </div>

</div>

</body>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
