<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>访问即时通</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>

<!-- 状态栏 -->
<div class="status-bar">
    <span>9:41</span>
    <div class="status-bar-icons">
        <div class="signal-bars">
            <span></span><span></span><span></span><span></span>
        </div>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="color:#000000">
            <path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2L13.5 6.2C12.1 4.9 10.1 4 8 4C5.9 4 3.9 4.9 2.5 6.2L1.5 5.2C3.2 3.5 5.5 2.5 8 2.5Z" fill="currentColor"/>
            <path d="M8 6C9.4 6 10.7 6.5 11.7 7.5L10.7 8.5C10 7.8 9 7.5 8 7.5C7 7.5 6 7.8 5.3 8.5L4.3 7.5C5.3 6.5 6.6 6 8 6Z" fill="currentColor"/>
            <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
        </svg>
        <div class="battery">
            <div class="battery-fill"></div>
        </div>
    </div>
</div>

<!-- 导航栏 -->
<div class="nav-bar">
    <div class="nav-back" onclick="goBack()">
        <img src="../img/返回.png" alt="返回" style="width:24px;height:24px">
    </div>
    <span class="nav-title">访问即时通</span>
    <div class="nav-action" onclick="openSettings()">
        <img src="../img/设置.png" alt="设置" style="width: 62px;height:24px">
    </div>
</div>

<!-- 页面内容 -->
<div class="page">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        访问即时通
    </div>
    <div class="section-desc">开启后，当他人调阅您的健康档案时，系统将实时给您发送短信通知，让您随时掌握档案访问动态。</div>

    <div class="im-card">
        <div class="im-switch-row">
            <div class="label-area">
                <div class="label">短信通知</div>
                <div class="sub">开启后，档案被调阅时发送短信</div>
            </div>
            <div class="mini-switch" id="imSwitch" onclick="toggleIM()"></div>
        </div>

        <div class="im-preview" id="imPreview">
            <div class="im-preview-inner">
                <div class="pwd-label" style="margin-bottom:6px">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    短信预览
                </div>
                <div class="sms-preview">
                    <div class="sms-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        短信通知
                    </div>
                    <div class="sms-content">
                        【健康档案】您的健康档案于 <span id="smsTime" style="color:var(--primary);font-weight:600">2025年1月15日 14:30</span> 被 <span style="color:var(--primary);font-weight:600" id="smsOrg">市第一人民医院</span> 的 <span style="color:var(--primary);font-weight:600" id="smsDoctor">张医生</span> 调阅，调阅内容：<span id="smsContent" style="font-weight:500">门诊记录、检验报告</span>。如非本人操作，请及时联系客服。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="im-card" id="imNotifyCard" style="display:none">
        <div class="pwd-label" style="margin-bottom:4px;padding:0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            近期调阅通知
        </div>
        <div class="im-notify-list" id="imNotifyList">
            <div class="im-notify-item">
                <div class="im-notify-dot unread"></div>
                <div class="im-notify-content">
                    <div class="im-notify-text">市第一人民医院 张医生 调阅了您的<span style="color:var(--primary);font-weight:600">门诊记录</span></div>
                    <div class="im-notify-time">2025-01-15 14:30</div>
                </div>
            </div>
            <div class="im-notify-item">
                <div class="im-notify-dot unread"></div>
                <div class="im-notify-content">
                    <div class="im-notify-text">社区卫生服务中心 李护士 调阅了您的<span style="color:var(--primary);font-weight:600">随访记录</span></div>
                    <div class="im-notify-time">2025-01-14 09:15</div>
                </div>
            </div>
            <div class="im-notify-item">
                <div class="im-notify-dot read"></div>
                <div class="im-notify-content">
                    <div class="im-notify-text">市第二人民医院 王医生 调阅了您的<span style="color:var(--primary);font-weight:600">检验报告</span></div>
                    <div class="im-notify-time">2025-01-12 16:42</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bottom-bar">
    <button class="btn btn-primary" onclick="saveIM()">保存</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const APP_STATE_KEY = 'privacy_app_state';

const ICONS = {
    successCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    warningCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
};

function loadState() {
    try {
        const raw = localStorage.getItem(APP_STATE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { blockedOrgs: [], modules: {}, lockEnabled: false, lockPassword: '', imEnabled: false };
}

function saveState(state) {
    localStorage.setItem(APP_STATE_KEY, JSON.stringify(state));
}

let imEnabled = false;

function init() {
    const state = loadState();
    imEnabled = state.imEnabled || false;

    if (imEnabled) {
        document.getElementById('imSwitch').classList.add('on');
        document.getElementById('imPreview').classList.add('show');
        document.getElementById('imNotifyCard').style.display = 'block';
    }
}

function toggleIM() {
    const sw = document.getElementById('imSwitch');
    const preview = document.getElementById('imPreview');
    const notifyCard = document.getElementById('imNotifyCard');

    imEnabled = !imEnabled;
    sw.classList.toggle('on');

    if (imEnabled) {
        preview.classList.add('show');
        notifyCard.style.display = 'block';
    } else {
        preview.classList.remove('show');
        notifyCard.style.display = 'none';
    }
}

function saveIM() {
    const state = loadState();
    state.imEnabled = imEnabled;
    saveState(state);

    showToast(imEnabled ? '即时通已开启' : '即时通已关闭');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
}

function goBack() {
    window.location.href = 'index.html';
}

function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = type === 'success' ? ICONS.successCircle : ICONS.warningCircle;
    const iconColor = type === 'success' ? '#15CF6E' : '#FEA800';
    toast.innerHTML = `<div class="toast-icon" style="color:${iconColor}">${icon}</div><div class="toast-text">${msg}</div>`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
}

// 初始化
init();
</script>

</body>
</html>
