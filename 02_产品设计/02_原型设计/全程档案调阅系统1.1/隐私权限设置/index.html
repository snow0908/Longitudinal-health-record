<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健康档案隐私权限管理</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>

<!-- 状态栏 -->
<div class="status-bar">
    <span>9:41</span>
    <div class="status-bar-icons">
        <div class="signal-bars">
            <span></span><span></span><span></span><span></span>
        </div>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="color:#000000">
            <path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2L13.5 6.2C12.1 4.9 10.1 4 8 4C5.9 4 3.9 4.9 2.5 6.2L1.5 5.2C3.2 3.5 5.5 2.5 8 2.5Z" fill="currentColor"/>
            <path d="M8 6C9.4 6 10.7 6.5 11.7 7.5L10.7 8.5C10 7.8 9 7.5 8 7.5C7 7.5 6 7.8 5.3 8.5L4.3 7.5C5.3 6.5 6.6 6 8 6Z" fill="currentColor"/>
            <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
        </svg>
        <div class="battery">
            <div class="battery-fill"></div>
        </div>
    </div>
</div>

<!-- 导航栏 -->
<div class="nav-bar">
    <div class="nav-back" onclick="goBack()">
        <img src="../img/返回.png" alt="返回" style="width:24px;height:24px">
    </div>
    <span class="nav-title">隐私权限管理</span>
    <div class="nav-action" onclick="openSettings()">
        <img src="../img/设置.png" alt="设置" style="width: 62px;height:24px">
    </div>
</div>

<!-- 主页内容 -->
<div class="page">
    <div class="privacy-header">
        <div class="shield-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
        </div>
        <h2>健康档案隐私保护</h2>
        <p>管理您的健康档案调阅权限，全方位保护个人隐私</p>
        <div class="header-tags">
            <span>数据加密传输</span>
            <span class="tag-dot"></span>
            <span>访问可追溯</span>
            <span class="tag-dot"></span>
            <span>符合国家卫健委数据安全规范</span>
        </div>
        <div class="header-decoration"></div>
    </div>

    <div class="stat-bar">
        <div class="stat-item">
            <div class="stat-num" id="statOrg">0</div>
            <div class="stat-label">已屏蔽机构</div>
        </div>
        <div class="stat-item">
            <div class="stat-num danger" id="statModule">0</div>
            <div class="stat-label">已屏蔽模块</div>
        </div>
        <div class="stat-item">
            <span class="feature-badge off-warning" id="statLock" style="font-size:12px;padding:4px 10px">未开启</span>
            <div class="stat-label">安全锁</div>
        </div>
    </div>

    <div class="section-label">隐私设置</div>

    <div class="feature-list">
        <!-- 医域边界 -->
        <a href="boundary.html" style="text-decoration:none;color:inherit">
            <div class="feature-card" style="--card-color: var(--primary)">
                <div class="feature-icon blue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M3 7l1-4h16l1 4M3 7v14M21 7v14M8 11h8M8 15h8"/>
                    </svg>
                </div>
                <div class="feature-content">
                    <div class="feature-title">
                        医域边界
                        <span class="feature-badge off" id="badgeBoundary">未设置</span>
                    </div>
                    <div class="feature-desc" id="descBoundary">设置不可查看您健康档案的机构</div>
                </div>
                <span class="feature-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </span>
            </div>
        </a>

        <!-- 隐私保险箱 -->
        <a href="safebox.html" style="text-decoration:none;color:inherit">
            <div class="feature-card" style="--card-color: var(--success)">
                <div class="feature-icon green">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <div class="feature-content">
                    <div class="feature-title">
                        隐私保险箱
                        <span class="feature-badge off" id="badgeSafebox">未设置</span>
                    </div>
                    <div class="feature-desc" id="descSafebox">按模块屏蔽您的诊疗业务数据</div>
                </div>
                <span class="feature-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </span>
            </div>
        </a>

        <!-- 调阅安全锁 -->
        <a href="lock.html" style="text-decoration:none;color:inherit">
            <div class="feature-card" style="--card-color: var(--warning)">
                <div class="feature-icon orange">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <circle cx="12" cy="16" r="1"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <div class="feature-content">
                    <div class="feature-title">
                        调阅安全锁
                        <span class="feature-badge off" id="badgeLock">关闭</span>
                    </div>
                    <div class="feature-desc" id="descLock">开启后调阅档案需要验证密码</div>
                </div>
                <span class="feature-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </span>
            </div>
        </a>

        <!-- 访问即时通 -->
        <a href="im.html" style="text-decoration:none;color:inherit">
            <div class="feature-card" style="--card-color: #8B5CF6">
                <div class="feature-icon purple">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>
                </div>
                <div class="feature-content">
                    <div class="feature-title">
                        访问即时通
                        <span class="feature-badge off" id="badgeIM">关闭</span>
                    </div>
                    <div class="feature-desc" id="descIM">他人调阅档案时给您发送短信通知</div>
                </div>
                <span class="feature-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </span>
            </div>
        </a>
    </div>
</div>

<script>
// ====== 数据模型 ======
const APP_STATE_KEY = 'privacy_app_state';

// 默认业务模块数据（用于统计）
const moduleData = [
    { id: 'maternity', name: '孕产妇管理', subItems: [{id:'m1'},{id:'m2'},{id:'m3'},{id:'m4'},{id:'m5'}] },
    { id: 'hypertension', name: '高血压患者管理', subItems: [{id:'h1'},{id:'h2'},{id:'h3'},{id:'h4'}] },
    { id: 'diabetes', name: '糖尿病患者管理', subItems: [{id:'d1'},{id:'d2'},{id:'d3'}] },
    { id: 'children', name: '0-6岁儿童管理', subItems: [{id:'c1'},{id:'c2'},{id:'c3'},{id:'c4'}] },
    { id: 'elderly', name: '老年人健康管理', subItems: [{id:'e1'},{id:'e2'},{id:'e3'}] },
    { id: 'mental', name: '严重精神障碍患者管理', subItems: [{id:'p1'},{id:'p2'},{id:'p3'}] }
];

function loadState() {
    try {
        const raw = localStorage.getItem(APP_STATE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return getDefaultState();
}

function getDefaultState() {
    const modules = {};
    moduleData.forEach(m => { modules[m.id] = { mode: 'none', blockedItems: [] }; });
    return {
        blockedOrgs: [],
        modules: modules,
        lockEnabled: false,
        lockPassword: '',
        imEnabled: false
    };
}

function updateHomeStats() {
    const state = loadState();
    const orgCount = (state.blockedOrgs || []).length;
    document.getElementById('statOrg').textContent = orgCount;

    const badgeB = document.getElementById('badgeBoundary');
    const descB = document.getElementById('descBoundary');
    if (orgCount > 0) {
        badgeB.textContent = `已屏蔽${orgCount}家`;
        badgeB.className = 'feature-badge on';
        descB.textContent = `已设置${orgCount}家机构不可查看档案`;
    } else {
        badgeB.textContent = '未设置';
        badgeB.className = 'feature-badge off';
        descB.textContent = '设置不可查看您健康档案的机构';
    }

    let moduleCount = 0;
    if (state.modules) {
        Object.values(state.modules).forEach(m => {
            if (m.mode !== 'none') moduleCount++;
        });
    }
    document.getElementById('statModule').textContent = moduleCount;
    const badgeS = document.getElementById('badgeSafebox');
    const descS = document.getElementById('descSafebox');
    if (moduleCount > 0) {
        badgeS.textContent = `已屏蔽${moduleCount}项`;
        badgeS.className = 'feature-badge on';
        descS.textContent = `已设置${moduleCount}个模块数据屏蔽`;
    } else {
        badgeS.textContent = '未设置';
        badgeS.className = 'feature-badge off';
        descS.textContent = '按模块屏蔽您的诊疗业务数据';
    }

    const badgeL = document.getElementById('badgeLock');
    const descL = document.getElementById('descLock');
    const statL = document.getElementById('statLock');
    if (state.lockEnabled && state.lockPassword) {
        badgeL.textContent = '已开启';
        badgeL.className = 'feature-badge on';
        descL.textContent = '调阅档案需验证密码';
        statL.textContent = '已开启';
        statL.className = 'feature-badge on';
        statL.style.cssText = 'font-size:12px;padding:4px 10px';
    } else {
        badgeL.textContent = '关闭';
        badgeL.className = 'feature-badge off off-warning';
        descL.textContent = '开启后，调阅档案需要输入密码';
        statL.textContent = '未开启';
        statL.className = 'feature-badge off-warning';
        statL.style.cssText = 'font-size:12px;padding:4px 10px';
    }

    const badgeI = document.getElementById('badgeIM');
    const descI = document.getElementById('descIM');
    if (state.imEnabled) {
        badgeI.textContent = '已开启';
        badgeI.className = 'feature-badge on';
        descI.textContent = '档案被调阅时将发送短信通知';
    } else {
        badgeI.textContent = '关闭';
        badgeI.className = 'feature-badge off off-warning';
        descI.textContent = '他人调阅档案时给您发送短信通知';
    }
}

function goBack() {
    window.location.href = '../个人中心/index.html';
}

function openSettings() {
    // 设置功能入口
}

// 初始化
updateHomeStats();
</script>

</body>
</html>
