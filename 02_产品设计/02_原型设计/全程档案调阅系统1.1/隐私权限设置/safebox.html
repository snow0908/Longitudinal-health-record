<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隐私保险箱</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>

<!-- 状态栏 -->
<div class="status-bar">
    <span>9:41</span>
    <div class="status-bar-icons">
        <div class="signal-bars">
            <span></span><span></span><span></span><span></span>
        </div>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="color:#000000">
            <path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2L13.5 6.2C12.1 4.9 10.1 4 8 4C5.9 4 3.9 4.9 2.5 6.2L1.5 5.2C3.2 3.5 5.5 2.5 8 2.5Z" fill="currentColor"/>
            <path d="M8 6C9.4 6 10.7 6.5 11.7 7.5L10.7 8.5C10 7.8 9 7.5 8 7.5C7 7.5 6 7.8 5.3 8.5L4.3 7.5C5.3 6.5 6.6 6 8 6Z" fill="currentColor"/>
            <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
        </svg>
        <div class="battery">
            <div class="battery-fill"></div>
        </div>
    </div>
</div>

<!-- 导航栏 -->
<div class="nav-bar">
    <div class="nav-back" onclick="goBack()">
        <img src="../img/返回.png" alt="返回" style="width:24px;height:24px">
    </div>
    <span class="nav-title">隐私保险箱</span>
    <div class="nav-action" onclick="openSettings()">
        <img src="../img/设置.png" alt="设置" style="width: 62px;height:24px">
    </div>
</div>

<!-- 页面内容 -->
<div class="page">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        隐私保险箱
    </div>
    <div class="section-desc">选择需要屏蔽的业务模块数据，支持全部屏蔽或部分屏蔽。被屏蔽的数据将无法被他人调阅。</div>

    <div class="info-banner amber">
        <span class="banner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </span>
        <span>屏蔽后，对应的业务数据将不再对其他医务人员可见，请谨慎操作。</span>
    </div>

    <div id="moduleList"></div>
</div>

<div class="bottom-bar">
    <button class="btn btn-primary" onclick="saveSafebox()">保存设置</button>
</div>

<!-- 底部抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
        <div class="drawer-title" id="drawerTitle">选择屏蔽方式</div>
        <div class="drawer-close" onclick="closeDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const APP_STATE_KEY = 'privacy_app_state';

const ICONS = {
    successCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    warningCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
};

// 模块SVG图标映射
function getModuleSvgIcon(moduleId) {
    const icons = {
        maternity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
        hypertension: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
        diabetes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.3 0z"/></svg>',
        children: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="5"/><path d="M3 21v-2a7 7 0 0 1 7-7h4a7 7 0 0 1 7 7v2"/></svg>',
        elderly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M12 11v8"/><path d="M8 14l-3 7h4l3-4 3 4h4l-3-7"/></svg>',
        mental: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M9 10h6M10 14h4"/><path d="M12 10v8"/><path d="M8 18c0-2 2-4 4-4s4 2 4 4"/></svg>'
    };
    return icons[moduleId] || '';
}

// 业务模块数据（与 safebox-sub 共享）
const moduleData = [
    {
        id: 'maternity', name: '孕产妇管理', icon: '🤰', color: '#FFF0F0', iconColor: '#FF6B6B',
        subItems: [
            { id: 'm1', name: '首次产检随访', date: '2024-10-15', doctor: '王丽华', type: 'followup', typeName: '随访' },
            { id: 'm2', name: '孕中期随访', date: '2024-12-20', doctor: '王丽华', type: 'followup', typeName: '随访' },
            { id: 'm3', name: '孕晚期随访', date: '2025-01-10', doctor: '张芳', type: 'followup', typeName: '随访' },
            { id: 'm4', name: '产后访视', date: '2025-01-20', doctor: '张芳', type: 'followup', typeName: '随访' },
            { id: 'm5', name: '产后42天健康检查', date: '2025-02-05', doctor: '王丽华', type: 'checkup', typeName: '体检' },
        ]
    },
    {
        id: 'hypertension', name: '高血压患者管理', icon: '🩺', color: '#FDEDEE', iconColor: '#E84855',
        subItems: [
            { id: 'h1', name: '随访记录（2025-01）', date: '2025-01-05', doctor: '李明', type: 'followup', typeName: '随访' },
            { id: 'h2', name: '随访记录（2024-12）', date: '2024-12-05', doctor: '李明', type: 'followup', typeName: '随访' },
            { id: 'h3', name: '随访记录（2024-11）', date: '2024-11-05', doctor: '陈强', type: 'followup', typeName: '随访' },
            { id: 'h4', name: '年度健康评估', date: '2024-12-30', doctor: '李明', type: 'checkup', typeName: '评估' },
        ]
    },
    {
        id: 'diabetes', name: '糖尿病患者管理', icon: '💉', color: '#EDFAF9', iconColor: '#4ECDC4',
        subItems: [
            { id: 'd1', name: '随访记录（2025-01）', date: '2025-01-08', doctor: '赵伟', type: 'followup', typeName: '随访' },
            { id: 'd2', name: '随访记录（2024-12）', date: '2024-12-08', doctor: '赵伟', type: 'followup', typeName: '随访' },
            { id: 'd3', name: '糖化血红蛋白检测', date: '2025-01-08', doctor: '赵伟', type: 'test', typeName: '检验' },
        ]
    },
    {
        id: 'children', name: '0-6岁儿童管理', icon: '👶', color: '#EDF7FA', iconColor: '#45B7D1',
        subItems: [
            { id: 'c1', name: '新生儿访视', date: '2024-06-10', doctor: '孙颖', type: 'followup', typeName: '访视' },
            { id: 'c2', name: '1岁健康检查', date: '2024-09-15', doctor: '孙颖', type: 'checkup', typeName: '体检' },
            { id: 'c3', name: '疫苗接种记录', date: '2024-12-20', doctor: '周婷', type: 'other', typeName: '接种' },
            { id: 'c4', name: '视力筛查', date: '2025-01-05', doctor: '孙颖', type: 'test', typeName: '筛查' },
        ]
    },
    {
        id: 'elderly', name: '老年人健康管理', icon: '👴', color: '#FEF7E6', iconColor: '#F9A825',
        subItems: [
            { id: 'e1', name: '年度体检报告', date: '2024-11-20', doctor: '刘洋', type: 'checkup', typeName: '体检' },
            { id: 'e2', name: '生活方式指导', date: '2024-12-15', doctor: '刘洋', type: 'other', typeName: '指导' },
            { id: 'e3', name: '随访记录（2025-01）', date: '2025-01-12', doctor: '刘洋', type: 'followup', typeName: '随访' },
        ]
    },
    {
        id: 'mental', name: '严重精神障碍患者管理', icon: '🧠', color: '#F2EEFE', iconColor: '#7C5CFC',
        subItems: [
            { id: 'p1', name: '随访记录（2025-01）', date: '2025-01-03', doctor: '马俊', type: 'followup', typeName: '随访' },
            { id: 'p2', name: '用药指导', date: '2025-01-03', doctor: '马俊', type: 'other', typeName: '指导' },
            { id: 'p3', name: '康复评估', date: '2024-12-20', doctor: '马俊', type: 'checkup', typeName: '评估' },
        ]
    }
];

function loadState() {
    try {
        const raw = localStorage.getItem(APP_STATE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return getDefaultState();
}

function getDefaultState() {
    const modules = {};
    moduleData.forEach(m => { modules[m.id] = { mode: 'none', blockedItems: [] }; });
    return { blockedOrgs: [], modules: modules, lockEnabled: false, lockPassword: '', imEnabled: false };
}

function saveState(state) {
    localStorage.setItem(APP_STATE_KEY, JSON.stringify(state));
}

let currentDrawerModuleId = null;
let tempDrawerMode = null;

function init() {
    // 确保 state 中有所有模块的默认值
    const state = loadState();
    let changed = false;
    moduleData.forEach(m => {
        if (!state.modules[m.id]) {
            state.modules[m.id] = { mode: 'none', blockedItems: [] };
            changed = true;
        }
    });
    if (changed) saveState(state);
    renderModuleList();
}

function renderModuleList() {
    const state = loadState();
    const list = document.getElementById('moduleList');
    const modeIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    list.innerHTML = moduleData
        .filter(m => m.id !== 'hypertension')
        .map(m => {
        const state_m = state.modules[m.id] || { mode: 'none', blockedItems: [] };
        const blockedItems = Array.isArray(state_m.blockedItems) ? state_m.blockedItems : [];
        const statusClass = state_m.mode === 'all' ? 'all' : state_m.mode === 'partial' ? 'partial' : 'none';
        const statusText = state_m.mode === 'all' ? '全部屏蔽' : state_m.mode === 'partial' ? `部分屏蔽(${blockedItems.length})` : '未屏蔽';

        return `
        <div class="module-card">
            <div class="module-header" onclick="openShieldDrawer('${m.id}')">
                <div class="module-icon" style="background:${m.color}; color:${m.iconColor}">${getModuleSvgIcon(m.id)}</div>
                <div class="module-name">${m.name}</div>
                <span class="module-status ${statusClass}" id="module-status-${m.id}">${statusText}</span>
                <span class="module-arrow">${modeIconSvg}</span>
            </div>
        </div>`;
    }).join('');
}

// ====== 底部抽屉弹框 ======
function openShieldDrawer(moduleId) {
    currentDrawerModuleId = moduleId;
    const state = loadState();
    const state_m = state.modules[moduleId] || { mode: 'none', blockedItems: [] };
    const blockedItems = Array.isArray(state_m.blockedItems) ? state_m.blockedItems : [];
    tempDrawerMode = state_m.mode || 'none';

    const m = moduleData.find(x => x.id === moduleId);
    const blockedCount = blockedItems.length;

    document.getElementById('drawerTitle').textContent = '选择屏蔽方式';

    document.getElementById('drawerBody').innerHTML = `
        <div class="drawer-module-info">
            <div class="info-count">${m.name} · 共 ${m.subItems.length} 条记录${blockedCount > 0 ? ` · 已屏蔽 ${blockedCount} 条` : ''}</div>
        </div>
        <div class="shield-options">
            <div class="shield-option" onclick="selectDrawerMode('none')">
                <span class="shield-option-title">不屏蔽</span>
                <span class="shield-option-radio ${tempDrawerMode === 'none' ? 'checked' : ''}" id="radio-none"></span>
            </div>
            <div class="shield-option" onclick="selectDrawerMode('partial')">
                <span class="shield-option-title">部分屏蔽</span>
                <span class="shield-option-radio ${tempDrawerMode === 'partial' ? 'checked' : ''}" id="radio-partial"></span>
            </div>
            <div class="shield-option" onclick="selectDrawerMode('all')">
                <span class="shield-option-title">全部屏蔽</span>
                <span class="shield-option-radio ${tempDrawerMode === 'all' ? 'checked danger' : ''}" id="radio-all"></span>
            </div>
        </div>
    `;

    document.getElementById('drawerMask').classList.add('show');
    document.getElementById('drawer').classList.add('show');
}

function closeDrawer() {
    document.getElementById('drawerMask').classList.remove('show');
    document.getElementById('drawer').classList.remove('show');
    currentDrawerModuleId = null;
    tempDrawerMode = null;
}

function selectDrawerMode(mode) {
    if (!currentDrawerModuleId) return;

    const moduleId = currentDrawerModuleId;
    const state = loadState();
    const m = state.modules[moduleId];
    const moduleDef = moduleData.find(x => x.id === moduleId);

    m.mode = mode;

    if (mode === 'all') {
        m.blockedItems = moduleDef.subItems.map(item => item.id);
    } else if (mode === 'none') {
        m.blockedItems = [];
    }

    saveState(state);
    closeDrawer();

    if (mode === 'partial') {
        sessionStorage.setItem('safebox_sub_module', moduleId);
        setTimeout(() => { window.location.href = 'safebox-sub.html'; }, 300);
    } else {
        renderModuleList();
    }
}

function saveSafebox() {
    const state = loadState();
    let bc = 0;
    Object.values(state.modules).forEach(m => { if (m.mode !== 'none') bc++; });
    showToast(`已保存，共屏蔽${bc}个模块`);
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
}

function goBack() {
    window.location.href = 'index.html';
}

function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = type === 'success' ? ICONS.successCircle : ICONS.warningCircle;
    const iconColor = type === 'success' ? '#15CF6E' : '#FEA800';
    toast.innerHTML = `<div class="toast-icon" style="color:${iconColor}">${icon}</div><div class="toast-text">${msg}</div>`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
}

// 初始化
init();
</script>

</body>
</html>
