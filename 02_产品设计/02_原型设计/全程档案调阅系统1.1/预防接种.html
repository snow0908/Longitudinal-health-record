<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>预防接种</title>
    <style>
        /* ============================================================
           样式参照 肺结核随访记录表2（nav-bar 风格）
           基准宽度：375px
           ============================================================ */

        /* ---------- Reset & Base ---------- */
        * { box-sizing: border-box; flex-shrink: 0; margin: 0; padding: 0; }
        body {
            font-family: PingFangSC-Regular, Roboto, Helvetica Neue, Helvetica, Tahoma, Arial, PingFang SC-Light, Microsoft YaHei;
            background-color: #F3F5F7;
            -webkit-font-smoothing: antialiased;
        }
        .flex-col { display: flex; flex-direction: column; }
        .flex-row { display: flex; flex-direction: row; }
        .justify-between { display: flex; justify-content: space-between; }
        .align-center { display: flex; align-items: center; }

        /* ---------- Page ---------- */
        .page {
            background-color: #F3F5F7;
            position: relative;
            width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 16px;
        }

        /* ============================================================
           导航栏（参照 肺结核随访记录表2 .nav-bar）
           状态栏 + 导航合并为单一白色区块
           ============================================================ */
        .group_1 {
  background-color: rgba(255, 255, 255, 1);
  padding: 14px 16px 7px 16px;
}
        .box_1 {
  margin: 0 10px 0 24px;
}
        .text_1 {
  overflow-wrap: break-word;
  color: rgba(0, 0, 0, 1);
  font-size: 16px;
  letter-spacing: 1.100000023841858px;
  font-family: PingFangSC-Semibold;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  line-height: 22px;
}
        .thumbnail_1 {
  width: 19px;
  height: 12px;
  margin: 5px 0 5px 191px;
}
        .text_2 {
  overflow-wrap: break-word;
  color: rgba(0, 0, 0, 1);
  font-size: 12px;
  letter-spacing: 0.925000011920929px;
  font-family: PingFangSC-Semibold;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  line-height: 17px;
  margin: 3px 0 0 6px;
}
        .image_1 {
  width: 25px;
  height: 13px;
  margin: 5px 0 4px 6px;
}

        .box_2 {
  margin-top: 15px;
  display: flex;
  align-items: center;
}
        .label_1 {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
        .text_3 {
  flex: 1;
  overflow-wrap: break-word;
  color: rgba(51, 51, 51, 1);
  font-size: 16px;
  font-family: PingFangSC-Medium;
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
  line-height: 22px;
  margin: 4px 0 0 34px;
}
        .image_2 {
  width: 78px;
  height: 30px;
  flex-shrink: 0;
}

        /* ============================================================
           内容区
           ============================================================ */
        .section_1 {
            padding: 16px 16px 0 16px;
        }

        /* ============================================================
           概览条
           ============================================================ */
        .group_5 {
            background: #ffffff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f4f8;
        }
        .image-text_5 {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .text-group_1 {
            font-size: 14px;
            font-weight: 400;
            color: #666666;
        }
        .thumbnail_2 {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ============================================================
           时间轴样式
           ============================================================ */
        .timeline {
            display: flex;
            flex-direction: column;
        }

        .timeline-item {
            display: flex;
            position: relative;
            padding-bottom: 0;
        }

        /* 左侧时间轴标记 */
        .timeline-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            flex-shrink: 0;
            position: relative;
            padding-top: 4px;
        }

        .timeline-marker .date {
            font-size: 12px;
            color: #999999;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .timeline-marker .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #096aff;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #096aff;
            z-index: 2;
            flex-shrink: 0;
        }

        .timeline-marker .line {
            flex: 1;
            width: 2px;
            background: #e5e5e5;
            margin: 4px 0 0 0;
            min-height: 20px;
        }

        /* 最后一个时间轴项目隐藏连线 */
        .timeline-item:last-child .timeline-marker .line {
            display: none;
        }

        /* 右侧内容卡片 */
        .timeline-card {
            flex: 1;
            margin-left: 12px;
            margin-bottom: 16px;
            background: #ffffff;
            border-radius: 8px;
            padding: 12px 16px 16px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f4f8;
        }

        .timeline-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #f7f9fc;
            margin-bottom: 8px;
        }

        .timeline-card .card-header .vaccine-name {
            font-size: 15px;
            font-weight: 500;
            color: #333333;
        }

        .timeline-card .card-header .status-tag {
            font-size: 12px;
            font-weight: 500;
            color: #096aff;
            background: #e8effa;
            padding: 2px 12px;
            border-radius: 12px;
            line-height: 20px;
            border: 1px solid #196dff;
        }

        .timeline-card .info-row {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-size: 14px;
            color: #1f2a3a;
        }

        .timeline-card .info-row .label {
            color: #666666;
            font-weight: 400;
            width: 70px;
            flex-shrink: 0;
        }

        .timeline-card .info-row .value {
            color: #333333;
            font-weight: 500;
            flex: 1;
            text-align: left;
        }

        .timeline-card .info-row .icon {
            width: 14px;
            height: 14px;
            margin-right: 6px;
        }

        .timeline-card .divider {
            height: 1px;
            background: #f0f4f8;
            margin: 6px 0;
        }

        /* ============================================================
           底部脚注
           ============================================================ */
        .footer-note {
            text-align: center;
            padding-top: 8px;
            font-size: 12px;
            color: #aab8c7;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 375px) {
            .page {
                width: 100%;
            }
            .text_3 {
  flex: 1;
  overflow-wrap: break-word;
  color: rgba(51, 51, 51, 1);
  font-size: 16px;
  font-family: PingFangSC-Medium;
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
  line-height: 22px;
  margin: 4px 0 0 34px;
}
            .image_2 {
  width: 78px;
  height: 30px;
  flex-shrink: 0;
}
            .timeline-marker {
                width: 50px;
            }
            .timeline-marker .date {
                font-size: 11px;
            }
            .timeline-card {
                padding: 10px 12px 14px 12px;
            }
        }
    </style>
</head>
