<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择对比报告</title>
    <script src="./flexible.js"></script>
    <link rel="stylesheet" type="text/css" href="./common.css" />
    <link rel="stylesheet" type="text/css" href="./index.css" />
    <style>
      /* ===== 选择对比报告页样式（沿用项目原UI风格） ===== */

      /* --- 搜索栏 --- */
      .search-bar {
        background-color: rgba(255, 255, 255, 1);
        padding: 11px 16px;
      }
      .search-input-wrap {
        display: flex;
        align-items: center;
        background-color: rgba(243, 245, 247, 1);
        border-radius: 8px;
        height: 36px;
        padding: 0 12px;
      }
      .search-input-wrap input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 14px;
        color: rgba(51, 51, 51, 1);
        font-family: PingFangSC-Regular;
        line-height: 20px;
      }
      .search-input-wrap input::placeholder {
        color: rgba(153, 153, 153, 1);
      }
      .search-input-icon {
        width: 14px;
        height: 14px;
        margin-right: 8px;
        flex-shrink: 0;
      }

      /* --- 当前报告提示条 --- */
      .current-banner {
        margin: 10px 16px 0 16px;
        background-color: rgba(234, 245, 255, 1);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .current-banner-tag {
        font-size: 12px;
        color: rgba(9, 106, 255, 1);
        background-color: rgba(255, 255, 255, 1);
        padding: 2px 8px;
        border-radius: 4px;
        font-family: PingFangSC-Medium;
        font-weight: 500;
        flex-shrink: 0;
        line-height: 16px;
        margin-top: 1px;
      }
      .current-banner-text {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: rgba(51, 51, 51, 1);
        font-family: PingFangSC-Regular;
        line-height: 20px;
        margin-left: 8px;
        word-break: break-all;
        white-space: normal;
      }

      /* --- 分组标题 --- */
      .section-label {
        font-size: 14px;
        color: rgba(102, 102, 102, 1);
        font-family: PingFangSC-Regular;
        line-height: 20px;
        margin: 16px 16px 8px 16px;
      }

      /* --- 报告列表卡片（白底 8px 圆角） --- */
      .report-list-card {
        background-color: rgba(255, 255, 255, 1);
        border-radius: 8px;
        margin: 0 16px;
        overflow: hidden;
      }
      .report-item {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        cursor: pointer;
      }
      .report-item:active { background-color: rgba(243, 245, 247, 1); }
      .report-item + .report-item {
        border-top: 1px solid rgba(245, 245, 245, 1);
      }
      .report-item-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background-color: rgba(9, 106, 255, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 22px;
        line-height: 1;
        color: rgba(255, 255, 255, 1);
      }
      .report-item-icon svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .report-item-info {
        flex: 1;
        min-width: 0;
        margin-left: 12px;
      }
      .report-item-name {
        font-size: 16px;
        color: rgba(51, 51, 51, 1);
        font-family: PingFangSC-Medium;
        font-weight: 500;
        line-height: 22px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .report-item-meta {
        display: flex;
        align-items: center;
        margin-top: 4px;
      }
      .report-item-meta-text {
        font-size: 12px;
        color: rgba(153, 153, 153, 1);
        font-family: PingFangSC-Regular;
        line-height: 17px;
      }
      .report-item-meta-dot {
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(153, 153, 153, 1);
        margin: 0 6px;
        flex-shrink: 0;
      }
      .report-item-arrow {
        font-size: 16px;
        color: rgba(201, 201, 201, 1);
        flex-shrink: 0;
        margin-left: 8px;
        line-height: 1;
      }

      .bottom-spacer { height: 24px; }
    </style>
  </head>
  <body>
    <div class="page flex-col">
      <!-- 状态栏 + 标题栏 -->
      <div class="section_1 flex-col">
        <div class="group_1 flex-row">
          <span class="text_1">10:19</span>
          <img
            class="thumbnail_1"
            referrerpolicy="no-referrer"
            src="./img/SketchPng704147f8b978587e16053c0aff2e7a89010fce4b1451e830bc244c0f5237adc5.png"
          />
          <span class="text_2">5G</span>
          <img
            class="image_1"
            referrerpolicy="no-referrer"
            src="./img/SketchPngb44e7965ccfb0dcdb8b19278c26b84b1f1e92d5ae3c4c02730dc831e2478c8ee.png"
          />
        </div>
        <div class="group_2 flex-row">
          <img
            class="label_1"
            referrerpolicy="no-referrer"
            src="./img/SketchPng1f264f6d2d7519387132cd8cedd70f26e20a37499e604d10ad41e07e06c00a98.png"
            onclick="window.location.href='./AI报告分析.html'"
            style="cursor:pointer;"
          />
          <span class="text_3">选择对比报告</span>
        </div>
      </div>

      <!-- 搜索栏 -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg class="search-input-icon" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="5" stroke="rgba(153,153,153,1)" stroke-width="1.5"/>
            <path d="M10 10L13 13" stroke="rgba(153,153,153,1)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" placeholder="搜索报告名称或类型" />
        </div>
      </div>

      <!-- 当前报告提示 -->
      <div class="current-banner">
        <span class="current-banner-tag">当前</span>
        <span class="current-banner-text">肠镜检查报告 · 2024-06-15 · 将与以下历史报告对比</span>
      </div>

      <!-- 分组标题 -->
      <div class="section-label">历史检查报告（共4份）</div>

      <!-- 报告列表 -->
      <div class="report-list-card">
        <div class="report-item" onclick="window.location.href='./AI报告分析-对比分析.html'">
          <div class="report-item-icon">
            <svg viewBox="0 0 24 24" fill="rgba(255,255,255,1)">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm-1 2 5 5h-5V4ZM8 13h8v1.5H8V13Zm0 3h8v1.5H8V16Zm0-7h3v1.5H8V9Z"/>
            </svg>
          </div>
          <div class="report-item-info">
            <div class="report-item-name">肠镜检查报告</div>
            <div class="report-item-meta">
              <span class="report-item-meta-text">2023-06-15</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">内蒙古国际蒙医医院</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">肠镜</span>
            </div>
          </div>
          <span class="report-item-arrow">›</span>
        </div>

        <div class="report-item" onclick="window.location.href='./AI报告分析-对比分析.html'">
          <div class="report-item-icon">
            <svg viewBox="0 0 24 24" fill="rgba(255,255,255,1)">
              <path d="M12 2a3 3 0 0 0-3 3v1.17A6 6 0 0 0 5 12c0 2.21.86 4.21 2.26 5.66l-1.7 4.25a.75.75 0 0 0 1.06.92L11 20.5l4.38 2.33a.75.75 0 0 0 1.06-.92l-1.7-4.25A6 6 0 0 0 17 12a6 6 0 0 0-4-5.83V5a3 3 0 0 0-3-3Zm0 1.5a1.5 1.5 0 0 1 1.5 1.5v.76A6 6 0 0 0 9 6a1.5 1.5 0 1 1 3-2.5ZM9 7.5a4.5 4.5 0 1 1-3.05 7.82.75.75 0 0 0-.9.43l-1.32 3.3 2.74-1.46a.75.75 0 0 0 .36-.92A4.5 4.5 0 0 1 9 7.5Z"/>
            </svg>
          </div>
          <div class="report-item-info">
            <div class="report-item-name">腹部彩超（肝、胆、胰、脾）</div>
            <div class="report-item-meta">
              <span class="report-item-meta-text">2023-06-15</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">内蒙古国际蒙医医院</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">B超</span>
            </div>
          </div>
          <span class="report-item-arrow">›</span>
        </div>

        <div class="report-item" onclick="window.location.href='./AI报告分析-对比分析.html'">
          <div class="report-item-icon">
            <svg viewBox="0 0 24 24" fill="rgba(255,255,255,1)">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/>
            </svg>
          </div>
          <div class="report-item-info">
            <div class="report-item-name">心脏彩超</div>
            <div class="report-item-meta">
              <span class="report-item-meta-text">2023-03-08</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">内蒙古国际蒙医医院</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">B超</span>
            </div>
          </div>
          <span class="report-item-arrow">›</span>
        </div>

        <div class="report-item" onclick="window.location.href='./AI报告分析-对比分析.html'">
          <div class="report-item-icon">
            <svg viewBox="0 0 24 24" fill="rgba(255,255,255,1)">
              <path d="M2 12h3l2-6 4 12 3-8 2 4h6v2h-7l-1.5-3-3 8-4-12-1 4H2v-1Z"/>
            </svg>
          </div>
          <div class="report-item-info">
            <div class="report-item-name">心电图</div>
            <div class="report-item-meta">
              <span class="report-item-meta-text">2022-06-10</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">内蒙古国际蒙医医院</span>
              <span class="report-item-meta-dot"></span>
              <span class="report-item-meta-text">心电图</span>
            </div>
          </div>
          <span class="report-item-arrow">›</span>
        </div>
      </div>

      <div class="bottom-spacer"></div>
    </div>
  </body>
</html>
