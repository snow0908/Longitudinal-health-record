  <!-- 首次进入气泡引导 -->
  <div class="ai-guide-bubble" id="aiGuideBubble">
    <div class="bubble-row">
      <div class="bubble-icon-box">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 1.5L11.8 7.2L17.5 9L11.8 10.8L10 16.5L8.2 10.8L2.5 9L8.2 7.2L10 1.5Z"/>
        </svg>
      </div>

        <div class="bubble-text-title">AI智能解读</div>
        <div class="bubble-text-desc">点击此处，AI为您解读报告内容</div>
      </div>
    </div>
    <button class="bubble-btn" id="aiGuideClose">知道了</button>
  </div>

  <script>
    // 列表点击逻辑
    document.querySelector('.list_1').addEventListener('click', function(e) {
      // 引导激活时禁止跳转
      var bubble = document.getElementById('aiGuideBubble');
      if (bubble && bubble.classList.contains('active')) return;
      // 点击 AI智能解读按钮 → 跳转 AI 报告分析页
      if (e.target.closest('.ai-bar')) {
        window.location.href = '../检查报告详情/AI报告分析.html';
        return;
      }
      var item = e.target.closest('[class^="list-items_"]');
      if (item) {
        window.location.href = '../检查报告详情/检查报告详情.html';
      }
    });

    // 首次进入气泡引导
    (function() {
      var GUIDE_KEY = 'ai_guide_report_list';

      function showGuide() {
        var firstCard = document.querySelector('.list-items_1-0');
        var aiBar = firstCard ? firstCard.querySelector('.ai-bar') : null;
        if (!aiBar) return;

        firstCard.classList.add('ai-guide-highlight');
        document.body.style.overflow = 'hidden';

        var bubble = document.getElementById('aiGuideBubble');
        var rect = aiBar.getBoundingClientRect();
        var bw = 230;
        var left = rect.left + rect.width / 2 - bw / 2;
        if (left < 16) left = 16;
        if (left + bw > window.innerWidth - 16)
          left = window.innerWidth - bw - 16;

        bubble.style.left = left + 'px';
        bubble.style.top = (rect.bottom + 14) + 'px';
        bubble.classList.add('active');
      }

      function closeGuide() {
        var bubble = document.getElementById('aiGuideBubble');
        var card = document.querySelector('.list-items_1-0');
        bubble.classList.remove('active');
        if (card) card.classList.remove('ai-guide-highlight');
        document.body.style.overflow = '';
        try { localStorage.setItem(GUIDE_KEY, '1'); } catch(e) {}
      }

      // ?guide=1 强制显示（方便预览调试）
      var forceShow = window.location.search.indexOf('guide=1') > -1;
      var hasSeen = false;
      try { hasSeen = localStorage.getItem(GUIDE_KEY) === '1'; } catch(e) {}

      if (forceShow || !hasSeen) {
        setTimeout(showGuide, 600);
      }

      document.getElementById('aiGuideClose').addEventListener('click', function(e) {
        e.stopPropagation();
        closeGuide();
      });

      // 点击遮罩区域关闭引导
      document.addEventListener('click', function(e) {
        var bubble = document.getElementById('aiGuideBubble');
        if (!bubble.classList.contains('active')) return;
        if (e.target.closest('.ai-guide-bubble')) return;
        closeGuide();
      });
    })();
  </script>
