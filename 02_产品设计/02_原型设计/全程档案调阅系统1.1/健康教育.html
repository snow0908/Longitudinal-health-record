<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>健康教育记录</title>
    <style>
        /* ============================================================
           样式严格参照 lanhu_gaoxueyaguanli2（随访记录）
           对应《C端UED交互与视觉设计规范 v1.0》
           基准宽度：375px
           ============================================================ */

        /* ---------- Reset & Base ---------- */
        * {
            box-sizing: border-box;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: PingFangSC-Regular, Roboto, Helvetica Neue, Helvetica, Tahoma, Arial, PingFang SC-Light, Microsoft YaHei;
            background-color: #F3F5F7;
            -webkit-font-smoothing: antialiased;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
        }
        .flex-row {
            display: flex;
            flex-direction: row;
        }
        .justify-between {
            display: flex;
            justify-content: space-between;
        }
        .align-center {
            display: flex;
            align-items: center;
        }
        .align-start {
            display: flex;
            align-items: flex-start;
        }

        /* ---------- Page ---------- */
        .page {
            background-color: #F3F5F7;
            position: relative;
            width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 16px;
        }

        /* ============================================================
           导航栏（参照 高血压专项 .group_1 / .box_1 / .box_2）
           ============================================================ */
        .group_1 {
            background-color: rgba(255, 255, 255, 1);
            padding: 14px 16px 7px 16px;
        }
        .box_1 {
            margin: 0 10px 0 24px;
        }
        .text_1 {
            overflow-wrap: break-word;
            color: rgba(0, 0, 0, 1);
            font-size: 16px;
            letter-spacing: 1.100000023841858px;
            font-family: PingFangSC-Semibold;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            line-height: 22px;
        }
        .thumbnail_1 {
            width: 19px;
            height: 12px;
            margin: 5px 0 5px 191px;
        }
        .text_2 {
            overflow-wrap: break-word;
            color: rgba(0, 0, 0, 1);
            font-size: 12px;
            letter-spacing: 0.925000011920929px;
            font-family: PingFangSC-Semibold;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            line-height: 17px;
            margin: 3px 0 0 6px;
        }
        .image_1 {
            width: 25px;
            height: 13px;
            margin: 5px 0 4px 6px;
        }
        .box_2 {
            margin-top: 15px;
            display: flex;
            align-items: center;
        }
        .label_1 {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .text_3 {
            flex: 1;
            overflow-wrap: break-word;
            color: rgba(51, 51, 51, 1);
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            line-height: 22px;
            margin: 4px 0 0 34px;
        }
        .image_2 {
            width: 78px;
            height: 30px;
            flex-shrink: 0;
        }

        /* ============================================================
           白色内容卡片（参照 gaoxueyaguanli2 .box_2 / .box_17 / .box_19 等）
           ============================================================ */
        .card {
            background-color: #FFFFFF;
            margin-top: 16px;
            padding: 16px;
        }

        /* ---------- Divider ---------- */
        .divider {
            width: 343px;
            height: 1px;
            background-color: #E5E5E5;
        }
        .divider--mt12 {
            margin-top: 12px;
        }

        /* ============================================================
           患者信息行（参照 gaoxueyaguanli2 .text-wrapper_1）
           ============================================================ */
        .patient-name {
            color: #333333;
            font-size: 14px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
            line-height: 20px;
        }
        .patient-meta {
            color: #666666;
            font-size: 14px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            text-align: left;
            white-space: nowrap;
            line-height: 20px;
            margin-left: auto;
        }

        /* ============================================================
           信息行：左侧固定 136px（标签） + 右侧自适应（值）
           ============================================================ */
        .info-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin: 8px 0 0 0;
        }
        .info-label {
            width: 136px;
            flex-shrink: 0;
            color: #333333;
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
            line-height: 22px;
        }
        .info-value {
            flex: 1;
            color: #666666;
            font-size: 16px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            text-align: left;
            line-height: 22px;
            word-break: break-word;
        }
        .info-value--placeholder {
            color: #999999;
        }

        /* ============================================================
           分区标题（参照 gaoxueyaguanli2 .text_42 / .text_20 / .text_22 等）
           ============================================================ */
        .section-title {
            color: #333333;
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
            line-height: 22px;
        }

        /* ---------- 文本内容（参照 gaoxueyaguanli2 .text-wrapper_7） ---------- */
        .text-content {
            color: #666666;
            font-size: 14px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            text-align: left;
            line-height: 20px;
            margin-top: 12px;
            word-break: break-word;
        }
        .text-content--placeholder {
            color: #999999;
        }

        /* ============================================================
           底部脚注
           ============================================================ */
        .footer-note {
            padding: 16px 16px 0 16px;
            text-align: center;
            font-size: 12px;
            color: #999999;
            font-family: PingFangSC-Regular;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="page flex-col">

        <!-- ==================== 导航栏（参照 高血压专项） ==================== -->
        <div class="group_1 flex-col">
            <div class="box_1 flex-row">
                <span class="text_1">10:19</span>
                <img class="thumbnail_1" referrerpolicy="no-referrer" src="./img/信号.png" />
                <span class="text_2">5G</span>
                <img class="image_1" referrerpolicy="no-referrer" src="./img/电量.png" />
            </div>
            <div class="box_2 flex-row">
                <img class="label_1" referrerpolicy="no-referrer" src="./img/返回.png" />
                <span class="text_3">健康教育记录</span>
                <img class="image_2" referrerpolicy="no-referrer" src="./img/设置.png" />
            </div>
        </div>

        <!-- ==================== 卡片1：患者信息 ==================== -->
        <div class="card flex-col">
            <div class="flex-row">
                <span class="patient-name">姓名：周*风</span>
                <span class="patient-meta">编号：0010024654510</span>
            </div>
            <div class="divider divider--mt12"></div>

            <div class="info-row">
                <span class="info-label">日期</span>
                <span class="info-value">1985-05-15</span>
            </div>
            <div class="info-row">
                <span class="info-label">干预方式</span>
                <span class="info-value">发放宣传折页</span>
            </div>
            <div class="info-row">
                <span class="info-label">干预地点</span>
                <span class="info-value">家庭</span>
            </div>
            <div class="info-row">
                <span class="info-label">干预医生</span>
                <span class="info-value">刘玉玉</span>
            </div>
            <div class="info-row">
                <span class="info-label">所在机构</span>
                <span class="info-value">北京市第一医院发热门诊</span>
            </div>
        </div>

        <!-- ==================== 卡片2：健康教育处方 ==================== -->
        <div class="card flex-col">
            <span class="section-title">健康教育处方</span>
            <div class="text-content">
                健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方健康教育处方
            </div>
        </div>

        <!-- ==================== 卡片3：健康指导意见 ==================== -->
        <div class="card flex-col">
            <span class="section-title">健康指导意见</span>
            <div class="text-content">
                指导意见
            </div>
        </div>

        <!-- ==================== 卡片4：备注 ==================== -->
        <div class="card flex-col">
            <span class="section-title">备注</span>
            <div class="text-content text-content--placeholder">
                无
            </div>
        </div>

        <!-- ==================== 底部脚注 ==================== -->
        <div class="footer-note">
            编号 0010024654510 · 更新于 1985-05-15
        </div>

    </div>

<script>
  document.querySelector('.label_1').addEventListener('click', function() {
    window.location.href = './健康教育列表.html';
  });
</script>

</body>
</html>
