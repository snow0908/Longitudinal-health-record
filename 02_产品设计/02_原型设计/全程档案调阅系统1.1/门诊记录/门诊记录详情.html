<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>病案首页 · 详情</title>
    <style>
        /* ============================================================
           病案首页详情 - 参照慢阻肺专项界面风格
           蓝色医疗主题（主题色 #2378F5）
           基准宽度：375px
           ============================================================ */

        /* ---------- 全局重置 ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: PingFangSC-Regular, Roboto, Helvetica Neue, Helvetica,
                Tahoma, Arial, PingFang SC-Light, Microsoft YaHei;
            background-color: #F3F5F7;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        /* ---------- Flex 工具类 ---------- */
        .flex-col { display: flex; flex-direction: column; }
        .flex-row { display: flex; flex-direction: row; }
        .justify-between { display: flex; justify-content: space-between; }
        .align-center { display: flex; align-items: center; }
        .align-start { display: flex; align-items: flex-start; }

        /* ---------- 页面容器 ---------- */
        .page {
            background-color: #F3F5F7;
            position: relative;
            width: 375px;
            min-height: 100vh;
            padding-bottom: 24px;
        }

        /* ============================================================
           导航栏
           ============================================================ */
        .group_1 { background-color: rgba(255, 255, 255, 1); padding: 14px 16px 7px 16px; }
        .box_1 { margin: 0 10px 0 24px; }
        .text_1 {
            overflow-wrap: break-word; color: rgba(0, 0, 0, 1); font-size: 16px;
            letter-spacing: 1.100000023841858px; font-family: PingFangSC-Semibold; font-weight: 600;
            text-align: center; white-space: nowrap; line-height: 22px;
        }
        .thumbnail_1 { width: 19px; height: 12px; margin: 5px 0 5px 191px; }
        .text_2 {
            overflow-wrap: break-word; color: rgba(0, 0, 0, 1); font-size: 12px;
            letter-spacing: 0.925000011920929px; font-family: PingFangSC-Semibold; font-weight: 600;
            text-align: center; white-space: nowrap; line-height: 17px; margin: 3px 0 0 6px;
        }
        .image_1 { width: 25px; height: 13px; margin: 5px 0 4px 6px; }

        .box_2 { margin-top: 15px; display: flex; align-items: center; }
        .label_1 { width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; }
        .text_3 {
            flex: 1; overflow-wrap: break-word; color: rgba(51, 51, 51, 1); font-size: 16px;
            font-family: PingFangSC-Medium; font-weight: 500; text-align: center;
            white-space: nowrap; line-height: 22px; margin: 4px 0 0 34px;
        }
        .image_2 { width: 78px; height: 30px; flex-shrink: 0; }

        /* ---------- 导航栏右上角 设置按钮 ---------- */
        .nav-right {
            height: 30px;
            display: flex; align-items: center; justify-content: flex-end;
            flex-shrink: 0;
        }
        .nav-setting {
            height: auto; width: auto; flex-shrink: 0; cursor: pointer;
        }
        .nav-setting:active { opacity: 0.75; }

        /* ============================================================
           卡片样式
           ============================================================ */
        .card {
            background-color: #FFFFFF; border-radius: 8px;
            border: 1px solid #E5E5E5; padding: 16px; margin: 16px 16px 0 16px; width: calc(100% - 32px);
        }
        /* 摘要卡片：375px 满宽、紧挨顶部，去掉外层 border，不再作为独立留白浮卡 */
        .hero-card {
            margin: 0; width: 375px;
            border: none; border-radius: 0px; padding: 0;
        }

        .section-title {
            font-size: 16px; font-weight: 500; font-family: PingFangSC-Medium;
            color: #333333; line-height: 22px; margin-bottom: 12px;
        }

        /* ---------- 高亮卡片（摘要卡片，按状态变主题色） ---------- */
        .card-highlight {
            border-radius: 0; padding: 16px; margin: 8px 16px 8px 16px;
            border: 1px solid transparent;
            background-color: #FFFFFF;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        /* 摘要卡片顶部：患者姓名 + 性别 */
        .hero-patient { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
        .hero-name {
            font-size: 18px; font-weight: 600; font-family: PingFangSC-Medium;
            color: #1A1A1A; line-height: 25px;
        }
        .hero-gender {
            font-size: 13px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #999999; line-height: 18px;
        }
        .card-highlight--pending {
            background-color: #FFFDF9;
            border-radius: 8px;
            border-color: #FEA800;
        }
        .card-highlight--pending .hd-state-tag {
            background-color: #FFF7ED; color: #B97A00; border-color: #FEA800;
        }
        .card-highlight--cancel {
            border-color: #CCCCCC;
        }
        .card-highlight--cancel .hd-state-tag {
            background-color: #FFFFFF; color: #999999; border-color: #CCCCCC;
        }
        .card-highlight--success {
            border-color: #18CF8E;
        }
        .card-highlight--success .hd-state-tag {
            background-color: #E6FBF0; color: #0FA670; border-color: #18CF8E;
        }
        .card-highlight--danger {
            border-color: #F32929;
        }
        .card-highlight--danger .hd-state-tag {
            background-color: #FFECEC; color: #C82020; border-color: #F32929;
        }

        /* ---------- 标签组件 ---------- */
        .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag {
            display: inline-flex; align-items: center; border-radius: 4px;
            padding: 3px 8px; font-size: 12px; font-weight: 400;
            font-family: PingFangSC-Regular; line-height: 17px; white-space: nowrap;
        }
        .tag--warning {
            background-color: #FFF7ED; color: #FEA800; border: 1px solid #FEA800;
        }
        .tag--danger {
            background-color: #FFF4F4; color: #F32929; border: 1px solid #F32929;
        }
        .tag--info {
            background-color: #E8F1FE; color: #2378F5; border: 1px solid #2378F5;
        }
        .tag--success {
            background-color: #E6FBF0; color: #18CF8E; border: 1px solid #18CF8E;
        }
        .tag--cancel {
            background-color: #F5F5F5; color: #999999; border: 1px solid #CCCCCC;
        }

        /* ---------- 列表项 ---------- */
        .list-item { display: flex; align-items: flex-start; padding: 4px 0; }
        .list-dot {
            width: 4px; height: 4px; border-radius: 50%; margin-top: 8px;
            flex-shrink: 0; background-color: #2378F5;
        }
        .list-text {
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #666666; line-height: 20px; margin-left: 8px; word-break: break-all;
        }
        .list-text .label { color: #333333; font-weight: 400; }
        .list-text .val-yes { color: #F32929; margin-left: 8px; font-weight: 400; }
        .list-text .val-no { color: #999999; margin-left: 8px; font-weight: 400; }

        /* ============================================================
           简洁列表样式（信息卡片）
           ============================================================ */
        .simple-card-title {
            font-size: 16px; font-weight: 500; font-family: PingFangSC-Medium;
            color: #333333; line-height: 22px; padding-bottom: 12px;
            border-bottom: 1px solid #E5E5E5; margin-bottom: 0;
        }
        .simple-row { display: flex; align-items: baseline; padding: 10px 0; cursor: default; }
        .simple-row.clickable { cursor: pointer; }
        .simple-row.clickable:active { background-color: #F8FAFC; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
        .simple-label {
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #666666; line-height: 20px; min-width: 88px; flex-shrink: 0;
        }
        .simple-value {
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #333333; line-height: 20px; flex: 1; text-align: left; word-break: break-all;
        }
        .simple-value.long {
            white-space: pre-wrap; line-height: 22px; color: #333333;
        }
        .simple-value.empty { color: #CCCCCC; }
        .simple-arrow { color: #CCCCCC; font-size: 16px; margin-left: 6px; flex-shrink: 0; }

        /* ============================================================
           主诉/病史长文本样式
           ============================================================ */
        .text-block { margin-top: 12px; }
        .text-block-title {
            font-size: 14px; font-weight: 500; font-family: PingFangSC-Medium;
            color: #333333; line-height: 20px; margin-bottom: 6px;
        }
        .text-block-content {
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #666666; line-height: 22px; word-break: break-all;
            margin-top: 12px;
        }

        /* ============================================================
           Tab 切换样式（pill 胶囊式）
           ============================================================ */
        .tab-bar {
            display: flex; gap: 7px;
            margin: 16px 16px 0 16px;
            background: transparent; border: none;
        }
        .tab-item {
            flex: 1; height: 30px; line-height: 30px;
            text-align: center; padding: 0;
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #666666; cursor: pointer; position: relative;
            background-color: transparent; transition: all 0.2s ease;
            border: none; outline: none;
            border-radius: 15px;
        }
        .tab-item.active {
            color: #FFFFFF; font-weight: 500; font-family: PingFangSC-Medium;
            background-color: #2378F5;
            box-shadow: 0 4px 12px rgba(35, 120, 245, 0.25);
        }
        .tab-item + .tab-item { border-left: none; }
        .tab-item:active:not(.active) { background-color: #F4F6F8; }
        /* tab 嵌入摘要卡片底部时的间距（与摘要卡片等宽，无外层 border） */
        .tab-bar.in-hero {
            margin: 8px 16px 8px 16px;
            padding: 0; border: none;
        }

        /* ============================================================
           诊断 / 手术卡片样式（合并到就诊信息内）
           ============================================================ */
        /* ============================================================
           扁平条目卡（诊断 / 手术 通用）
           不再卡片套卡片：页面级圆角卡 + 极浅边框 + 主条目强调
           ============================================================ */
        /* 子条目：无独立边框，分隔线区分（与用药 .meds-item 一致） */
        .info-item {
            padding: 14px 16px; position: relative;
            transition: background-color 0.15s ease;
        }
        .info-item:active { background-color: #F8FAFC; }
        .info-item + .info-item { border-top: 1px solid #F0F2F5; }
        /* 手术卡片：条目直接置于 .card 内平铺，与用药 .meds-item 一致 */
        .card > .info-item { padding: 14px 0; }
        .card > .info-item:active { background-color: #F8FAFC; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
        .info-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .info-item-name {
            font-size: 15px; font-weight: 600; font-family: PingFangSC-Medium;
            color: #1A1A1A; line-height: 21px; flex: 1;
        }
        /* 状态胶囊：右上角，视觉同用药用法胶囊 */
        .info-item-badge {
            font-size: 12px; font-weight: 500; font-family: PingFangSC-Medium;
            line-height: 18px; flex-shrink: 0; padding: 2px 8px; border-radius: 6px;
            margin-top: 1px;
        }
        .info-item-badge.primary { color: #2378F5; background: #EAF2FF; }
        .info-item-badge.tcm { color: #C8841B; background: #FBF3E2; }
        .info-item-badge.other { color: #8A92A0; background: #F2F4F7; }
        .info-item-detail {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
        }

        /* ============================================================
           报告列表卡片（检查报告 / 检验报告）
           样式参照移动端慢病专项的报告列表样式
           ============================================================ */
        .report-list { margin: 16px 16px 0 16px; }
        .report-card {
            background-color: #FFFFFF; border-radius: 8px;
            border: 1px solid #E5E5E5; padding: 16px;
            margin-bottom: 12px; cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .report-card:last-child { margin-bottom: 0; }
        .report-card:active { background-color: #F8FAFC; }
        .report-card-name {
            font-size: 16px; font-weight: 500; font-family: PingFangSC-Medium;
            color: #333333; line-height: 22px;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; word-break: break-all;
        }
        .report-card-time {
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #666666; line-height: 20px; margin-top: 8px;
        }
        .report-card-hospital {
            display: flex; align-items: center;
            font-size: 14px; font-weight: 400; font-family: PingFangSC-Regular;
            color: #999999; line-height: 20px; margin-top: 8px;
        }
        .report-card-hospital .hosp-icon {
            display: inline-block; width: 14px; height: 14px;
            margin-right: 4px; background-color: #C1C5CC; border-radius: 2px;
            -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M8 1.5 1.5 4v11h5v-5h3v5h5V4z'/></svg>") center/contain no-repeat;
                    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M8 1.5 1.5 4v11h5v-5h3v5h5V4z'/></svg>") center/contain no-repeat;
            flex-shrink: 0;
        }

        /* ============================================================
           用药信息卡片（就诊信息 tab 内）
           父卡片内包含多个药品子条目
           ============================================================ */
        /* ============================================================
           用药信息（所有药品合并在一个扁平父卡内）
           父卡：用药信息合并在 .card 内，标题用 .simple-card-title，内部药品用分隔线区分
           ============================================================ */
        .meds-item {
            padding: 14px 0; cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .meds-item:active { background-color: #F8FAFC; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
        .meds-item + .meds-item { border-top: 1px solid #F0F2F5; }
        .meds-item-head {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
            margin-bottom: 12px;
        }
        .meds-item-name {
            font-size: 15px; font-weight: 600; font-family: PingFangSC-Medium;
            color: #1A1A1A; line-height: 21px; flex: 1;
        }
        .meds-item-usage {
            font-size: 12px; font-weight: 500; font-family: PingFangSC-Medium;
            color: #18A058; line-height: 18px; flex-shrink: 0;
            background: #EAF7F0; padding: 2px 8px; border-radius: 6px;
        }
        .meds-divider {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
        }
        .meds-field .field-k { font-size: 14px; color: #999999; line-height: 20px; }
        .meds-field .field-k .v {
            font-size: 14px; color: #333333; margin-left: 4px; font-weight: 400;
        }
        .meds-field.full { grid-column: 1 / -1; }

        /* ---------- 空状态 ---------- */
        .empty-state { text-align: center; padding: 48px 16px; color: #CCCCCC; }
        .empty-state .empty-icon { font-size: 44px; margin-bottom: 8px; opacity: 0.7; }
        .empty-state .empty-text { font-size: 14px; color: #999999; }

        /* ---------- 底部脚注 ---------- */
        .divider { width: 100%; height: 1px; background-color: #E5E5E5; margin: 8px 0; }

        .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .card-header-icon { width: 20px; height: 20px; flex-shrink: 0; }
        .card-header-title {
            font-size: 16px; font-weight: 500; font-family: PingFangSC-Medium;
            color: #333333; line-height: 22px;
        }

        .footer-note {
            padding: 16px 16px 0 16px; text-align: center; font-size: 12px;
            color: #999999; font-weight: 400; font-family: PingFangSC-Regular; line-height: 17px;
        }

        /* ---------- 提示条 ---------- */
        .alert-bar {
            margin: 12px 16px 0 16px; padding: 10px 12px;
            background-color: #FFF8E5; border: 1px solid #FFE0A6; border-radius: 8px;
            font-size: 12px; color: #8A6A2C; line-height: 18px;
            display: flex; gap: 8px; align-items: flex-start;
        }
        .alert-bar::before { content: "ⓘ"; color: #FEA800; font-size: 14px; flex-shrink: 0; line-height: 18px; }

        /* ============================================================
           响应式适配
           ============================================================ */
        @media (max-width: 375px) { .page { width: 100%; } }
        @media (max-width: 340px) {
            .simple-label { min-width: 64px; }
        }
    </style>
</head>
<body>

    <div class="page flex-col">

        <!-- ==================== 导航栏 ==================== -->
        <div class="group_1 flex-col">
            <div class="box_1 flex-row">
                <span class="text_1">10:19</span>
                <img class="thumbnail_1" referrerpolicy="no-referrer" src="../img/信号.png" />
                <span class="text_2">5G</span>
                <img class="image_1" referrerpolicy="no-referrer" src="../img/电量.png" />
            </div>
            <div class="box_2 flex-row">
                <img class="label_1" referrerpolicy="no-referrer" src="../img/返回.png" id="btnBack" />
                <span class="text_3" id="detailTitle">门诊记录</span>
                <div class="nav-right">
                    <img class="nav-setting" referrerpolicy="no-referrer" src="../img/设置.png" id="btnCircle" role="button" tabindex="0" aria-label="设置" />
                </div>
            </div>
        </div>

        <!-- ============================================================
           摘要卡片（Hero）—— 紧挨顶部，胶囊 Tab 置于卡片底部
           ============================================================ -->
        <div class="card hero-card" id="heroCard">
            <div class="card-highlight" id="heroHighlight">
                <!-- 患者姓名 + 性别 -->
                <div class="hero-patient">
                    <span class="hero-name" id="hdName">—</span>
                    <span class="hero-gender" id="hdGender">—</span>
                </div>

                <!-- 诊断名称 + 状态标签 -->
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                    <span style="font-size:18px; font-weight:500; font-family:PingFangSC-Medium; color:#333333; line-height:25px;" id="hdDiag">—</span>
                    <span class="tag hd-state-tag" id="hdStatus">—</span>
                </div>

                <!-- 机构 & 科室 -->
                <div style="font-size:14px; font-weight:400; font-family:PingFangSC-Regular; color:#666666; line-height:20px;">
                    <span id="hdHosp">—</span>
                    <span style="color:#CCCCCC; margin:0 4px;">›</span>
                    <span id="hdDept">—</span>
                </div>

                <!-- 就诊时间 -->
                <div style="margin-top:12px; padding-top:12px; border-top:1px dashed #E5E5E5; font-size:14px; font-weight:400; font-family:PingFangSC-Regular; color:#999999; line-height:20px;">
                    <span>就诊时间：</span>
                    <span style="color:#333333;" id="hdTime">—</span>
                </div>

                <!-- 费用信息 -->
                <div style="margin-top:8px; display:flex; align-items:baseline; font-size:14px; line-height:20px;">
                    <span style="font-weight:400; font-family:PingFangSC-Regular; color:#666666;">总费用：</span>
                    <span style="font-weight:500; font-family:PingFangSC-Medium; color:#F32929;" id="hdTotalFee">—</span>
                    <span style="font-weight:400; font-family:PingFangSC-Regular; color:#999999; margin-left:8px;" id="hdSelfFee">—</span>
                </div>
            </div>

            <!-- Tab 切换栏（胶囊式，位于摘要卡片底部） -->
            <div class="tab-bar in-hero" id="tabBar" role="tablist" aria-label="病案信息分类">
                <button class="tab-item active" role="tab" id="tab-basic" aria-selected="true" aria-controls="paneBasic" data-tab="basic">就诊信息</button>
                <button class="tab-item" role="tab" id="tab-exam" aria-selected="false" aria-controls="paneExam" data-tab="exam">检查报告</button>
                <button class="tab-item" role="tab" id="tab-lab" aria-selected="false" aria-controls="paneLab" data-tab="lab">检验报告</button>
            </div>
        </div>

        <!-- ============================================================
           Tab 内容面板
           ============================================================ -->
        <div id="paneBasic" class="pane-content" data-pane="basic"></div>
        <div id="paneExam" class="pane-content" data-pane="exam" style="display:none;"></div>
        <div id="paneLab" class="pane-content" data-pane="lab" style="display:none;"></div>

    </div>

    <script>
        /* ============================================================
           数据定义
           ============================================================ */
        const RECORDS = [
            {
                id:1, status:'pending', statusText:'待就诊', statusTag:'warning', name:'张自强', gender:'男',
                diag:'急性肠胃炎', hospital:'内蒙古国际蒙医医院', dept:'消化内科',
                date:'2023-11-23', time:'09:30', type:'门诊', payment:'城镇职工医保', totalFee:'486.50', selfFee:'138.00',
                diags:[
                    { type:'wm', typeName:'西医诊断', primary:true, name:'急性肠胃炎', code:'K52.905', doctor:'王立军', time:'2023-11-23 09:42' },
                    { type:'wm', typeName:'西医诊断', primary:false, name:'轻度脱水', code:'E86.902', doctor:'王立军', time:'2023-11-23 09:42' },
                    { type:'tcm', typeName:'中医诊断', primary:false, name:'泄泻（暴泻）', code:'BNV050', synd:'寒湿内盛证', doctor:'王立军', time:'2023-11-23 09:50' }

        /* ============================================================
           全局状态
           ============================================================ */
        let currentIdx = 0, currentTab = 'basic';

        function getRecordById(){
            const params = new URLSearchParams(location.search);
            const id = parseInt(params.get('id'), 10);
            const idx = RECORDS.findIndex(r => r.id === id);
            return idx >= 0 ? idx : 0;
        }

        /* ============================================================
           初始化
           ============================================================ */
        function initDetail(){
            currentIdx = getRecordById();
            const r = RECORDS[currentIdx];

            // 导航标题
            document.getElementById('detailTitle').textContent = r.type + '记录';

            // 摘要卡片：按状态切换主题
            var heroEl = document.getElementById('heroHighlight');
            heroEl.className = 'card-highlight card-highlight--' + (r.status || 'pending');

            document.getElementById('hdDiag').textContent = r.diag;
            document.getElementById('hdStatus').textContent = r.statusText || '—';
            document.getElementById('hdName').textContent = r.name || '—';
            document.getElementById('hdGender').textContent = r.gender ? ('· ' + r.gender) : '';
            document.getElementById('hdHosp').textContent = r.hospital;
            document.getElementById('hdDept').textContent = r.dept;
            document.getElementById('hdTime').textContent = r.date + ' ' + r.time;
            document.getElementById('hdTotalFee').textContent = '¥' + (r.totalFee || '—');
            document.getElementById('hdSelfFee').textContent = '（自费 ¥' + (r.selfFee || '—') + '）';

            switchTab('basic');
        }

        /* ============================================================
           Tab 切换
           ============================================================ */
        document.querySelectorAll('.tab-item').forEach(function(t){
            t.addEventListener('click', function(){ switchTab(t.dataset.tab); });
            t.addEventListener('keydown', function(e){
                if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
                    e.preventDefault();
                    var tabs = [].slice.call(document.querySelectorAll('.tab-item'));
                    var idx = tabs.indexOf(t);
                    var next = e.key==='ArrowRight' ? (idx+1)%tabs.length : (idx-1+tabs.length)%tabs.length;
                    tabs[next].focus();
                    switchTab(tabs[next].dataset.tab);
                }
            });
        });

        function switchTab(name){
            currentTab = name;
            document.querySelectorAll('.tab-item').forEach(function(t){
                var on = t.dataset.tab === name;
                t.classList.toggle('active', on);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
                t.tabIndex = on ? 0 : -1;
            });
            document.querySelectorAll('.pane-content').forEach(function(p){
                var on = p.dataset.pane === name;
                p.style.display = on ? 'block' : 'none';
            });
            renderPane();
        }

        function renderPane(){
            if(currentTab==='basic') document.getElementById('paneBasic').innerHTML = renderBasicPane();
            else if(currentTab==='exam') document.getElementById('paneExam').innerHTML = renderReportPane('exam');
            else if(currentTab==='lab') document.getElementById('paneLab').innerHTML = renderReportPane('lab');
        }

        /* ============================================================
           就诊信息面板（基础信息 + 诊断 + 手术，全部合并展示）
           ============================================================ */
        function renderBasicGroup(g){
            // 纯文本卡片（如主诉、现病史等）—— 一个卡片只展示一段文本
            if(g.textOnly){
                var content = (g.rows[0] && g.rows[0].v) || '—';
                return '<div class="card">' +
                    '<div class="simple-card-title" style="border-bottom:none; padding-bottom:0; margin-bottom:12px;">' + g.name + '</div>' +
                    '<div class="text-block-content" style="margin-top:0;">' + content + '</div>' +
                    '</div>';
            }

            var rowsHtml = g.rows.map(function(r){
                var isEmpty = !r.v || r.v === '—';
                var vCls = 'simple-value';
                if(isEmpty) vCls += ' empty';
                if(r.long) vCls += ' long';
                var rowCls = r.clickable ? 'simple-row clickable' : 'simple-row';
                var onClick = r.clickable ? ' onclick="showToast(\'查看：' + r.k + '\')"' : '';
                var val = r.v || '—';
                return '<div class="' + rowCls + '"' + onClick + '>' +
                    '<span class="simple-label">' + r.k + '</span>' +
                    '<span class="' + vCls + '">' + val + '</span>' +
                    '</div>';
            }).join('');

            return '<div class="card">' +
                '<div class="simple-card-title">' + g.name + '</div>' +
                rowsHtml +
                '</div>';
        }

        function renderDiagCards(r){
            if(!r.diags || !r.diags.length) return '';
            return r.diags.map(function(d, idx){
                var cardCls = 'info-item';

                var badge = d.primary
                    ? '<div class="info-item-badge primary">主诊断</div>'
                    : (d.type==='tcm' ? '<div class="info-item-badge tcm">中医</div>'
                                       : '<div class="info-item-badge other">其他</div>');

                var syndRow = d.synd
                    ? '<div class="meds-field full"><span class="field-k">中医证候<span class="v">' + d.synd + '</span></span></div>'
                    : '';

                return '<div class="' + cardCls + '">' +
                    '<div class="info-item-head">' +
                        '<div class="info-item-name">' + d.name + '</div>' +
                        badge +
                    '</div>' +
                    '<div class="info-item-detail">' +
                        '<div class="meds-field"><span class="field-k">诊断类型<span class="v">' + d.typeName + '</span></span></div>' +
                        '<div class="meds-field"><span class="field-k">疾病编码<span class="v">' + d.code + '</span></span></div>' +
                        '<div class="meds-field"><span class="field-k">诊断医师<span class="v">' + d.doctor + '</span></span></div>' +
                        '<div class="meds-field"><span class="field-k">诊断时间<span class="v">' + d.time + '</span></span></div>' +
                        syndRow +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        function renderOpCards(r){
            if(!r.ops || !r.ops.length) return '';
            return r.ops.map(function(o){
                var badge = o.primary
                    ? '<div class="info-item-badge primary">主手术</div>'
                    : '<div class="info-item-badge other">副手术</div>';

                function cell(k, v){
                    return '<div class="meds-field"><span class="field-k">' + k + '<span class="v">' + (v || '—') + '</span></span></div>';
                }

                return '<div class="info-item">' +
                    '<div class="info-item-head">' +
                        '<div class="info-item-name">' + o.name + '</div>' +
                        badge +
                    '</div>' +
                    '<div class="info-item-detail">' +
                        cell('手术编码', o.code) +
                        cell('编码体系', o.codeSystem) +
                        cell('手术医师', o.doctor) +
                        cell('麻醉方式', o.anes) +
                        cell('麻醉医师', o.anesDoctor) +
                        cell('手术级别', o.level) +
                        cell('手术时长', o.duration) +
                        cell('切口类别', o.incision) +
                        cell('愈合等级', o.healing) +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        function renderBasicPane(){
            var r = RECORDS[currentIdx];
            var groupsHtml = BASIC_GROUPS.map(renderBasicGroup).join('');

            var diagSection = '';
            if(r.diags && r.diags.length){
                diagSection = '<div class="card">' +
                    '<div class="simple-card-title">诊断信息</div>' +
                    renderDiagCards(r) +
                    '</div>';
            }

            var opSection = '';
            if(r.ops && r.ops.length){
                opSection = '<div class="card">' +
                    '<div class="simple-card-title">手术信息</div>' +
                    renderOpCards(r) +
                    '</div>';
            }

            var medsSection = renderMedsSection(r);

            var feeSection = renderFeeSection(r);

            var alertHtml = '<div class="alert-bar">就诊信息来源于医疗机构归档，标准仅供参考。如有出入，请联系原就诊机构核实。</div>';

            return groupsHtml + diagSection + medsSection + opSection + feeSection + alertHtml;
        }

        /* ============================================================
           用药信息（就诊信息 tab 内）—— 父卡片包裹所有药品
           ============================================================ */
        function renderMedsSection(r){
            if(!r.meds || !r.meds.length) return '';

            var itemsHtml = r.meds.map(function(m){
                return '<div class="meds-item" onclick="showToast(\'查看用药：' + m.name + '\')">' +
                    '<div class="meds-item-head">' +
                        '<div class="meds-item-name">' + m.name + '</div>' +
                        '<div class="meds-item-usage">' + m.usage + '</div>' +
                    '</div>' +
                    '<div class="meds-divider">' +
                        '<div class="meds-field"><span class="field-k">单次剂量<span class="v">' + m.singleDose + '</span></span></div>' +
                        '<div class="meds-field"><span class="field-k">用药频率<span class="v">' + m.frequency + '</span></span></div>' +
                        '<div class="meds-field"><span class="field-k">用药天数<span class="v">' + m.days + '</span></span></div>' +
                        '<div class="meds-field"><span class="field-k">总剂量<span class="v">' + m.totalDose + '</span></span></div>' +
                        '<div class="meds-field full"><span class="field-k">药物剂型<span class="v">' + m.dosageForm + '</span></span></div>' +
                    '</div>' +
                    '</div>';
            }).join('');

            return '<div class="card">' +
                '<div class="simple-card-title">用药信息</div>' +
                itemsHtml +
                '</div>';
        }

        /* ============================================================
           费用信息（就诊信息 tab 内）—— 置于最后，按当前记录计算
           ============================================================ */
        function fmtMoney(n){
            return '¥ ' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function renderFeeSection(r){
            if(!r.totalFee) return '';
            var total = parseFloat(String(r.totalFee).replace(/,/g, '')) || 0;
            var self  = parseFloat(String(r.selfFee).replace(/,/g, '')) || 0;
            var insured = Math.max(total - self, 0);
            var feeGroup = {
                name: '费用信息',
                rows: [
                    { k: '门急诊总费用', v: fmtMoney(total) },
                    { k: '自付金额',     v: fmtMoney(self) },
                    { k: '医保支付',     v: fmtMoney(insured) }
                ]
            };
            return renderBasicGroup(feeGroup);
        }

        /* ============================================================
           检查 / 检验报告列表面板（卡片列表样式）
           type: 'exam' 检查报告 | 'lab' 检验报告
           ============================================================ */
        function renderReportPane(type){
            var r = RECORDS[currentIdx];
            var list = (type === 'exam') ? r.exams : r.labs;
            var emptyIcon = (type === 'exam') ? '🩻' : '🧪';
            var emptyText = (type === 'exam') ? '本次就诊未上传检查报告' : '本次就诊未上传检验报告';
            var alertText = (type === 'exam') ? '检查报告以医疗机构最终归档的影像/图文资料为准。' : '检验报告以医疗机构最终归档的实验室数据为准。';

            if(!list || !list.length){
                return '<div class="card">' +
                    '<div class="empty-state"><div class="empty-icon">' + emptyIcon + '</div><div class="empty-text">' + emptyText + '</div></div>' +
                    '</div>' +
                    '<div class="alert-bar">' + alertText + '</div>';
            }

            var cardsHtml = list.map(function(item){
                return '<div class="report-card" onclick="showToast(\'查看报告：' + item.name + '\')">' +
                    '<div class="report-card-name">' + item.name + '</div>' +
                    '<div class="report-card-time">' + item.date + ' ' + item.time + '</div>' +
                    '<div class="report-card-hospital">' +
                        '<span class="hosp-icon" aria-hidden="true"></span>' +
                        '<span>' + item.hospital + '</span>' +
                    '</div>' +
                    '</div>';
            }).join('');

            return '<div class="report-list">' + cardsHtml + '</div>' +
                '<div class="alert-bar">' + alertText + '</div>';
        }

        /* ============================================================
           Toast 提示
           ============================================================ */
        var toastTimer;
        function showToast(msg){
            var existing = document.getElementById('toastEl');
            if(existing) existing.parentNode.removeChild(existing);

            var el = document.createElement('div');
            el.id = 'toastEl';
            el.textContent = msg;
            el.style.cssText = 'position:fixed;bottom:48px;left:50%;transform:translateX(-50%);' +
                'background:rgba(21,23,28,.94);color:#fff;font-size:14px;font-weight:500;' +
                'padding:10px 20px;border-radius:20px;box-shadow:0 8px 24px rgba(16,24,40,.15);' +
                'z-index:999;pointer-events:none;max-width:280px;text-align:center;' +
                'font-family:PingFangSC-Medium,Microsoft YaHei,sans-serif;';
            document.body.appendChild(el);

            clearTimeout(toastTimer);
            toastTimer = setTimeout(function(){
                if(el.parentNode) el.parentNode.removeChild(el);
            }, 1800);
        }

        /* ============================================================
           事件绑定
           ============================================================ */
        document.getElementById('btnBack').addEventListener('click', function(){
            window.location.href = '门诊记录.html';
        });
        document.getElementById('btnCircle').addEventListener('click', function(){
            showToast('设置');
        });

        /* ============================================================
           启动
           ============================================================ */
        initDetail();
    </script>

</body>
</html>
