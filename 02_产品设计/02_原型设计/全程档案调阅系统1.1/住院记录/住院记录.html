    <style>
      /* ============================================================
         住院记录列表 —— 沿用门诊记录列表样式（Lanhu 基准）
         覆盖项：适配住院数据（诊断名称较长、4 张卡片）
         数据来源：就诊索引事件表 TB_SY_JZS（CHZJZLXBM = 3）
         ============================================================ */
      .list_1 { height: auto; }

      /* 诊断名称：放开固定宽度，过长省略 */
      .text_6-0, .text_6-1, .text_6-2, .text_6-3 {
        width: auto;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* 入院时间行 */
      .text-wrapper_2-0, .text-wrapper_2-1, .text-wrapper_2-2, .text-wrapper_2-3 {
        margin: 4px 0 0 0;
      }
      /* 机构 + 科室行：容纳较长医院名称 */
      .group_3-0, .group_3-1, .group_3-2, .group_3-3 {
        margin: 8px 16px 0 0;
      }
      .image-text_3-0, .image-text_3-1, .image-text_3-2, .image-text_3-3 {
        width: 170px;
      }
      .text-group_4-0, .text-group_4-1, .text-group_4-2, .text-group_4-3 {
        width: auto;
      }

      /* ---------- 第四张卡片（危重状态，红色）样式 ---------- */
      .list-items_1-3 {
        background-color: rgba(255, 255, 255, 1);
        border-radius: 8px;
        margin-bottom: 16px;
        padding: 16px 16px 16px 16px;
      }
      .text-wrapper_1-3 { width: 311px; }
      .text_6-3 {
        overflow-wrap: break-word;
        color: rgba(51, 51, 51, 1);
        font-size: 16px;
        font-family: PingFangSC-Medium;
        font-weight: 500;
        text-align: left;
        white-space: nowrap;
        line-height: 22px;
      }
      .text_7-3 {
        overflow-wrap: break-word;
        font-size: 14px;
        font-family: PingFangSC-Regular;
        text-align: left;
        white-space: nowrap;
        line-height: 20px;
        margin-top: 1px;
        color: rgba(242, 43, 38, 1);
      }
      .text-wrapper_2-3 { margin: 4px 0 0 0; }
      .text_8-3 {
        overflow-wrap: break-word;
        color: rgba(102, 102, 102, 1);
        font-size: 14px;
        font-family: PingFangSC-Regular;
        text-align: left;
        white-space: nowrap;
        line-height: 20px;
      }
      .group_3-3 { margin: 8px 16px 0 0; }
      .thumbnail_4-3 { width: 14px; height: 14px; margin: 3px 0 3px 0; }
      .image-text_3-3 { width: 170px; margin-left: 4px; }
      .text-group_3-3 {
        overflow-wrap: break-word;
        color: rgba(102, 102, 102, 1);
        font-size: 14px;
        font-family: PingFangSC-Regular;
        text-align: left;
        white-space: nowrap;
        line-height: 20px;
      }
      .thumbnail_5-3 { width: 10px; height: 6px; margin: 7px 0 7px 0; }
      .image-text_4-3 { width: 74px; margin-left: 8px; }
      .thumbnail_6-3 { width: 14px; height: 14px; margin: 3px 0 3px 0; }
      .text-group_4-3 {

        font-size: 14px;
        font-family: PingFangSC-Regular;
        text-align: left;
        white-space: nowrap;
        line-height: 20px;
      }

    <script>
      // 返回按钮：点击返回首页
      var backBtn = document.querySelector('.label_1');
      if (backBtn) {
        backBtn.style.cursor = 'pointer';
        backBtn.addEventListener('click', function () {
          window.location.href = '../index.html';
        });
      }

      // 列表卡片点击跳转至住院记录详情（按记录 id 传参）
      var cardMap = { 'list-items_1-0': 1, 'list-items_1-1': 2, 'list-items_1-2': 3, 'list-items_1-3': 4 };
      Object.keys(cardMap).forEach(function (cls) {
        var el = document.querySelector('.' + cls);
        if (el) {
          el.style.cursor = 'pointer';
          el.addEventListener('click', function () {
            window.location.href = '住院记录详情.html?id=' + cardMap[cls];
          });
        }
      });
    </script>
