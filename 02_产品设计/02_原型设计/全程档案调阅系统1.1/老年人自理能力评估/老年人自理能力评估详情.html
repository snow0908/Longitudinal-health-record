<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>自理能力评估详情</title>
    <style>
        /* ============================================================
           老年人自理能力评估 详情页（填报后结果展示）
           基准宽度：375px，样式规范与 病案首页详情 / 高血压专项 一致
           只展示结果数据：基本信息 + 总计得分 + 自理能力等级
           判定标准：0-3分可自理；4-8分轻度依赖；9-18分中度依赖；≥19分不能自理
           ============================================================ */

        /* ---------- Reset & Base ---------- */
        * { box-sizing: border-box; flex-shrink: 0; margin: 0; padding: 0; }
        body {
            font-family: PingFangSC-Regular, Roboto, Helvetica Neue, Helvetica, Tahoma, Arial, PingFang SC-Light, Microsoft YaHei;
            background-color: #F3F5F7;
            -webkit-font-smoothing: antialiased;
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .flex-col { display: flex; flex-direction: column; }
        .flex-row { display: flex; flex-direction: row; }
        .justify-between { display: flex; justify-content: space-between; }
        .align-center { display: flex; align-items: center; }

        /* ---------- Page ---------- */
        .page {
            background-color: #F3F5F7;
            position: relative;
            width: 100%;
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 16px;
        }

        /* ============================================================
           导航栏
           ============================================================ */
        .group_1 {
            background-color: rgba(255, 255, 255, 1);
            padding: 14px 16px 7px 16px;
        }
        .box_1 {
            display: flex; flex-direction: row; align-items: center;
            margin: 0 10px 0 24px;
        }
        .status-spacer { flex: 1; }
        .text_1 {
            overflow-wrap: break-word;
            color: rgba(0, 0, 0, 1);
            font-size: 16px;
            letter-spacing: 1.100000023841858px;
            font-family: PingFangSC-Semibold;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            line-height: 22px;
        }
        .thumbnail_1 { width: 19px; height: 12px; margin: 5px 0; }
        .text_2 {
            overflow-wrap: break-word;
            color: rgba(0, 0, 0, 1);
            font-size: 12px;
            letter-spacing: 0.925000011920929px;
            font-family: PingFangSC-Semibold;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            line-height: 17px;
            margin: 3px 0 0 6px;
        }
        .image_1 { width: 25px; height: 13px; margin: 5px 0 4px 6px; }
        .box_2 {
            margin-top: 15px;
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: nowrap;
        }
        .label_1 { width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; }
        .text_3 {
            flex: 1; min-width: 0;
            overflow-wrap: break-word;
            color: rgba(51, 51, 51, 1);
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            line-height: 22px;
            margin: 4px 0 0 34px;
        }
        .image_2 { width: 78px; height: 30px; flex-shrink: 0; }

        /* ============================================================
           白色内容卡片
           ============================================================ */
        .card {
            background-color: #FFFFFF;
            margin-top: 16px;
            padding: 16px;
        }

        /* ============================================================
           信息行：左侧固定 136px（标签） + 右侧自适应（值）
           ============================================================ */
        .info-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin: 8px 0 0 0;
        }
        .info-label {
            width: 136px;
            flex-shrink: 0;
            color: #333333;
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
            line-height: 22px;
        }
        .info-value {
            flex: 1;
            color: #666666;
            font-size: 16px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            text-align: left;
            line-height: 22px;
            word-break: break-word;
        }

        /* ============================================================
           分区标题
           ============================================================ */
        .section-title {
            color: #333333;
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
            line-height: 22px;
        }

        /* ============================================================
           评估结果：总计得分 + 自理能力等级
           ============================================================ */
        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 8px;
            margin-top: 14px;
            padding: 22px 16px 20px;
        }
        .result-box--ok     { background-color: #F0FDF6; }
        .result-box--light  { background-color: #FFF8EE; }
        .result-box--mid    { background-color: #F0F6FF; }
        .result-box--severe { background-color: #FEF1F1; }
        .result-label {
            color: #666666;
            font-size: 13px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            line-height: 18px;
        }
        .result-score {
            display: flex;
            align-items: baseline;
            margin-top: 2px;
        }
        .result-score b {
            font-size: 40px;
            font-family: PingFangSC-Semibold;
            font-weight: 600;
            line-height: 50px;
        }
        .result-score em {
            font-style: normal;
            font-size: 14px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            color: #999999;
            margin-left: 3px;
        }
        .result-tag {
            display: inline-block;
            font-size: 14px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            line-height: 20px;
            padding: 4px 18px;
            border-radius: 16px;
            border: 1px solid;
            background-color: #FFFFFF;
            margin-top: 6px;
        }
        .result-tag--ok     { color: #15CF6E; border-color: #15CF6E; }
        .result-tag--light  { color: #FF9500; border-color: #FF9500; }
        .result-tag--mid    { color: #096AFF; border-color: #096AFF; }
        .result-tag--severe { color: #F22B26; border-color: #F22B26; }

        /* ============================================================
           各项评估结果：事项 + 程度等级
           ============================================================ */
        .item-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid #F0F0F0;
        }
        .item-row:last-child { border-bottom: none; }
        .item-info { flex: 1; min-width: 0; }
        .item-name {
            color: #333333;
            font-size: 16px;
            font-family: PingFangSC-Medium;
            font-weight: 500;
            line-height: 22px;
        }
        .item-desc {
            color: #999999;
            font-size: 13px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            line-height: 18px;
            margin-top: 2px;
            word-break: break-word;
        }
        .level-chip {
            font-size: 12px;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            white-space: nowrap;
            line-height: 18px;
            padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .level-chip--ok     { color: #15CF6E; border-color: #15CF6E; background-color: #F0FDF6; }
        .level-chip--light  { color: #FF9500; border-color: #FF9500; background-color: #FFF8EE; }
        .level-chip--mid    { color: #096AFF; border-color: #096AFF; background-color: #F0F6FF; }
        .level-chip--severe { color: #F22B26; border-color: #F22B26; background-color: #FEF1F1; }

        /* ---------- 提示条（判定标准） ---------- */
        .alert-bar {
            margin-top: 12px;
            padding: 10px 12px;
            background-color: #FFF8E5;
            border: 1px solid #FFE0A6;
            border-radius: 8px;
            font-size: 12px;
            color: #8A6A2C;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            line-height: 18px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .alert-bar::before {
            content: "ⓘ";
            color: #FEA800;
            font-size: 14px;
            flex-shrink: 0;
            line-height: 18px;
        }

        /* ============================================================
           底部脚注
           ============================================================ */
        .footer-note {
            padding: 16px 16px 0 16px;
            text-align: center;
            font-size: 12px;
            color: #999999;
            font-family: PingFangSC-Regular;
            font-weight: 400;
            line-height: 17px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 375px) {
            .card { padding: 16px 12px; }
            .info-label { width: 112px; font-size: 15px; }
            .info-value { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="page flex-col">

        <!-- ==================== 导航栏 ==================== -->
        <div class="group_1 flex-col">
            <div class="box_1 flex-row">
                <span class="text_1">10:19</span>
                <span class="status-spacer"></span>
                <img class="thumbnail_1" referrerpolicy="no-referrer" src="../img/信号.png" />
                <span class="text_2">5G</span>
                <img class="image_1" referrerpolicy="no-referrer" src="../img/电量.png" />
            </div>
            <div class="box_2 flex-row">
                <img class="label_1" referrerpolicy="no-referrer" src="../img/返回.png" />
                <span class="text_3">自理能力评估详情</span>
                <img class="image_2" referrerpolicy="no-referrer" src="../img/设置.png" />
            </div>
        </div>

        <!-- ==================== 卡片1：评估结果 ==================== -->
        <div class="card flex-col">
            <span class="section-title">评估结果</span>
            <div class="result-box" id="resultBox">
                <span class="result-label">总计得分</span>
                <div class="result-score" id="resultScore"><b>—</b><em>分</em></div>
                <span class="result-tag" id="resultTag">—</span>
            </div>
            <div class="alert-bar">
                判定标准：合计评分 0–3 分为可自理；4–8 分为轻度依赖；9–18 分为中度依赖；≥19 分为不能自理
            </div>
        </div>

        <!-- ==================== 卡片2：各项评估结果 ==================== -->
        <div class="card flex-col">
            <span class="section-title">各项评估结果</span>
            <div id="itemResults" class="flex-col" style="margin-top: 6px;"></div>
        </div>

        <!-- ==================== 卡片3：基本信息（评估医师 / 评估日期 / 所在机构） ==================== -->
        <div class="card flex-col">
            <span class="section-title">基本信息</span>
            <div class="info-row" style="margin-top: 12px;">
                <span class="info-label">评估医师</span>
                <span class="info-value" id="vDoctor">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">评估日期</span>
                <span class="info-value" id="vDate">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">所在机构</span>
                <span class="info-value" id="vOrg">—</span>
            </div>
        </div>

        <!-- ==================== 底部脚注 ==================== -->
        <div class="footer-note" id="footerNote">
            编号 11200066 · 评估于 —
        </div>

    </div>

    <script>
        /* ============================================================
           数据定义（依据老年人自理能力评估填报表）
           ITEMS：评估事项与内容；picks：各事项选中的程度等级下标（0-可自理 / 1-轻度依赖 / 2-中度依赖 / 3-不可自理）
           ITEM_SCORES：各事项四级分值，仅用于汇总总计得分
           ============================================================ */
        var ITEMS = [
            { name: '进餐', desc: '使用餐具将饭菜送入口、咀嚼、吞咽等活动' },
            { name: '梳洗', desc: '梳头、洗脸、刷牙、剃须、洗澡等活动' },
            { name: '穿衣', desc: '穿衣裤、袜子、鞋子等活动' },
            { name: '如厕', desc: '小便、大便等活动及自控' },
            { name: '活动', desc: '站立、室内行走、上下楼梯、户外活动' }
        ];

        var LEVEL_NAMES = ['可自理', '轻度依赖', '中度依赖', '不可自理'];
        var LEVEL_CLASS = ['ok', 'light', 'mid', 'severe'];

        var ITEM_SCORES = [
            [0, 1, 3, 5],    /* 进餐 */
            [0, 1, 3, 7],    /* 梳洗 */
            [0, 1, 3, 5],    /* 穿衣 */
            [0, 1, 5, 10],   /* 如厕 */
            [0, 1, 5, 10]    /* 活动 */
        ];

        var RECORDS = {
            1: { doctor: '夏亮',   date: '2026-09-07', org: '北京市朝阳区望京社区卫生服务中心', picks: [2, 0, 0, 1, 0] },
            2: { doctor: '刘玉玉', date: '2026-06-15', org: '北京市朝阳区望京社区卫生服务中心', picks: [0, 0, 0, 0, 0] },
            3: { doctor: '张永健', date: '2026-03-20', org: '北京市朝阳区望京社区卫生服务中心', picks: [2, 1, 2, 2, 2] },
            4: { doctor: '夏亮',   date: '2025-12-08', org: '北京市朝阳区望京社区卫生服务中心', picks: [3, 2, 2, 2, 3] }
        };

        /* 等级判定：0-3可自理；4-8轻度依赖；9-18中度依赖；≥19不能自理 */
        var LEVELS = {
            ok:     { name: '可自理',   color: '#15CF6E' },
            light:  { name: '轻度依赖', color: '#FF9500' },
            mid:    { name: '中度依赖', color: '#096AFF' },
            severe: { name: '不能自理', color: '#F22B26' }
        };

        function levelOf(total) {
            if (total <= 3) { return 'ok'; }
            if (total <= 8) { return 'light'; }
            if (total <= 18) { return 'mid'; }
            return 'severe';
        }

        /* ============================================================
           渲染
           ============================================================ */
        function getParam(name) {
            var match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        var recordId = getParam('id');
        var record = RECORDS[recordId] || RECORDS[1];

        /* 基本信息 */
        document.getElementById('vDoctor').textContent = record.doctor;
        document.getElementById('vDate').textContent = record.date;
        document.getElementById('vOrg').textContent = record.org;
        document.getElementById('footerNote').textContent = '编号 11200066 · 评估于 ' + record.date;
        document.title = '自理能力评估详情 · ' + record.date;

        /* 评估结果：总计得分 + 等级 */
        var total = record.picks.reduce(function (sum, pick, i) {
            return sum + ITEM_SCORES[i][pick];
        }, 0);

        var levelKey = levelOf(total);
        var level = LEVELS[levelKey];

        var box = document.getElementById('resultBox');
        box.className = 'result-box result-box--' + levelKey;

        var score = document.getElementById('resultScore');
        score.innerHTML = '<b>' + total + '</b><em>分</em>';
        score.querySelector('b').style.color = level.color;

        var tag = document.getElementById('resultTag');
        tag.textContent = level.name;
        tag.className = 'result-tag result-tag--' + levelKey;

        /* 各项评估结果 */
        var itemHtml = '';
        ITEMS.forEach(function (item, i) {
            var pick = record.picks[i];
            itemHtml += '<div class="item-row">'
                + '<div class="item-info">'
                +   '<div class="item-name">' + item.name + '</div>'
                +   '<div class="item-desc">' + item.desc + '</div>'
                + '</div>'
                + '<span class="level-chip level-chip--' + LEVEL_CLASS[pick] + '">' + LEVEL_NAMES[pick] + '</span>'
                + '</div>';
        });
        document.getElementById('itemResults').innerHTML = itemHtml;

        /* 返回列表页 */
        document.querySelector('.label_1').addEventListener('click', function () {
            window.location.href = '老年人自理能力评估列表.html';
        });
    </script>

</body>
</html>
